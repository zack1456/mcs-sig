name: Source library checks

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run literature maintenance tests
        run: python -m unittest discover -s tests -v
      - name: Check source library without network dependencies
        run: python scripts/literature.py check
      - name: Write machine-readable audit report
        if: always()
        run: python scripts/literature.py check --format json > source-library-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-library-audit
          path: source-library-audit.json

  online-identifiers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify DOI and PMID metadata
        run: python scripts/validate_sources.py --all
