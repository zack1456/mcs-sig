repos:
  - repo: local
    hooks:
      - id: validate-sources
        name: Validate source JSON DOIs and PMIDs (CrossRef + PubMed)
        language: python
        entry: python scripts/validate_sources.py --files
        files: ^aiml_wg/sources/papers/.*\.json$
        pass_filenames: true
        always_run: false
        description: >
          Resolves every DOI against CrossRef and every PMID against NCBI PubMed.
          Fails if a DOI returns 404 (hallucinated) or if it resolves to a paper
          with a title that does not match the JSON record. Set doi/pmid to null
          for unconfirmed preprints rather than guessing.

