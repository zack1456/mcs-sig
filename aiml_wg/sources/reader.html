perts before runnable"],"methods_discussed":["LLM_code_generation","NONMEM","pharmacometrics","prompt_engineering","population_PK"],"datasets_referenced":[],"tools_software":["NONMEM","ChatGPT_4.0","Gemini_Ultra_1.0"],"limitations":["Paywalled — full text not available for extraction","Only two LLMs evaluated; does not include Claude, Llama, or other models","Only two NONMEM coding tasks; does not test PD models, covariate models, or more complex NONMEM features","Two expert reviewers — evaluation may be subjective; no automated scoring of code correctness"],"extracted_claims":[{"text":"Large language models may be useful in pharmacometrics for efficiently generating an initial coding template for modeling projects. However, the output can contain errors and omissions that require correction.","location":"Abstract / Conclusions","evidence_type":"empirical"},{"text":"The code output from ChatGPT and Gemini was not reproducible, and varying the temperature hyperparameter did not reduce the errors and omissions substantively.","location":"Abstract","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Number of NONMEM expert reviewers who assessed LLM-generated code","value":"2","value_numeric":2,"unit":"N (expert reviewers)","comparison_baseline":null,"location":"Methods","is_primary_finding":false}]},"relevance":{"pillars":["generative_ai"],"gaps_addressed":["Primary empirical evidence for M4.4 (LLMs for pharmacometrics): first systematic evaluation of ChatGPT/Gemini specifically for NONMEM coding tasks — directly relevant to WG discussions of LLM integration into pharmacometric workflows","Establishes baseline LLM capability (2024): LLMs can scaffold NONMEM code but are not reliable enough to replace expert modelers — important calibration point for the WG's recommendations on LLM adoption","Reproducibility finding is critical: non-reproducible LLM outputs are a regulatory red flag — directly relevant to FDA guidance on AI/ML reliability"],"topics":["LLM","NONMEM","pharmacometrics","ChatGPT","Gemini","code_generation","reproducibility","AI_tools_evaluation"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["androulakis_2025_qsp","cha_2025_nonmem_interpretation","kwack_2026_pkgpt","zheng_2025_llm"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'LLM drug development pharmacometrics' (PMID 38656706). DOI: 10.1007/s10928-024-09921-y. JPKPD 2024, 51(3):187-197. Paywalled (Springer). U Buffalo (Ramanathan M = corresponding, Murali@Buffalo.Edu). androulakis_2025_qsp cites this paper in context of LLMs generating NONMEM code. This is the core empirical LLM-pharmacometrics paper in the library — complement with androulakis_2025_qsp for the broader QSP perspective."},"title_short":"ChatGPT and Gemini for NONMEM coding: LLM pharmacometrics evaluation (Shin et al., U Buffalo, JPKPD 2024)"},{"id":"androulakis_2025_qsp","source_type":"paper","title":"The dawn of a new era: can machine learning and large language models reshape QSP modeling?","authors":["Androulakis IP","Cucurull-Sanchez L","Kondic A","Mehta K","Pichardo C","Pryor M","Renardy M"],"year":2025,"doi":"10.1007/s10928-025-09984-5","pmid":40524056,"url":null,"journal_or_venue":"Journal of Pharmacokinetics and Pharmacodynamics","content":{"abstract_summary":"Perspective/review paper authored entirely by ISoP QSP SIG members, articulating the QSP SIG's vision for how AI/ML and LLMs will transform QSP modeling. Organized around four primary AI/ML contributions: (1) literature mining and data extraction, (2) surrogate model development and digital twins, (3) network inference to translate data into mechanistic models, (4) hybrid mechanistic-ML frameworks. Then asks whether LLMs will transition AI from 'tool to partner' in QSP. No quantitative results — all narrative and forward-looking. JPKPD 2025.","key_findings":["QSP SIG's four-part AI/ML vision: enhanced literature mining → surrogate models + digital twins → automated network inference → hybrid mechanistic-ML; LLMs are framed as enabling all four as an 'active partner' rather than a mere tool","Hybrid mechanistic-ML architectures: two classes described — (1) physics-informed ML (PINNs, fPINNs) where ODEs constrain the neural network loss function; (2) composite models where mechanistic modules handle known components and ML handles poorly-understood or data-rich elements — these framings map directly onto the MCS SIG's hybrid_foundations pillar","Surrogate models definition: 'simplified mathematical or computational representation of a more complex system designed to approximate its behavior while significantly reducing computational cost'; described as embedded within digital twins to enable real-time prediction without full QSP model calls","Digital twin definition (QSP SIG framing): 'dynamic, virtual representation of a physical system or process that evolves, integrating real-time data to provide insights, monitor performance, and predict outcomes'; consistent with but less rigorous than dette_2025's three-criterion definition","LLMs positioned as democratization tools: 'the user does not need to be a domain expert!'; LLMs empower non-coding researchers to build QSP models; risk of over-reliance and hallucinations explicitly acknowledged","Key regulatory challenges raised: validation pipelines, LLM hallucinations in regulatory documentation, RAG as mitigation strategy, accountability in AGI-assisted dosing decisions, harmonization of standards across regions","Explicitly cites shin_2024_llm (NONMEM code generation paper) and other LLM-pharmacometrics evaluations as evidence of current LLM capabilities"],"methods_discussed":["QSP","hybrid_mechanistic_ML","PINN","surrogate_models","digital_twins","LLM","RAG","literature_mining","Boolean_network_inference","virtual_populations"],"datasets_referenced":[],"tools_software":["ChatGPT","GPT-4","Gemini","Claude","LLaMA","BLOOM","PubMedGPT","BioGPT","GitHub_Copilot","NONMEM"],"limitations":["No quantitative results or case studies — entirely qualitative perspective paper","Forward-looking claims about LLMs and AGI as QSP partners are speculative and not empirically grounded","Does not engage with MCS-specific concerns: structural identifiability, optimal control, or rigorous UQ — focuses on QSP/ML workflow democratization","Hallucination risk explicitly acknowledged but no concrete mitigation beyond suggesting RAG — 'studies have highlighted the need for caution, suggesting that AI/ML should not be unquestioningly trusted'"],"extracted_claims":[{"text":"In contrast to the traditional use of ML solely as a tool, the emergence of ChatGPT has marked a pivotal moment, dramatically shifting the landscape of AI/ML by introducing broadly Large Language Models (LLMs) as transformative tools.","location":"Main text","evidence_type":"opinion"},{"text":"LLMs will drive the evolution of machine learning from a tool whose use requires a significant level of expertise to an active partner in mathematical and computational modeling in QSP.","location":"Discussion","evidence_type":"opinion"},{"text":"the user does not need to be a domain 'expert'! One can identify many issues associated with accuracy and correctness, but we must also realize that we only witness the early beginnings of an upcoming revolution.","location":"Main text","evidence_type":"opinion"},{"text":"Treating AI/ML as a toolbox must be held to standards at least as high as those of conventional model assessment.","location":"Discussion","evidence_type":"opinion"}],"numerical_findings":[]},"relevance":{"pillars":["generative_ai","hybrid_foundations"],"gaps_addressed":["Critical competitive intelligence: this is the QSP SIG's own articulation of their AI/ML strategy — understanding QSP SIG's framing allows the MCS SIG AI/ML WG to differentiate on mathematical rigor (structural identifiability, UQ, optimal control) vs. QSP SIG's focus on workflow democratization and LLM-as-partner","Directly relevant to M4.4 (LLMs for pharmacometrics): the paper explicitly covers LLM applications in QSP including NONMEM code generation, literature mining, and model building assistance — provides the QSP SIG's own taxonomy of where LLMs add value","Hybrid mechanistic-ML framing (PINN + composite models) is the QSP SIG's vocabulary for the same concepts covered in MCS SIG's hybrid_foundations pillar — useful for the scoping paper to position MCS's mathematical depth (identifiability, UQ) as complementary to QSP SIG's modeling breadth"],"topics":["QSP_SIG","LLM","hybrid_mechanistic_ML","PINN","surrogate_models","digital_twins","democratization","pharmacometrics","cross_SIG","competitive_intelligence","ISoP","Androulakis","Pharmetheus","BMS","AstraZeneca","GSK"],"relevance_score":"high"},"relationships":{"cites":["shin_2024_llm"],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"full_text","notes":"Found via PubMed search 'LLM drug development pharmacometrics' (PMID 40524056). Full text retrieved from PMC12170689 (DOI: 10.1007/s10928-025-09984-5). JPKPD 2025, 52(4):36. Open access. All 7 authors list dual ISoP QSP SIG affiliations. Androulakis IP = Rutgers Biomedical Engineering + QSP SIG; Cucurull-Sanchez L = Pharmetheus + QSP SIG; Kondic A = BMS + QSP SIG; Mehta K = Kyowa Kirin + QSP SIG; Pichardo C = AstraZeneca + QSP SIG; Pryor M = J&J + QSP SIG; Renardy M = GSK + QSP SIG. This paper is the QSP SIG's official perspective on AI/ML — treat as cross-SIG intelligence. MCS SIG WG should be aware of this framing when positioning its own contributions. The democratization focus of QSP SIG vs. mathematical rigor focus of MCS SIG is a natural differentiator."},"title_short":"QSP SIG AI/ML + LLM perspective: surrogate models, digital twins, LLM as partner (Androulakis et al., JPKPD 2025)"},{"id":"najjar_2024_gsa","source_type":"paper","title":"Global sensitivity analysis of Open Systems Pharmacology Suite physiologically based pharmacokinetic models","authors":["Najjar A","Hamadeh A","Krause S","Schepky A","Edginton A"],"year":2024,"doi":"10.1002/psp4.13256","pmid":39498820,"url":null,"journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Tutorial paper presenting a new open-source R package (with GUI) for conducting one-at-a-time (OAT) and global sensitivity analysis (GSA) of PBPK models built in the Open Systems Pharmacology (OSP) Suite. OAT methods: local sensitivity analysis (LSA) and probabilistic uncertainty analysis (UA). GSA methods: Morris screening, Sobol variance decomposition, and EFAST. All outputs formatted per WHO IPCS regulatory standards. Demonstrated on three case studies: (1) itraconazole IV in PK-Sim; (2) UV filter dermal absorption in MoBi; (3) rifampicin-midazolam DDI in PK-Sim. Edginton group, University of Waterloo + Beiersdorf AG. CPT:PSP 2024.","key_findings":["Recommended workflow: Morris screening first to identify candidate influential parameters → Sobol or EFAST variance decomposition on the surviving subset; Morris is computationally efficient and appropriate for ranking; Sobol/EFAST for quantifying parameter interactions (T_i vs. S_i gap)","OAT vs. GSA discrepancy demonstrated empirically (Case Study 2, UV filters): local sensitivity analysis identified parameter β as most influential, but uncertainty analysis and all three GSA methods found β relatively unimportant — demonstrates that OAT can give misleading conclusions and GSA is necessary for regulatory submissions","Case Study 1 (itraconazole): 5 of 28 parameters most influential (lipophilicity/log P and fraction unbound/fu of parent compound dominant); CYP3A4 Michaelis constant K_m and inhibition constant K_i not influential — useful result for PBPK model calibration prioritization","Case Study 3 (rifampicin-midazolam DDI): E_max (maximal CYP3A4 induction by rifampicin) most influential for AUC and C_max DDI ratios; significant Sobol T_i vs. S_i gaps for fu, k_cat, K_m indicate important parameter interactions — cannot be detected by OAT","Regulatory compliance: outputs formatted per WHO IPCS guidance (sensitivity classification: High/Medium/Low/Negligible); DDI ratio analysis directly addresses a key FDA/EMA PBPK submission requirement","Package provides both R script and GUI interfaces; input parameter distributions supported: uniform, log-uniform, normal, log-normal; future work: correlated parameter distributions"],"methods_discussed":["global_sensitivity_analysis","local_sensitivity_analysis","Morris_screening","Sobol_indices","EFAST","PBPK","uncertainty_analysis","DDI_modeling","OSP_Suite","PK-Sim","MoBi","WHO_IPCS","Monte_Carlo"],"datasets_referenced":["itraconazole_Hanke_OSP_PBPK_model","UV_filter_dermal_absorption_Hamadeh_MoBi_model","rifampicin_midazolam_DDI_Hanke_OSP_PBPK_model_Backman_clinical_data"],"tools_software":["PK-Sim","MoBi","OSPSuite_R_package","R","PKML_format"],"limitations":["Parameter distribution options in initial release limited to uniform, log-uniform, normal, log-normal — no correlated parameter support; future work needed","Only three case studies demonstrated; broader validation with additional PBPK models needed","Computational cost of GSA higher than OAT — acknowledged trade-off; Morris recommended as efficient screening step before Sobol","WHO IPCS guideline defines uncertainty ratio as 95th/50th percentile (always ≥1); package uses 2.5th–97.5th CI / median (can be <1); same thresholds applied regardless — minor methodological deviation from WHO standard"],"extracted_claims":[{"text":"Sensitivity analysis...is a requirement in PBPK reports submitted to regulatory agencies.","location":"Introduction","evidence_type":"factual"},{"text":"The illustrative examples presented here discuss the potential role of global sensitivity methods in identifying influential parameters that may not be detected through local sensitivity analyses alone.","location":"Conclusions","evidence_type":"empirical"},{"text":"The local sensitivity analysis suggests that the plasma AUC of both octocrylene and oxybenzone are strongly influenced by parameter [β]. However, the uncertainty analysis shows that when the influence of each parameter is examined over its entire range, parameter [β] has a relatively small influence.","location":"Case Study 2 Results","evidence_type":"empirical"},{"text":"The package not only ensures compliance with regulatory requirements for PBPK submissions but also enhances the depth of insights derived from sensitivity analyses.","location":"Conclusions","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Number of PBPK model parameters analyzed in itraconazole case study","value":"28","value_numeric":28,"unit":"N (parameters across 4 compounds: parent + 3 metabolites)","comparison_baseline":null,"location":"Case Study 1 Methods","is_primary_finding":false}]},"relevance":{"pillars":["uq_identifiability"],"gaps_addressed":["Fills the GSA/Sobol gap for PBPK identified in the work stream analysis: provides a practical open-source tool (R package + GUI) for conducting Morris, Sobol, and EFAST analyses on OSP Suite PBPK models — directly actionable for WG members doing PBPK work","Connects to chenel_2026 (ICH M15 PBPK regulatory requirements): Najjar provides the computational methodology for the GSA that chenel_2026 identifies as required for regulatory PBPK submissions; the two papers complement each other directly","Demonstrates OAT vs. GSA discrepancy with concrete example: provides the WG a publishable argument that global SA should replace local SA as the standard for PBPK submissions — relevant to the MCS SIG's mathematical rigor positioning"],"topics":["global_sensitivity_analysis","Sobol_indices","Morris_method","EFAST","PBPK","OSP_Suite","PK-Sim","regulatory_submissions","WHO_IPCS","DDI","uncertainty_analysis","Edginton","University_of_Waterloo","Beiersdorf"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"full_text","notes":"Found via PubMed search 'global sensitivity analysis PBPK' (PMID 39498820). Full text retrieved from PMC11646943 (DOI: 10.1002/psp4.13256). CPT:PSP 2024, 13(12):2052-2067. Open access. Edginton A = U Waterloo + Systems In Silico Ltd (corresponding); Najjar A + Krause S + Schepky A = Beiersdorf AG (Hamburg); Hamadeh A = U Waterloo + Systems In Silico. R package hosted on GitHub (exact name not parsed from full text). Package PKML files for all 3 case studies included. The itraconazole model (Hanke et al.) and midazolam/rifampicin models are publicly available from OSP GitHub — directly downloadable by WG members. Connect to chenel_2026 which identified GSA as necessary for ICH M15 regulatory submissions."},"title_short":"GSA tutorial for OSP Suite PBPK: Morris, Sobol, EFAST with regulatory formatting (Najjar et al., Edginton, CPT:PSP 2024)"},{"id":"janzen_2017","source_type":"paper","title":"Extending existing structural identifiability analysis methods to mixed-effects models","authors":["Janzén DLI","Jirstrand M","Chappell MJ","Evans ND"],"year":2017,"doi":"10.1016/j.mbs.2017.10.009","pmid":29107004,"url":null,"journal_or_venue":"Mathematical Biosciences","content":{"abstract_summary":"Extends structural identifiability analysis to mixed-effects (NLME) state-space models — a critical gap because standard identifiability methods were developed for single-subject (non-mixed-effects) models. Two analytical methods presented: (1) Taylor series expansion approach and (2) input-output form approach, both adapted for mixed-effects. The key insight: by generating an exhaustive summary assuming an infinite number of subjects and using uniqueness of analytical statistical moments of functions of random variables, structural identifiability of the mixed-effects model can be determined. Applied to examples of mixed-effects models. AstraZeneca + Chalmers + University of Warwick (Chappell group). Math Biosci 2017.","key_findings":["Structural identifiability for mixed-effects models is non-trivial: standard structural identifiability methods (Taylor series, input-output differential algebra) assume a single-subject state-space model and cannot be directly applied to NLME models","Extension strategy: generate an exhaustive summary by assuming an infinite number of subjects; derive functions of random variables from the observation function; require that the analytical statistical moments of these derived functions be uniquely identifiable — this reduces the NLME identifiability problem to moments-based uniqueness analysis","Two methods successfully adapted: (1) Taylor series expansion; (2) input-output form (differential algebra) approach — both extended to cover mixed-effects models","Applied to PK examples: demonstrates that mixed-effects model structural identifiability depends not only on the fixed-effects structure but also on the random-effects structure (which parameters have IIV)","Key insight for pharmacometrics: a model that is structurally identifiable in fixed-effects settings may not be identifiable when random effects are added on specific parameters — IIV structure matters for identifiability","Foundational paper: establishes the theoretical framework for asking 'is this population PK model structurally identifiable?' — prior to this, the question was not well-posed for NLME models"],"methods_discussed":["structural_identifiability","mixed_effects_models","NLME","Taylor_series_expansion","input_output_form","differential_algebra","statistical_moments","state_space_models"],"datasets_referenced":["illustrative_mixed_effects_model_examples_theoretical"],"tools_software":[],"limitations":["Paywalled — full text not available for extraction; abstract content used","Infinite-subjects assumption is a mathematical idealization that simplifies the identifiability analysis but may not correspond to practical finite-N settings","Analytical methods apply to exact structural identifiability — does not address practical identifiability (parameter uncertainty given finite data, measurement noise), which is the concern in raue_2009","Computational complexity: Taylor series and input-output form approaches become intractable for large-dimensional systems — scaling limitation shared with existing single-subject methods"],"extracted_claims":[{"text":"The concept of structural identifiability for state-space models is expanded to cover mixed-effects state-space models. Two methods applicable for the analytical study of the structural identifiability of mixed-effects models are presented.","location":"Abstract","evidence_type":"methodological"},{"text":"By generating an exhaustive summary, and by assuming an infinite number of subjects, functions of random variables can be derived which in turn determine the distribution of the system's observation function(s). By considering the uniqueness of the analytical statistical moments of the derived functions of the random variables, the structural identifiability of the corresponding mixed-effects model can be determined.","location":"Abstract","evidence_type":"methodological"}],"numerical_findings":[]},"relevance":{"pillars":["uq_identifiability"],"gaps_addressed":["Fills M1.2 (structural identifiability for pharmacometric models): provides the theoretical foundation for asking whether a population PK model (NLME) is structurally identifiable — this question is central to the WG's uq_identifiability pillar and is distinct from single-subject identifiability","Connects to raue_2009 (profile likelihood for practical identifiability) and campo_manzanares_2026 (iNODE for identifiability-aware neural ODEs): janzen_2017 addresses structural identifiability for mixed-effects models; raue_2009 addresses practical identifiability for individual models; campo_manzanares_2026 combines both for neural ODE architectures — together these three papers span the identifiability landscape","AstraZeneca (Janzén) + Chalmers (Jirstrand) + Warwick (Chappell + Evans): all three institutions are leaders in mathematical pharmacology and identifiability — paper carries strong methodological credibility for the WG"],"topics":["structural_identifiability","mixed_effects_models","NLME","population_PK","Taylor_series","differential_algebra","mathematical_pharmacology","AstraZeneca","Chalmers","University_of_Warwick","Chappell_group","Jirstrand"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":["raue_2009"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'identifiability analysis pharmacokinetic nonlinear mixed effects models' (PMID 29107004). DOI: 10.1016/j.mbs.2017.10.009. Math Biosci 2017, 295:1-10. Paywalled (Elsevier). Janzén DLI = AstraZeneca DMPK + Fraunhofer-Chalmers Centre (corresponding, david.janzen@astrazeneca.com); Jirstrand M = Fraunhofer-Chalmers Centre; Chappell MJ + Evans ND = University of Warwick School of Engineering. Chappell group (Warwick) is one of the leading identifiability groups in mathematical biology — their STRIKE-GOLDD MATLAB toolbox and related work are the standard reference. This paper is the foundational NLME identifiability paper. A second PMID from the same search (42477504) was evaluated and skipped (meta-heuristic optimization, CPT:PSP 2026 — too applied for this gap). Extensions field points to raue_2009 because janzen_2017 extends identifiability analysis from fixed-effects (raue_2009 context) to mixed-effects models."},"title_short":"Structural identifiability for NLME mixed-effects models: Taylor series + input-output extension (Janzén et al., AZ+Warwick, Math Biosci 2017)"},{"id":"bejan_2026_iraegpt","source_type":"paper","title":"irAE-GPT: leveraging large language models to identify immune-related adverse events in electronic health records and clinical trial datasets","authors":["Bejan CA","Wang M","Venkateswaran S","Bergmann EA","Hiles L","Xu Y","Chandler GS","Brondfield S","Silverstein J","Wright F","de Dios K","Kim DM","Mukherjee E","Krantz MS","Yao L","Johnson DB","Phillips EJ","Balko JM","Mohindra R","Quandt Z"],"year":2026,"doi":"10.1016/j.ebiom.2026.106227","pmid":41951517,"url":null,"journal_or_venue":"EBioMedicine","content":{"abstract_summary":"Evaluates GPT-3.5, GPT-4, and GPT-4o for automated identification of immune-related adverse events (irAEs) in unstructured clinical notes from EHRs and clinical trial datasets. Zero-shot prompting for multi-label irAE classification. Validated across 442 patients from two EHR systems (Vanderbilt, UCSF) and seven clinical trials — a multi-site, generalizable study. GPT-4o achieved highest F1. Best performance in haematological, gastrointestinal, and musculoskeletal/rheumatologic irAE categories. Key limitation: models over-predicted irAEs (high sensitivity, moderate PPV). Roche co-funded and co-authored. Vanderbilt + UCSF + UCLA + Cedars-Sinai. EBioMedicine 2026.","key_findings":["GPT models can automate irAE detection across diverse healthcare datasets (EHR + clinical trial notes) using zero-shot prompting — no fine-tuning required, enabling rapid deployment across institutions","GPT-4o highest performance: best F1 and micro-averaged F1 for both patient-level and note-level irAE identification; haematological irAE category: F1 range 1.0–1.0; gastrointestinal: F1 range 0.81–0.85; musculoskeletal/rheumatologic: F1 range 0.67–1.0","Key limitation: models bias towards over-predicting irAE outcomes (high sensitivity, moderate positive predictive value) — reflects tendency to report any adverse event as possibly immune-related; 'a potential bias towards overpredicting irAE outcomes'","Critical failure mode: 'substantial limitations of GPT models in handling textual causation, where adverse events should not only be accurately identified in clinical text but also causally linked to immune checkpoint inhibitors' — LLMs identify irAE mentions but cannot reliably establish causal attribution to ICI therapy","Generalizable approach: model trained on no institution-specific data (zero-shot) performs reasonably across 3 institutions and 7 clinical trials — demonstrates domain generalizability of GPT-4o for pharmacovigilance NLP","Multi-label classification: any combination of irAEs per patient simultaneously identified — addresses real-world complexity where patients can have multiple concurrent irAEs"],"methods_discussed":["LLM","zero_shot_prompting","pharmacovigilance","NLP","multi_label_classification","EHR","immune_checkpoint_inhibitors","adverse_event_detection"],"datasets_referenced":["Vanderbilt_EHR_ICI_patients","UCSF_EHR_ICI_patients","seven_clinical_trials_ICI","442_patients_total"],"tools_software":["GPT-3.5","GPT-4","GPT-4o"],"limitations":["Over-prediction bias: high sensitivity but moderate PPV — cannot be used without downstream human review for regulatory purposes","Causal attribution failure: identifies irAE mentions but cannot causally link them to ICI therapy — critical limitation for pharmacovigilance where causality is required","Only ICI-related irAEs evaluated — cannot generalize findings to other drug classes without additional validation","Zero-shot only — fine-tuning was not evaluated and may substantially improve performance"],"extracted_claims":[{"text":"GPT models demonstrated generalisable abilities in identifying irAEs across EHRs and clinical trial reports. Overall, the models achieved relatively high sensitivity and specificity but only moderate positive predictive values, reflecting a potential bias towards overpredicting irAE outcomes.","location":"Results / Abstract","evidence_type":"empirical"},{"text":"Error analysis uncovered substantial limitations of GPT models in handling textual causation, where adverse events should not only be accurately identified in clinical text but also causally linked to immune checkpoint inhibitors.","location":"Abstract","evidence_type":"empirical"},{"text":"This capability will accelerate the generation of safety insights across large healthcare datasets and facilitate the characterisation of patient-level drivers of toxicities, thus enhancing safety monitoring and ultimately improving patient care.","location":"Abstract","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Total patients across validation cohorts (EHR + clinical trials, 3 institutions)","value":"442","value_numeric":442,"unit":"N (patients)","comparison_baseline":null,"location":"Methods","is_primary_finding":false},{"metric_type":"performance_metric","description":"GPT-4o F1 for haematological irAE category (best-performing category)","value":"1.0–1.0","value_numeric":1.0,"unit":"F1 score range","comparison_baseline":"GPT-3.5 and GPT-4 lower F1","location":"Results","is_primary_finding":true},{"metric_type":"performance_metric","description":"GPT-4o F1 for gastrointestinal irAE category","value":"0.81–0.85","value_numeric":0.83,"unit":"F1 score range","comparison_baseline":"GPT-3.5 and GPT-4 lower F1","location":"Results","is_primary_finding":false}]},"relevance":{"pillars":["generative_ai"],"gaps_addressed":["Fills M4.4 (LLMs for pharmacometrics/drug development) in the pharmacovigilance dimension: provides concrete multi-site validation of LLMs for automated adverse drug reaction detection — a key application area in the MCS SIG CLAUDE.md domain context (pharmacovigilance section)","Causal attribution failure is an important message for the WG: LLMs can find irAE mentions but cannot establish causality — directly relevant to regulatory acceptance concerns and to the WG's emphasis on mechanistic grounding for AI outputs","Roche co-authorship and multi-site clinical trial data adds regulatory credibility; GPT-4o zero-shot performance across 7 clinical trials demonstrates practical deployment feasibility at scale"],"topics":["LLM","pharmacovigilance","adverse_drug_reaction","irAE","immune_checkpoint_inhibitors","NLP","EHR","zero_shot","GPT-4","clinical_trials","Vanderbilt","UCSF","Roche"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'LLM foundation model pharmacology biomedical text adverse drug reaction' (PMID 41951517). Full text available from PMC13174231 (DOI: 10.1016/j.ebiom.2026.106227). EBioMedicine 2026, 127:106227. Open access. Bejan CA = Vanderbilt Biomedical Informatics (corresponding, adi.bejan@vanderbilt.edu); multi-institutional: Vanderbilt, UCSF, UCLA, Cedars-Sinai, U Colorado. Roche co-funded and co-authored (Venkateswaran S, Bergmann EA, Hiles L, Chandler GS, Mohindra R). NIH, NHMRC Australia, Larry L. Hillblom Foundation also funded. PMC full text available — upgrade if deeper analysis needed."},"title_short":"irAE-GPT: GPT-4o for pharmacovigilance adverse event detection across EHR + clinical trials (Bejan et al., Vanderbilt+Roche, EBioMedicine 2026)"},{"id":"zheng_2025_llm","source_type":"paper","title":"AI for NONMEM Coding in Pharmacometrics Research and Education: Shortcut or Pitfall?","authors":["Zheng W","Wang W","Kirkpatrick CMJ","Landersdorfer CB","Yao H","Zhou J"],"year":2025,"doi":"10.1002/psp4.70125","pmid":41187068,"url":null,"journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Most comprehensive evaluation to date of LLMs for NONMEM coding in pharmacometrics: 7 LLMs tested (including OpenAI o1 and gpt-4.1) on 13 pharmacometrics tasks spanning a range of population PK and PD models. Developed a standardized scoring rubric for code accuracy assessment and created an optimized prompt. o1 and gpt-4.1 achieved 'great accuracy for all tasks when using our optimized prompt.' User review still essential for complex models. Discusses AI in pharmacometrics education and overreliance prevention. UNC Chapel Hill (CS + Pharmacy) + Monash Institute of Pharmaceutical Sciences (Kirkpatrick, Landersdorfer). CPT:PSP 2025.","key_findings":["7 LLMs evaluated on 13 NONMEM tasks — most comprehensive pharmacometrics LLM benchmark to date; tasks span basic structural PK/PD models to complex population models","OpenAI o1 and gpt-4.1 achieved best performance, generating 'codes with great accuracy for all tasks when using our optimized prompt' — substantial improvement over shin_2024_llm (ChatGPT 4.0/Gemini, which still required expert correction)","Standardized scoring rubric developed for assessing NONMEM code accuracy — provides a reusable benchmark methodology for future LLM comparisons in pharmacometrics","Optimized prompt development: prompt engineering substantially improved LLM performance — suggests that raw LLM capability is not the only variable; prompt strategy matters as much as model choice","LLMs performed well for basic NONMEM structures; 'user review and refinement remain essential, especially for complex models with special dataset alignment or advanced coding techniques'","Education dimension: discusses preventing overreliance on AI for pharmacometrics coding — frames LLMs as scaffolding tools in educational settings, with attention to learning risks from uncritical adoption"],"methods_discussed":["LLM_code_generation","NONMEM","prompt_engineering","pharmacometrics_benchmarking","population_PK","population_PD"],"datasets_referenced":["13_pharmacometrics_NONMEM_tasks_custom_benchmark"],"tools_software":["NONMEM","OpenAI_o1","gpt-4.1","ChatGPT","7_LLMs_total"],"limitations":["Full text not yet read — abstract_only; PMC12706393 available for upgrade","Task set of 13 may not cover all complex NONMEM use cases (e.g., SAEM estimation, complex covariates, M3 method for BLQ, time-varying covariates)","Scoring rubric is new — not validated against expert review panels or clinical impact criteria","Does not evaluate LLMs for model interpretation, diagnostics, or simulation — only code generation"],"extracted_claims":[{"text":"The OpenAI o1 and gpt-4.1 models achieved the best performance, both generating codes with great accuracy for all tasks when using our optimized prompt.","location":"Abstract","evidence_type":"empirical"},{"text":"Overall, LLMs performed well in writing basic NONMEM model structures, providing a useful foundation for pharmacometrics model coding. However, user review and refinement remain essential, especially for complex models with special dataset alignment or advanced coding techniques.","location":"Abstract","evidence_type":"empirical"},{"text":"This work provides a benchmark for current LLMs' performance in NONMEM coding and introduces a practical prompt that can facilitate more accurate and efficient use of AI in pharmacometrics research and education.","location":"Abstract","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Number of LLMs evaluated","value":"7","value_numeric":7,"unit":"N (LLMs)","comparison_baseline":"shin_2024_llm evaluated 2 LLMs (ChatGPT 4.0, Gemini Ultra 1.0)","location":"Abstract / Methods","is_primary_finding":false},{"metric_type":"study_statistic","description":"Number of NONMEM pharmacometrics tasks in benchmark","value":"13","value_numeric":13,"unit":"N (tasks)","comparison_baseline":"shin_2024_llm evaluated 2 tasks","location":"Abstract / Methods","is_primary_finding":false}]},"relevance":{"pillars":["generative_ai"],"gaps_addressed":["Updates and substantially supersedes shin_2024_llm for M4.4: shows that newer LLMs (o1, gpt-4.1) with prompt engineering achieve near-perfect NONMEM code accuracy — the capability gap documented by shin_2024_llm has largely closed for standard tasks","Prompt engineering as a pharmacometrics skill: optimized prompt development is a concrete, actionable WG recommendation — provides scaffolding the WG could publish or distribute to members","Education framing: LLMs as tools in pharmacometrics training, including overreliance prevention — relevant to WG's community-building role beyond research","Benchmark methodology: standardized scoring rubric is reusable infrastructure the WG could build on for future LLM comparisons"],"topics":["LLM","NONMEM","pharmacometrics","OpenAI_o1","gpt-4.1","prompt_engineering","benchmark","education","code_generation","UNC_Chapel_Hill","Monash","Kirkpatrick","Landersdorfer"],"relevance_score":"high"},"relationships":{"cites":["shin_2024_llm"],"cited_by":["kwack_2026_pkgpt"],"extends":["shin_2024_llm"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'GPT artificial intelligence pharmacokinetics population model pharmacometrics' (PMID 41187068). Full text available from PMC12706393 (DOI: 10.1002/psp4.70125). CPT:PSP 2025, 14(12):1965-1969. Open access. Zheng W + Yao H = UNC CS; Wang W + Zhou J = UNC Eshelman School of Pharmacy; Kirkpatrick CMJ + Landersdorfer CB = Monash MIPS. Key contrast with shin_2024_llm: shin used 2 LLMs, 2 tasks, 2024; zheng uses 7 LLMs, 13 tasks, 2025 — and finds o1/gpt-4.1 with optimized prompts now achieve near-perfect accuracy. The pharmacometrics LLM capability trajectory has been steep. Update when upgraded to full_text."},"title_short":"AI for NONMEM coding: 7 LLMs × 13 tasks, scoring rubric, optimized prompt; o1/gpt-4.1 near-perfect (Zheng et al., UNC+Monash, CPT:PSP 2025)"},{"id":"villaverde_2016_strikegodd","source_type":"paper","title":"Structural Identifiability of Dynamic Systems Biology Models","authors":["Villaverde AF","Barreiro A","Papachristodoulou A"],"year":2016,"doi":"10.1371/journal.pcbi.1005153","pmid":27792726,"url":null,"journal_or_venue":"PLoS Computational Biology","content":{"abstract_summary":"Introduces STRIKE-GOLDD (STRuctural Identifiability taKen as Extended-Generalized Observability with Lie Derivatives and Decomposition), a MATLAB toolbox for structural identifiability and observability analysis of general nonlinear ODE models. The key innovation: extends observability methods (Lie derivatives, generalized observability) to analyze structural identifiability, enabling analysis of non-rational and non-linear models that algebraic differential elimination cannot handle. Identifies unidentifiable models and shows how to modify them to become identifiable. Reports identifiability results for models where none had been established before. U Oxford + U Vigo. PLoS Comp Biol 2016.","key_findings":["Structural identifiability is a prerequisite for parameter estimation and model-based optimization, but 'this analysis is seldom performed due to the high computational cost involved in the necessary symbolic calculations, which quickly becomes prohibitive as the problem size increases'","STRIKE-GOLDD approach: reformulates structural identifiability as an extended observability problem; applies Lie derivatives to generate the observability-identifiability matrix (OIM); tests rank of OIM symbolically to determine identifiability of each parameter","Broad applicability: handles non-rational, non-linear ODE models with known and unknown inputs — more general than DAISY (which requires rational systems) or SIAN (algebraic approach) at the cost of higher computational expense","Demonstrates results on systems biology models where structural identifiability was previously undetermined; reports previously unknown unidentifiabilities","Provides procedure to make unidentifiable models identifiable: fix subset of parameters, reparametrize, add outputs, or add inputs — directly actionable for pharmacometric model design","Open source MATLAB implementation available on GitHub — directly usable by WG members"],"methods_discussed":["structural_identifiability","observability","Lie_derivatives","STRIKE-GOLDD","nonlinear_ODE","systems_biology","symbolic_computation"],"datasets_referenced":["systems_biology_ODE_models_illustrative"],"tools_software":["STRIKE-GOLDD","MATLAB"],"limitations":["Computational cost: Lie derivative approach scales poorly with model size; symbolic calculations become prohibitive for large systems","Requires MATLAB — not accessible to R or Python users without interfacing","Does not analyze practical identifiability (parameter uncertainty given finite data, noise) — only structural identifiability (theoretical parameter recoverability)"],"extracted_claims":[{"text":"A powerful way of gaining insight into biological systems is by creating a nonlinear differential equation model, which usually contains many unknown parameters. Such a model is called structurally identifiable if it is possible to determine the values of its parameters from measurements of the model outputs.","location":"Abstract","evidence_type":"methodological"},{"text":"This method helps prevent problems caused by lack of identifiability analysis, which can compromise the success of tasks such as experiment design, parameter estimation, and model-based optimization.","location":"Abstract","evidence_type":"methodological"},{"text":"The broad applicability of this approach facilitates the analysis of the increasingly complex models used in systems biology and other areas.","location":"Abstract","evidence_type":"methodological"}],"numerical_findings":[]},"relevance":{"pillars":["uq_identifiability"],"gaps_addressed":["Foundational M1.2 paper: provides the core algorithmic approach (Lie derivatives + observability) that STRIKE-GOLDD is built on — WG members need to understand this to use the tool and to discuss structural identifiability authoritatively in the scoping paper","Directly extends to hybrid/neural ODE context: campo_manzanares_2026 (iNODE) applies identifiability-aware design to neural ODEs — understanding how STRIKE-GOLDD works is prerequisite for the iNODE approach's contribution","Connects structural identifiability (villaverde_2016) → practical identifiability (raue_2009) → mixed-effects identifiability (janzen_2017): together these three papers define the identifiability landscape for the WG's M1.2 work stream"],"topics":["structural_identifiability","STRIKE-GOLDD","Lie_derivatives","observability","nonlinear_ODE","systems_biology","MATLAB","Villaverde","U_Vigo","U_Oxford","Papachristodoulou"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["diazseoane_2023_strikegodd4"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'STRIKE-GOLDD structural identifiability nonlinear systems' (PMID 27792726). Full text available from PMC5085250 (DOI: 10.1371/journal.pcbi.1005153). PLoS Comp Biol 2016, 12(10):e1005153. Open access. Villaverde AF = U Oxford (now U Vigo, corresponding); Barreiro A = U Vigo; Papachristodoulou A = U Oxford. Code at https://github.com/afvillaverde/strike-goldd. campo_manzanares_2026 (iNODE) cites this work as part of its identifiability-aware design. Upgrade to full_text from PMC5085250 if needed for scoping paper writing."},"title_short":"STRIKE-GOLDD: structural identifiability via Lie derivatives + observability for nonlinear ODE models (Villaverde et al., PLoS Comp Biol 2016)"},{"id":"diazseoane_2023_strikegodd4","source_type":"paper","title":"STRIKE-GOLDD 4.0: user-friendly, efficient analysis of structural identifiability and observability","authors":["Díaz-Seoane S","Rey Barreiro X","Villaverde AF"],"year":2023,"doi":"10.1093/bioinformatics/btac748","pmid":36398887,"url":null,"journal_or_venue":"Bioinformatics","content":{"abstract_summary":"STRIKE-GOLDD 4.0 update: adds ProbObsTest, a new algorithm specifically designed for rational ODE models that is 'significantly faster than the previously available FISPO algorithm when applied to computationally expensive models.' The toolbox now provides both FISPO (general, handles non-rational models) and ProbObsTest (faster, for rational models) — combining generality and computational efficiency. Implemented as MATLAB toolbox with user-friendly graphical interface. Open source (GPLv3). Available on GitHub. U Vigo (Villaverde group). Bioinformatics 2023.","key_findings":["ProbObsTest is a new probabilistic algorithm for structural identifiability analysis of rational ODE models — significantly faster than the FISPO algorithm for computationally expensive models","STRIKE-GOLDD 4.0 provides both FISPO (general, handles non-rational models) and ProbObsTest (fast, for rational models) in the same toolbox — users can choose based on model type and computational constraints","User-friendly graphical interface added in 4.0 — lowers barrier to use for pharmacometricians without MATLAB programming expertise","Handles models with known and unknown inputs — broader than algebraic tools like SIAN or DAISY, which require additional constraints","Open source under GPLv3; available at https://github.com/afvillaverde/strike-goldd"],"methods_discussed":["structural_identifiability","observability","ProbObsTest","FISPO","STRIKE-GOLDD","rational_ODE","nonlinear_ODE","MATLAB"],"datasets_referenced":[],"tools_software":["STRIKE-GOLDD_4.0","MATLAB"],"limitations":["Still requires MATLAB — not accessible to Python/R users without interfacing","ProbObsTest is probabilistic — may not give deterministic guarantees for all models (name implies probabilistic approach)","Full text not read — abstract_only; PMC9805590 available for upgrade"],"extracted_claims":[{"text":"ProbObsTest is significantly faster than the previously available FISPO algorithm when applied to computationally expensive models.","location":"Abstract","evidence_type":"empirical"},{"text":"Providing both algorithms in the same toolbox allows combining generality and computational efficiency.","location":"Abstract","evidence_type":"methodological"}],"numerical_findings":[]},"relevance":{"pillars":["uq_identifiability"],"gaps_addressed":["Fills M1.2 structural identifiability software gap: STRIKE-GOLDD 4.0 is the current state-of-the-art tool for structural identifiability analysis of nonlinear ODE models; the GUI makes it accessible to pharmacometricians; the ProbObsTest algorithm addresses the computational bottleneck of FISPO","Directly actionable for WG members: WG could recommend STRIKE-GOLDD 4.0 as the standard identifiability analysis tool for hybrid mechanistic-ML PK/PD model development, especially when building neural ODE or iNODE models (campo_manzanares_2026)"],"topics":["structural_identifiability","STRIKE-GOLDD","MATLAB","observability","ProbObsTest","FISPO","U_Vigo","Villaverde","open_source"],"relevance_score":"high"},"relationships":{"cites":["villaverde_2016_strikegodd"],"cited_by":[],"extends":["villaverde_2016_strikegodd"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'STRIKE-GOLDD structural identifiability nonlinear systems' (PMID 36398887). Full text available from PMC9805590 (DOI: 10.1093/bioinformatics/btac748). Bioinformatics 2023, 39(1). Open access. All 3 authors from Departamento de Enxeñaría de Sistemas e Automática, Universidade de Vigo, Galicia, Spain; Villaverde AF = corresponding (a.f.villaverde@uvigo.gal). Code at https://github.com/afvillaverde/strike-goldd. Together with villaverde_2016_strikegodd, these two papers define the STRIKE-GOLDD tool suite for the identifiability work stream."},"title_short":"STRIKE-GOLDD 4.0: ProbObsTest algorithm + GUI for structural identifiability of nonlinear ODE models (Díaz-Seoane et al., Bioinformatics 2023)"},{"id":"barber_2023_conformal","source_type":"paper","title":"Conformal prediction beyond exchangeability","authors":["Barber RF","Candès EJ","Ramdas A","Tibshirani RJ"],"year":2023,"doi":"10.1214/23-aos2276","pmid":null,"url":"https://doi.org/10.1214/23-AOS2276","journal_or_venue":"The Annals of Statistics","content":{"abstract_summary":"Extends conformal prediction theory to non-exchangeable data settings via weighted conformal prediction and permutation-invariance relaxations. Provides rigorous finite-sample coverage bounds when training and test distributions differ or data points exhibit dependency structures, establishing the mathematical basis for conformal inference on clinical data.","key_findings":["Standard conformal prediction guarantees 1 - α coverage only under exact exchangeability (i.i.d. data)","Introduces weighted non-conformity scores with provable coverage bounds under arbitrary known covariate shifts and bounded non-exchangeability","Establishes robustness bounds showing coverage degradation is strictly bounded by the total variation distance from exchangeability","Applicable to clinical and longitudinal datasets where distributional shifts occur across treatment cohorts"],"methods_discussed":["conformal_prediction","non_exchangeable_inference","weighted_conformal","distribution_free_UQ","coverage_guarantees"],"datasets_referenced":[],"tools_software":["R","Python"],"limitations":["Bounds depend on estimating or bounding departure from exchangeability","Prediction set efficiency can widen substantially under severe non-exchangeability"],"extracted_claims":[{"text":"Conformal prediction offers distribution-free, finite-sample predictive inference, but standard guarantees rely heavily on data exchangeability.","location":"Introduction","evidence_type":"theoretical"}],"numerical_findings":[]},"relevance":{"pillars":["uq_identifiability"],"gaps_addressed":["Fills Pillar 2 (M2.2) theoretical requirement for adapting conformal prediction to non-exchangeable pharmacometric clinical trial data"],"topics":["conformal_prediction","uncertainty_quantification","non_exchangeability","mathematical_statistics"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["dunn_2022_clustered_conformal","gibbs_2021_timeseries_conformal"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"web_search","date_read":"2026-08-29","read_by":"claude","read_depth":"sections_key","notes":"Added 2026-08-29 by Antigravity review. Foundational mathematical reference for Pillar 2 M2.2 conformal prediction extension."},"title_short":"Conformal prediction beyond exchangeability (Barber et al., Annals of Statistics 2023)"},{"id":"dunn_2022_clustered_conformal","source_type":"paper","title":"Distribution-Free Prediction Sets for Two-Layer Hierarchical Models","authors":["Dunn R","Wasserman L","Ramdas A"],"year":2022,"doi":"10.1080/01621459.2022.2060112","pmid":null,"url":"https://doi.org/10.1080/01621459.2022.2060112","journal_or_venue":"Journal of the American Statistical Association","content":{"abstract_summary":"Develops distribution-free conformal prediction sets for clustered and hierarchical data structures where observations within a cluster (e.g. repeated PK measures from the same patient) are dependent, but clusters are exchangeable. Provides valid finite-sample coverage at both cluster and unit levels.","key_findings":["Standard split conformal fails on clustered data due to intra-cluster correlation","Proposes cluster-level split conformal and leave-one-cluster-out methods that maintain valid nominal coverage","Establishes theoretical guarantees for both new cluster prediction and unit-level prediction within observed clusters","Directly applicable to hierarchical clinical trial data with repeated sampling per subject"],"methods_discussed":["conformal_prediction","clustered_data","hierarchical_inference","distribution_free_UQ"],"datasets_referenced":[],"tools_software":["R"],"limitations":["Requires exchangeability at the cluster level (patients must be exchangeable even if repeated samples are correlated)","Conservative prediction intervals if number of clusters is small (<20)"],"extracted_claims":[{"text":"When data are clustered, standard exchangeability is violated. We develop methods that provide exact finite-sample coverage guarantees by leveraging cluster-level exchangeability.","location":"Abstract","evidence_type":"theoretical"}],"numerical_findings":[]},"relevance":{"pillars":["uq_identifiability","hybrid_foundations"],"gaps_addressed":["Provides exact mathematical formulation for applying conformal prediction to repeated-measures PK/PD trial data in Pillar 2 (M2.2)"],"topics":["conformal_prediction","clustered_data","hierarchical_models","uncertainty_quantification"],"relevance_score":"high"},"relationships":{"cites":["barber_2023_conformal"],"cited_by":[],"extends":["barber_2023_conformal"],"contradicts":[]},"provenance":{"how_obtained":"web_search","date_read":"2026-08-29","read_by":"claude","read_depth":"sections_key","notes":"Added 2026-08-29 by Antigravity review. Key reference for hierarchical/clustered conformal prediction in PK/PD."},"title_short":"Distribution-free prediction sets for clustered/hierarchical data (Dunn et al., JASA 2022)"},{"id":"gibbs_2021_timeseries_conformal","source_type":"paper","title":"Adaptive Conformal Inference for Time Series","authors":["Gibbs I","Candès EJ"],"year":2021,"doi":null,"pmid":null,"url":"https://proceedings.neurips.cc/paper/2021/hash/8a1e808b55fde83d740ab39f962e4711-Abstract.html","journal_or_venue":"Advances in Neural Information Processing Systems (NeurIPS)","content":{"abstract_summary":"Presents Adaptive Conformal Inference (ACI), a framework that updates non-conformity thresholds dynamically to maintain valid empirical coverage on sequential, non-exchangeable time series data with temporal autocorrelation and distribution shifts.","key_findings":["Standard conformal prediction fails under temporal autocorrelation; ACI dynamically updates prediction bands to guarantee long-run coverage","Proves that online gradient-descent style threshold updates achieve exact asymptotic coverage even under arbitrary non-stationary processes","Demonstrates minimal tracking lag on volatile time-series trajectories","Essential foundation for applying distribution-free UQ to individual longitudinal PK/PD concentration-time curves"],"methods_discussed":["conformal_prediction","adaptive_conformal_inference","time_series_UQ","online_learning"],"datasets_referenced":[],"tools_software":["Python"],"limitations":["Finite-sample guarantees are asymptotic in time-series length T","Step-size parameter γ requires tuning to balance responsiveness against band stability"],"extracted_claims":[{"text":"Adaptive Conformal Inference achieves valid empirical coverage on arbitrary non-exchangeable time series by adjusting the confidence level dynamically online.","location":"Abstract","evidence_type":"theoretical"}],"numerical_findings":[]},"relevance":{"pillars":["uq_identifiability"],"gaps_addressed":["Enables conformal prediction bounds on longitudinal time-series PK concentration trajectories in Pillar 2 (M2.2)"],"topics":["conformal_prediction","time_series","longitudinal_data","uncertainty_quantification"],"relevance_score":"high"},"relationships":{"cites":["barber_2023_conformal"],"cited_by":[],"extends":["barber_2023_conformal"],"contradicts":[]},"provenance":{"how_obtained":"web_search","date_read":"2026-08-29","read_by":"claude","read_depth":"sections_key","notes":"Added 2026-08-29 by Antigravity review. Core reference for time-series conformal inference in Pillar 2."},"title_short":"Adaptive conformal inference for time series (Gibbs & Candès, NeurIPS 2021)"},{"id":"gottesman_2019_rl_healthcare","source_type":"paper","title":"Guidelines for reinforcement learning in healthcare","authors":["Gottesman O","Johansson F","Komorowski M","Faisal A","Sontag D","Doshi-Velez F"],"year":2019,"doi":"10.1038/s41591-018-0310-5","pmid":30617322,"url":"https://doi.org/10.1038/s41591-018-0310-5","journal_or_venue":"Nature Medicine","content":{"abstract_summary":"Establishes clinical and methodological guidelines for applying reinforcement learning in healthcare. Highlights the critical need for offline/batch RL, rigorous off-policy evaluation, handling of unobserved confounding (POMDPs), and safety bounds before clinical translation.","key_findings":["Active exploration on real patients is unethical; clinical RL must be learned offline from observational data or validated mechanistic simulators","Off-Policy Evaluation (OPE) is mandatory to estimate policy performance reliably prior to clinical deployment","Identifies key pitfalls: partial observability, action space mismatch, unmeasured confounding, and unstable reward functions","Proposes reporting standards for clinical RL studies to ensure reproducibility and safety"],"methods_discussed":["reinforcement_learning","offline_RL","off_policy_evaluation","POMDP","clinical_safety"],"datasets_referenced":["MIMIC-III"],"tools_software":["Python"],"limitations":["Broad high-level guidelines; does not provide pharmacometric ODE-specific reward formulations"],"extracted_claims":[{"text":"Unlike games or robotics where agents learn through online exploration, reinforcement learning in healthcare must almost exclusively rely on observational data and offline evaluation.","location":"Main text","evidence_type":"review"}],"numerical_findings":[]},"relevance":{"pillars":["optimal_control_rl"],"gaps_addressed":["Provides foundational clinical translation guidelines and OPE rationale for precision dosing in Pillar 3 (M3.4/M3.6)"],"topics":["reinforcement_learning","precision_dosing","offline_RL","healthcare_AI","safety"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["roggeveen_2024_clinical_rl_ope"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-29","read_by":"claude","read_depth":"sections_key","notes":"Added 2026-08-29 by Antigravity review. Foundational guideline for clinical RL and off-policy evaluation in Pillar 3."},"title_short":"Guidelines for reinforcement learning in healthcare (Gottesman et al., Nat Med 2019)"},{"id":"levine_2020_offline_rl","source_type":"preprint","title":"Offline Reinforcement Learning: Tutorial, Review, and Perspectives on Open Problems","authors":["Levine S","Kumar A","Tucker G","Fu J"],"year":2020,"doi":null,"pmid":null,"url":"https://arxiv.org/abs/2005.01643","journal_or_venue":"arXiv preprint arXiv:2005.01643","content":{"abstract_summary":"Comprehensive survey and tutorial on offline (batch) reinforcement learning. Formalizes the core challenge of distributional shift / out-of-distribution actions and reviews algorithms (conservative Q-learning, policy regularization, model-based offline RL) for learning optimal policies from static datasets.","key_findings":["Standard off-policy RL algorithms fail catastrophically in offline settings due to distributional shift and extrapolation errors on unobserved state-action pairs","Core mitigation approaches: policy constraints (forcing policy close to behavior distribution), conservative value estimation (CQL), and uncertainty-aware model-based offline RL","Establishes theoretical foundations for sample efficiency, convergence, and safe policy improvement from historical logs","Directly translates to learning dosing policies from historical clinical trial logs without exploring risky dose regimens"],"methods_discussed":["offline_RL","batch_RL","conservative_Q_learning","distributional_shift","policy_constraints"],"datasets_referenced":["D4RL"],"tools_software":["PyTorch","TensorFlow"],"limitations":["Heavy reliance on dataset coverage; cannot learn effective policies in completely unvisited regions of state-action space"],"extracted_claims":[{"text":"Offline reinforcement learning provides a path toward utilizing vast logged datasets to train decision-making agents without the risks associated with online exploration in safety-critical domains.","location":"Section 1","evidence_type":"theoretical"}],"numerical_findings":[]},"relevance":{"pillars":["optimal_control_rl"],"gaps_addressed":["Provides the core mathematical algorithms and theory for offline precision dosing policy optimization in Pillar 3 (M3.4/M3.6)"],"topics":["offline_RL","batch_RL","reinforcement_learning","optimal_control"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["gottesman_2019_rl_healthcare"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"web_search","date_read":"2026-08-29","read_by":"claude","read_depth":"sections_key","notes":"Added 2026-08-29 by Antigravity review. Canonical tutorial and survey for offline reinforcement learning in Pillar 3."},"title_short":"Offline reinforcement learning tutorial and review (Levine et al., arXiv 2020)"},{"id":"thomas_2016_ope","source_type":"paper","title":"Data-Efficient Off-Policy Policy Evaluation for Reinforcement Learning","authors":["Thomas PS","Brunskill E"],"year":2016,"doi":null,"pmid":null,"url":"https://proceedings.mlr.press/v48/thomas16.html","journal_or_venue":"International Conference on Machine Learning (ICML)","content":{"abstract_summary":"Presents MAGIC, a data-efficient and robust Off-Policy Evaluation (OPE) estimator that combines doubly robust estimators with model-based approaches, offering high-confidence safety guarantees when evaluating new decision policies from historical execution logs.","key_findings":["Standard importance sampling suffers from excessive variance, while model-based estimators suffer from high bias under model misspecification","Doubly robust (DR) and weighted doubly robust (WDR) estimators achieve unbiasedness while drastically reducing variance","Derives concentration inequalities providing high-confidence lower bounds on policy performance, enabling rigorous safety gating","Critical methodological framework for proving an AI-derived dosing policy is safe before running prospective clinical trials"],"methods_discussed":["off_policy_evaluation","doubly_robust_estimation","importance_sampling","high_confidence_RL","safety_bounds"],"datasets_referenced":[],"tools_software":["Python"],"limitations":["Requires accurate estimation of behavior policy probabilities (propensity scores)","High variance if target policy takes actions that had near-zero probability in historical data"],"extracted_claims":[{"text":"Off-policy policy evaluation allows practitioners to predict the performance of a proposed policy using historical data generated by a different policy without requiring hazardous online experimentation.","location":"Introduction","evidence_type":"theoretical"}],"numerical_findings":[]},"relevance":{"pillars":["optimal_control_rl","uq_identifiability"],"gaps_addressed":["Provides mathematical statistical methods for evaluating precision dosing policies prior to clinical deployment in Pillar 3 (M3.6)"],"topics":["off_policy_evaluation","reinforcement_learning","precision_dosing","safety_guarantees"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["gottesman_2019_rl_healthcare","roggeveen_2024_clinical_rl_ope"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"web_search","date_read":"2026-08-29","read_by":"claude","read_depth":"sections_key","notes":"Added 2026-08-29 by Antigravity review. Core reference for off-policy evaluation and safety verification in precision dosing."},"title_short":"Data-efficient off-policy policy evaluation for RL (Thomas & Brunskill, ICML 2016)"},{"id":"richens_2020_causal_med","source_type":"paper","title":"Improving the accuracy of medical diagnosis with causal machine learning","authors":["Richens JG","Lee CM","Johri S"],"year":2020,"doi":"10.1038/s41467-020-17419-7","pmid":32782264,"url":"https://doi.org/10.1038/s41467-020-17419-7","journal_or_venue":"Nature Communications","content":{"abstract_summary":"Demonstrates that associative machine learning algorithms make systematic, safety-critical errors in clinical diagnostics due to confounding and selection bias, whereas counterfactual and causal machine learning formulations consistently outperform associative models and approach expert human physician accuracy.","key_findings":["Purely associative ML models confuse correlation with causation, failing when presented with rare disease presentations or confounded clinical markers","Counterfactual reasoning via Pearl's do-calculus enables algorithms to query 'what if' scenarios accurately","Causal ML achieves top-quarter physician-level diagnostic accuracy (F1 score significantly higher than standard associative deep learning)","Proves mathematically why counterfactual validity is essential for clinical decision-support and synthetic patient simulation"],"methods_discussed":["causal_inference","counterfactual_reasoning","structural_causal_models","Pearl_do_calculus","medical_AI"],"datasets_referenced":["clinical_vignettes"],"tools_software":["Python"],"limitations":["Requires explicit causal graph specification or strong assumptions for causal discovery"],"extracted_claims":[{"text":"Associative algorithms suffer from systematic errors when observational correlations do not reflect causal relationships. Causal reasoning rectifies these limitations.","location":"Abstract","evidence_type":"empirical"}],"numerical_findings":[]},"relevance":{"pillars":["generative_ai","uq_identifiability"],"gaps_addressed":["Provides mathematical and empirical rationale for requiring counterfactual / causal validity in synthetic patients and digital twins in Pillar 4 (M4.2)"],"topics":["causal_inference","counterfactuals","digital_twins","synthetic_data","generative_AI"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["sanchez_2022_causal_precision"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-29","read_by":"claude","read_depth":"sections_key","notes":"Added 2026-08-29 by Antigravity review. Foundational benchmark paper demonstrating why causal ML is required for clinical decision support and synthetic digital twins."},"title_short":"Improving accuracy of medical diagnosis with causal ML (Richens et al., Nature 2020)"},{"id":"sanchez_2022_causal_precision","source_type":"paper","title":"Causal machine learning for healthcare and precision medicine","authors":["Sanchez P","Voisey JP","Xia T","Watson HI","O'Neil AQ","Tsaftaris SA"],"year":2022,"doi":"10.1098/rsos.220638","pmid":36059781,"url":"https://doi.org/10.1098/rsos.220638","journal_or_venue":"Royal Society Open Science","content":{"abstract_summary":"Reviews the convergence of causal inference and deep learning in precision medicine. Details how Structural Causal Models (SCMs), causal generative models, and counterfactual estimation enable individualized treatment effect estimation and biologically valid digital twin simulation.","key_findings":["Traditional generative deep learning models (VAEs, GANs) capture joint observational distributions P(X, Y) but fail to capture interventional P(Y|do(X)) or counterfactual distributions","Structural Causal Models (SCMs) combined with deep neural networks provide a formal framework for simulating individualized treatment effects","Validating digital twins requires verifying causal invariance and counterfactual consistency, not merely marginal distributional matching (Wasserstein/MMD)","Essential foundation for Pillar 4 work on mathematical validation of synthetic pharmacometric patients"],"methods_discussed":["structural_causal_models","causal_machine_learning","counterfactual_simulation","digital_twins","individualized_treatment_effects"],"datasets_referenced":[],"tools_software":["Python","PyTorch"],"limitations":["Review article; specific pharmacometric ODE integration left as future challenge"],"extracted_claims":[{"text":"Causal machine learning provides the mathematical tools to answer interventional and counterfactual questions, which are at the heart of precision medicine and personalized digital twins.","location":"Abstract","evidence_type":"review"}],"numerical_findings":[]},"relevance":{"pillars":["generative_ai","uq_identifiability"],"gaps_addressed":["Directly establishes the theoretical criteria for counterfactual validation of digital twins in Pillar 4 (M4.2)"],"topics":["causal_inference","digital_twins","precision_medicine","synthetic_data","counterfactuals"],"relevance_score":"high"},"relationships":{"cites":["richens_2020_causal_med"],"cited_by":[],"extends":["richens_2020_causal_med"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-29","read_by":"claude","read_depth":"sections_key","notes":"Added 2026-08-29 by Antigravity review. Authoritative review connecting causal ML and counterfactual validation to precision medicine digital twins."},"title_short":"Causal ML for healthcare and precision medicine digital twins (Sanchez et al., RSOS 2022)"},{"id":"kuemmel_2020_credibility","source_type":"paper","title":"Considerations for a Credibility Assessment Framework in Model-Informed Drug Development: White Paper","authors":["Kuemmel C","Yang Y","Zhang X","Florian J","Zhu H","Wang Y"],"year":2020,"doi":"10.1002/psp4.12479","pmid":31778000,"url":"https://doi.org/10.1002/psp4.12479","journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Adapts the ASME V&V 40 risk-informed credibility framework to Model-Informed Drug Development (MIDD). Defines how model risk (model influence × decision consequence) dictates the necessary level of verification, validation, and uncertainty quantification required for regulatory decision-making.","key_findings":["Establishes a standardized credibility assessment framework for MIDD based on the ASME V&V 40 standard","Model risk is formalized as the product of Model Influence (how heavily the regulatory decision relies on the model) and Decision Consequence (severity of consequences if the model is wrong)","Defines specific V&V activities: code verification, calculation verification, model applicability evaluation, and sensitivity/uncertainty analysis","Serves as the direct conceptual foundation for the FDA 2025 AI/ML 7-step credibility framework and ICH M15 guidance"],"methods_discussed":["credibility_framework","ASME_VV_40","model_risk_assessment","verification_and_validation","MIDD","regulatory_science"],"datasets_referenced":[],"tools_software":[],"limitations":["Written prior to widespread integration of deep neural ODEs and hybrid ML models in MIDD submissions"],"extracted_claims":[{"text":"Model credibility is context-dependent and should be commensurate with the model risk, which is determined by the decision consequence and model influence.","location":"Abstract","evidence_type":"regulatory"}],"numerical_findings":[]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Provides the primary peer-reviewed citation bridging ASME V&V 40 to MIDD and pharmacometrics for regulatory workstreams and White Paper Section E"],"topics":["regulatory","credibility","ASME_VV_40","FDA","model_influence","verification_validation"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["fda_ai_guidance_2025"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-29","read_by":"claude","read_depth":"full_text","notes":"Added 2026-08-29 by Antigravity review. Core regulatory bridge paper translating ASME V&V 40 into pharmacometric MIDD credibility assessment."},"title_short":"Credibility assessment framework for MIDD adapting ASME V&V 40 (Kuemmel et al., CPT:PSP 2020)"},{"id":"kim_2021_stiff_node","source_type":"paper","title":"Stiff neural ordinary differential equations","authors":["Kim S","Ji W","Deng S","Ma Y","Rackauckas C"],"year":2021,"doi":"10.1063/5.0060697","pmid":34598501,"url":"https://doi.org/10.1063/5.0060697","journal_or_venue":"Chaos: An Interdisciplinary Journal of Nonlinear Science","content":{"abstract_summary":"Investigates the training and numerical stability of Neural ODEs on stiff dynamical systems with multiscale temporal dynamics. Demonstrates that standard explicit ODE solvers and classical adjoint sensitivity methods fail catastrophically on stiff systems, and presents stabilized implicit solvers and checkpointed forward sensitivity methods.","key_findings":["Stiff dynamical systems (ubiquitous in biological systems with fast absorption/distribution and slow elimination) cause standard Neural ODE solvers to diverge or take excessive computation time","The continuous adjoint state method suffers from extreme numerical error accumulation when backward integration of stiff systems becomes unstable","Implicit / Radau / Rodas stiff solvers with analytical Jacobian formulations and forward-mode automatic differentiation are required for stable training and parameter estimation","Directly establishes numerical verification criteria for hybrid pharmacometric models in Pillar 1 (M1.3)"],"methods_discussed":["neural_ODE","stiff_ODE_solvers","adjoint_sensitivity","forward_sensitivity","numerical_stability","scientific_machine_learning"],"datasets_referenced":["ROBER","POLLU"],"tools_software":["Julia","DifferentialEquations.jl","SciML","PyTorch"],"limitations":["Demonstrated on chemical kinetics benchmarks; pharmacometric multi-compartment PK/PD case studies needed"],"extracted_claims":[{"text":"Stiffness in neural ordinary differential equations poses severe numerical challenges where standard explicit solvers and continuous adjoint sensitivity methods fail.","location":"Abstract","evidence_type":"empirical"}],"numerical_findings":[]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Provides numerical verification and stiff solver stability foundations for hybrid Neural ODEs in Pillar 1 (M1.3)"],"topics":["neural_ODE","stiffness","numerical_verification","adjoint_methods","SciML"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-29","read_by":"claude","read_depth":"sections_key","notes":"Added 2026-08-29 by Antigravity review. Foundational paper on numerical stiffness and adjoint instability in Neural ODEs for Pillar 1."},"title_short":"Stiff neural ordinary differential equations and numerical stability (Kim et al., Chaos 2021)"},{"id":"savic_2009_shrinkage","source_type":"paper","title":"Importance of shrinkage in empirical Bayes estimates for diagnostics in population pharmacokinetics","authors":["Savic RM","Karlsson MO"],"year":2009,"doi":"10.1208/s12248-009-9133-0","pmid":19688264,"url":"https://doi.org/10.1208/s12248-009-9133-0","journal_or_venue":"The AAPS Journal","content":{"abstract_summary":"Classic foundational paper on parameter shrinkage (eta-shrinkage and epsilon-shrinkage) in empirical Bayes estimates (EBEs) for nonlinear mixed-effects models. Demonstrates how shrinkage masks model misspecification, distorts covariate relationships, and leads to false conclusions in model evaluation.","key_findings":["When individual data are uninformative (sparse sampling), EBEs shrink toward the population mean (eta-shrinkage) and individual residuals shrink toward zero (epsilon-shrinkage)","High shrinkage (>20–30%) renders standard diagnostic plots (e.g. EBE vs covariate, individual IPRED vs DV) misleading and incapable of detecting structural misspecification","Crucial for hybrid NLME-ML models: overparameterized neural network layers can artificially absorb individual variance, creating severe unnoticed shrinkage and spurious covariate relationships","Establishes formal mathematical equations for quantifying eta-shrinkage and epsilon-shrinkage"],"methods_discussed":["empirical_Bayes_estimates","eta_shrinkage","epsilon_shrinkage","NLME_diagnostics","population_PK"],"datasets_referenced":[],"tools_software":["NONMEM"],"limitations":["Focused on classical parametric NLME; implications for neural-ODE hybrid layers need formal mathematical extension"],"extracted_claims":[{"text":"Shrinkage is a well-known phenomenon in empirical Bayes estimation. High shrinkage conceals true model misspecification and distorts individual parameter-covariate relationships.","location":"Abstract","evidence_type":"empirical"}],"numerical_findings":[]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Provides foundational shrinkage theory for analyzing how neural network layers interact with between-subject variability in Pillar 1 (M1.2)"],"topics":["shrinkage","NLME","population_PK","diagnostics","empirical_Bayes"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["elmokadem_2024","baaz_2026"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-29","read_by":"claude","read_depth":"full_text","notes":"Added 2026-08-29 by Antigravity review. Foundational reference for eta-shrinkage in mixed-effects hybrid models."},"title_short":"Importance of eta-shrinkage in empirical Bayes estimates (Savic & Karlsson, AAPS J 2009)"},{"id":"scigym_2025","source_type":"paper","title":"Measuring Scientific Capabilities of Language Models with a Systems Biology Dry Lab","authors":["Duan H"],"year":2025,"doi":null,"pmid":null,"url":"https://arxiv.org/abs/2507.02083","journal_or_venue":"arXiv preprint","content":{"abstract_summary":"Introduction of SciGym, a standardized dry-lab simulation benchmark designed to evaluate autonomous LLM agents on scientific discovery tasks in systems biology. Systems are encoded as ODE networks using SBML. Agents must design experimental interventions (perturbations, dosing, sampling times) within a fixed experimental budget to recover unknown reaction kinetics and dynamical topologies.","key_findings":["Establishes a standardized gym-like environment for evaluating LLM agents on nonlinear biological ODE systems","Identifies that frontier models without execution feedback struggle with stiff kinetics and high-dimensional parameter spaces","Provides reusable SBML-to-ODE simulation harnesses directly relevant for QSP and pharmacometric benchmarking"],"methods_discussed":["LLM_agents","systems_biology","SBML","ODE_discovery","benchmarking","experimental_design"],"datasets_referenced":["SBML_biomodels_benchmark_set"],"tools_software":["SciGym","SBML","libRoadRunner","Python"],"limitations":["Focuses primarily on biochemical network topology rather than clinical pharmacometrics or population hierarchy (NLME)"],"extracted_claims":[{"text":"SciGym benchmarks LLM agent scientific reasoning through closed-loop interaction with dynamical systems modeled as ODEs in SBML.","location":"Abstract","evidence_type":"empirical"}],"numerical_findings":[]},"relevance":{"pillars":["generative_ai","hybrid_foundations","uq_identifiability"],"gaps_addressed":["Standardizes agentic benchmarking for biological ODE systems (feeds Activity 1 / QSP tasks and Activity 3)","Provides SBML-to-ODE simulation infrastructure"],"topics":["LLM_agents","systems_biology","SBML","benchmarking","ODE_networks"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"web_search","date_read":"2026-08-29","read_by":"antigravity","read_depth":"sections_key","notes":"Added during 2026-08-29 GenAI comparative scoping review. Original metadata (authors, DOI, arXiv ID, NeurIPS venue) were hallucinated by Antigravity and corrected 2026-08-29 after CrossRef/API audit. Real project: h4duan/SciGym on GitHub, Hugging Face dataset h4duan/scigym-sbml (350 BioModels-sourced SBML ODE systems). Title and arXiv URL updated from web search confirmation; full author list needs manual verification before citation."},"title_short":"SciGym: LLM scientific capabilities benchmark via systems biology dry lab (Duan, arXiv 2025) [met
