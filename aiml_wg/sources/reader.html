adata needs full verification]"},{"id":"kwack_2026_pkgpt","source_type":"paper","title":"PKGPT: Expert-Orchestrated Recursive LLM Agent for Automated NONMEM PopPK Modeling with Human Benchmarking","authors":["Kwack H","Kong H","Lim J","Zhang BT","Hahn J","Chang MJ"],"year":2026,"doi":"10.3390/pharmaceutics18040501","pmid":42076151,"url":null,"journal_or_venue":"Pharmaceutics","content":{"abstract_summary":"PKGPT is a recursive, five-phase agentic LLM system (powered by Gemini 3.0 Flash) that automates NONMEM-based PopPK model development and benchmarks its performance against human expert models on three public datasets. The system iteratively executes NONMEM, parses outputs, and refines control streams across phases: base model, structural diagnostics, overfitting reduction, random-effects optimization, and covariate analysis. Naïve zero-shot LLM prompting consistently fails (non-executable code); the agentic loop produces executable, converging models but exhibits physiological plausibility failures and variable reproducibility.","key_findings":["Naïve zero-shot LLM prompting typically produces NONMEM code that fails to execute — the agentic feedback loop is necessary for convergence","Warfarin: PKGPT and human both selected one-compartment oral (ADVAN2), but expert achieved OFV 294.41 vs PKGPT's 484.43 via covariate scaling","Theophylline: PKGPT produced parameter estimates close to expert (Ka=1.59 vs 1.46 h; CL=0.0399 vs 0.0404 L/h/kg)","Tobramycin: PKGPT correctly identified two-compartment structure but produced physiologically implausible V2=149 L vs expert's 13.2 L — a 11-fold plausibility error","PKGPT did not identify clinically established covariates across all three datasets — covariate analysis remains a critical gap","Run-to-run reproducibility was variable — consistent with shin_2024_llm but not resolved by the agentic architecture","Human-in-the-loop oversight remains essential for physiological plausibility and clinical interpretability despite successful numerical convergence"],"methods_discussed":["LLM_agents","NONMEM","agentic_AI","recursive_self_correction","population_PK","human_benchmarking","prompt_engineering"],"datasets_referenced":["warfarin_Holford_1992","theophylline_Boeckmann_1992","tobramycin_Rodman_1984"],"tools_software":["NONMEM","Gemini_3.0_Flash","PKGPT","Python"],"limitations":["Only three standard PopPK datasets tested — all 1-cpt or 2-cpt; no PBPK, QSP, or stiff ODE systems","Single LLM backend (Gemini 3.0 Flash) — not a comparative study across models","Covariate identification failed across all datasets — the system's covariate analysis phase is weakest","Variable reproducibility not quantified — no formal reproducibility metric reported","No identifiability assessment of generated models","Physiological plausibility scoring was qualitative (V2 comparison), not systematized"],"extracted_claims":[{"text":"PKGPT consistently produced executable, converging NONMEM models across all three datasets.","location":"Abstract","evidence_type":"empirical"},{"text":"In tobramycin, PKGPT correctly identified a two-compartment structure but produced physiologically implausible peripheral volume estimates (V2 = 149 L vs. expert's 13.2 L).","location":"Abstract","evidence_type":"empirical"},{"text":"Across datasets, PKGPT did not identify clinically established covariates, and run-to-run reproducibility was variable.","location":"Abstract","evidence_type":"empirical"},{"text":"PKGPT substantially improves the robustness and usability of LLM-generated NONMEM code compared with naïve zero-shot prompting, accelerating model drafting and iterative refinement, but physiological plausibility and clinical interpretability still require a human-in-the-loop oversight.","location":"Abstract","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"performance_metric","description":"OFV for warfarin one-compartment model: PKGPT vs. human expert","value":"[484.43 vs. 294.41]","value_numeric":null,"unit":"OFV (NONMEM objective function value)","comparison_baseline":"Human expert model","location":"Abstract / Results","is_primary_finding":true},{"metric_type":"performance_metric","description":"Theophylline Ka estimate: PKGPT vs. human expert","value":"[1.59 vs. 1.46 h]","value_numeric":null,"unit":"h (absorption rate constant)","comparison_baseline":"Human expert model","location":"Abstract / Results","is_primary_finding":false},{"metric_type":"performance_metric","description":"Tobramycin V2 estimate: PKGPT vs. human expert — physiological plausibility failure","value":"[149 L vs. 13.2 L]","value_numeric":null,"unit":"L (peripheral volume of distribution)","comparison_baseline":"Human expert model (13.2 L is physiologically consistent)","location":"Abstract / Results","is_primary_finding":true},{"metric_type":"performance_metric","description":"Theophylline CL estimate: PKGPT vs. human expert","value":"[0.0399 vs. 0.0404 L/h/kg]","value_numeric":null,"unit":"L/h/kg","comparison_baseline":"Human expert model","location":"Abstract / Results","is_primary_finding":false}]},"relevance":{"pillars":["generative_ai"],"gaps_addressed":["Activity 1 benchmark anchor: first agentic NONMEM system benchmarked against human expert models with quantitative OFV and parameter estimates — the comparative activity can position Claude/Codex/Antigravity against PKGPT's documented gaps (covariate failure, V2 plausibility, reproducibility)","Activity 2 failure mode evidence: V2=149 L vs 13.2 L is a documented real-world plausibility failure (M4.3 category: plausibility error) and covariate identification failure is a structural reasoning gap","Establishes that agentic execution (PKGPT) is categorically different from static zero-shot prompting — relevant to interpreting Codex agent capability","Three public benchmark datasets (warfarin, theophylline, tobramycin) proposed as standard test cases for comparative activities"],"topics":["LLM_agents","NONMEM","PopPK","agentic_AI","human_benchmarking","pharmacometrics","Gemini","physiological_plausibility","covariate_analysis","reproducibility","Yonsei","Seoul_National_University"],"relevance_score":"high"},"relationships":{"cites":["shin_2024_llm","zheng_2025_llm"],"cited_by":[],"extends":["zheng_2025_llm"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-29","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search during Activity 1 literature support (PMID 42076151). DOI 10.3390/pharmaceutics18040501 (Pharmaceutics vol 18 issue 4). Open access via PMC13118610. This paper provides quantitative human-vs-LLM OFV comparison and the tobramycin V2 plausibility failure, which are key anchor points for Activity 1/2 scoring design. A prior note incorrectly described a separate pkgpt_2026 record using DOI 10.3390/pharmaceutics18020215; authoritative lookup showed that DOI belongs to an unrelated wound-healing paper, so the phantom relationship was removed on 2026-08-29. Upgrade to full_text via PMC when needed."},"title_short":"PKGPT: Agentic LLM for NONMEM PopPK with human benchmarking — V2=149 vs 13.2 L plausibility failure (Kwack et al., Pharmaceutics 2026)"},{"id":"chen_2026_pbpkml","source_type":"paper","title":"Integration of Machine Learning With PBPK and QSAR Modeling Approaches to Facilitate Drug Discovery and Development","authors":["Chen X","Lin Z"],"year":2026,"doi":"10.1002/psp4.70228","pmid":41878892,"url":null,"journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Review of how machine learning enhances QSAR predictions as inputs to conventional PBPK frameworks across drug development phases. ML-powered QSAR models predict partition coefficients, metabolic clearance rates, and plasma protein binding from chemical structure, extending PBPK applicability without altering the mechanistic framework. When ML-predicted parameters are used as PBPK inputs, predictive accuracy improves significantly vs. conventional regression-based QSAR; however, challenges remain in applicability domain, interpretability, and regulatory acceptance of ML-derived parameters. University of Florida (Lin group), CPT:PSP 2026.","key_findings":["Traditional PBPK models face applicability-domain limitations when physicochemical/biochemical parameters cannot be reliably estimated for novel compounds; ML-QSAR addresses this by predicting required inputs from chemical structure","ML-enhanced QSAR → PBPK workflow: ML improves QSAR prediction quality, which in turn improves PBPK simulation reliability — the two tools compound each other's performance","Key PBPK inputs predicted by ML: partition coefficients, metabolic clearance rates (CL_int), plasma protein binding (fu) — exactly the parameters an LLM would need to correctly generate a PBPK model","Three remaining challenges: limited chemical diversity in QSAR training sets, model interpretability concerns (black-box ML parameters in mechanistic models), and evolving regulatory acceptance of ML-derived inputs in PBPK submissions","Future direction: standardized validation approaches and regulatory guidance for ML-enhanced PBPK submissions — currently no consensus framework exists"],"methods_discussed":["PBPK","QSAR","machine_learning","ML_PBPK_integration","parameter_prediction","drug_discovery","ADME_prediction"],"datasets_referenced":[],"tools_software":["PBPK_platforms_general","QSAR_tools_general"],"limitations":["Review article — does not present original ML model performance data","Does not address LLM-generated PBPK models — focuses on ML as parameter-prediction tool, not model structure generation","Regulatory guidance section is prospective — no finalized framework exists yet for ML-PBPK submissions"],"extracted_claims":[{"text":"ML-enhanced QSAR models address input parameter limitations by predicting required parameters directly from chemical structure, thereby extending PBPK applicability to diverse chemical space without altering the mechanistic model framework itself.","location":"Abstract","evidence_type":"review"},{"text":"Challenges remain, including limited chemical diversity in QSAR training data sets, model interpretability concerns, and evolving regulatory considerations for ML-derived parameters in PBPK submissions.","location":"Abstract","evidence_type":"review"}],"numerical_findings":[]},"relevance":{"pillars":["generative_ai","hybrid_foundations"],"gaps_addressed":["Activity 3 context: documents what ML can and cannot do for PBPK (parameter prediction only, not structure generation) — establishes that LLM-generated PBPK structure is genuinely novel territory unaddressed by existing ML+PBPK literature","Activity 3 scoring anchor: the three PBPK input categories (partition coefficients, metabolic clearance, plasma protein binding) that ML predicts are the same parameters an LLM must correctly specify when generating a PBPK model — can use ML benchmark values as plausibility reference","Regulatory dimension: ML-derived PBPK parameters face the same interpretability and validation challenges as LLM-generated models — informs the regulatory scoring layer of Activity 3","White-space confirmation: ML+PBPK literature focuses entirely on parameter inputs, not structural model generation — LLM-generated PBPK structure is an unexplored contribution"],"topics":["PBPK","QSAR","machine_learning","ML_PBPK","ADME","regulatory","drug_discovery","U_Florida","Lin_group","parameter_prediction"],"relevance_score":"medium"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-29","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'machine learning PBPK QSAR' (PMID 41878892). DOI 10.1002/psp4.70228. CPT:PSP 2026, vol 15 issue 4. Chen X + Lin Z = University of Florida, Department of Environmental and Global Health + Center for Pharmacometrics and Systems Pharmacology. Open access. Primary value for Activity 3 scoping: confirms that ML+PBPK literature focuses entirely on parameter prediction inputs, not structural model generation — LLM-generated PBPK structure is genuinely novel territory. Upgrade to full_text via PMC if regulatory section needs detail."},"title_short":"ML+PBPK+QSAR integration review: parameter prediction as PBPK input; regulatory challenges (Chen & Lin, UF, CPT:PSP 2026)"},{"id":"marshall_2016_mid3","source_type":"paper","title":"Good Practices in Model-Informed Drug Discovery and Development: Practice, Application, and Documentation","authors":["Marshall, Simon F","Burghaus, Rolf","Chenel, Marylore"],"year":2016,"doi":"10.1002/psp4.12049","pmid":27069774,"url":"https://pubmed.ncbi.nlm.nih.gov/27069774/","journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"An EFPIA MID3 workgroup paper proposes good-practice recommendations to improve consistency in model-informed drug discovery and development practice, application, and documentation.","key_findings":["MIDD planning, application, and documentation benefit from shared good-practice expectations.","The paper frames model-informed work as a decision-support process spanning development and regulatory interaction.","It provides an established pharmacometrics foundation for the Credibility Evidence Package."],"methods_discussed":["model_informed_drug_development","documentation","decision_support"],"datasets_referenced":[],"tools_software":[],"limitations":["Published before current AI/ML-specific regulatory guidance; does not operationalize hybrid-model lifecycle controls."],"extracted_claims":[]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability","optimal_control_rl","generative_ai"],"gaps_addressed":["MIDD evidence planning and documentation for AI/ML-augmented pharmacometric models"],"topics":["MIDD","documentation","credibility","regulatory"],"relevance_score":"high"},"relationships":{"extends":[],"cites":[],"cited_by":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-29","read_by":"claude","read_depth":"abstract_only","notes":"Focused regulatory-lifecycle search; full-text follow-up is warranted before external guidance is drafted."},"title_short":"MID3 good practice: practice, application, and documentation (Marshall et al. 2016)"},{"id":"cabitza_2021_external_validation","source_type":"paper","title":"The importance of being external. Methodological insights for the external validation of machine learning models in medicine","authors":["Cabitza, Federico"],"year":2021,"doi":"10.1016/j.cmpb.2021.106288","pmid":34352688,"url":"https://pubmed.ncbi.nlm.nih.gov/34352688/","journal_or_venue":"Computer Methods and Programs in Biomedicine","content":{"abstract_summary":"A methodological paper on external validation of medical ML models that examines how training-validation similarity affects generalizability and proposes assessing discrimination, utility, and calibration together.","key_findings":["External validation should assess more than discrimination alone.","Dataset similarity and covariate shift affect apparent generalizability.","Discrimination, utility, and calibration provide complementary validation dimensions."],"methods_discussed":["external_validation","calibration","decision_utility","dataset_shift"],"datasets_referenced":[],"tools_software":[],"limitations":["General medical ML framework rather than pharmacometric or hybrid-model-specific guidance."],"extracted_claims":[]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["External validation, calibration, and decision-relevant evaluation for hybrid PK/PD models"],"topics":["external_validation","calibration","transportability","benchmarking"],"relevance_score":"high"},"relationships":{"extends":[],"cites":[],"cited_by":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-29","read_by":"claude","read_depth":"abstract_only","notes":"Focused validation/tran ology Model Development","authors":["Saini A","Farnoud A"],"year":2025,"doi":"10.1002/psp4.70127","pmid":41159846,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12625087/","journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Describes a modular, multi-agent QSP platform spanning literature extraction, effect-diagram construction, ODE generation, evaluation, and reporting. Two rare-disease case studies show high extraction precision but lower recall, model-to-model and run-to-run variability, and continued need for human verification.","key_findings":["Blood-coagulation extraction from 10 papers produced 179 entity pairs and 105 retained mechanisms; precision was 99.1%, recall 93.8%, and F1 96.4%.","Gaucher-disease extraction from 9 papers produced 151 pairs and 68 retained mechanisms; precision was 100.0%, recall 86.1%, and F1 92.5%.","The reported 40% time saving came from one internal knowledge-synthesis project reduced from approximately 2 weeks to 6 days and requires broader validation.","Repeated runs and different GPT variants varied in extraction completeness, with PDF formatting and context-window limitations contributing to missed mechanisms.","Generated base models still used placeholder parameters and omitted some cellular dynamics, so the evidence-to-model path was not shown to be autonomously decision-ready."],"methods_discussed":["LLM_agents","RAG","knowledge_graph","relation_extraction","QSP","effect_diagrams","ODE_generation"],"datasets_referenced":["blood_coagulation_10-paper_corpus","Gaucher_disease_9-paper_corpus"],"tools_software":["GPT-4o","Claude_Sonnet","TxGemma","LangChain","Pinecone","AWS","Streamlit"],"limitations":["Only two rare-disease literature sets were used for formal extraction evaluation.","Recall was lower than precision and varied by disease area.","Mandatory human verification remained part of the workflow.","The 40% time estimate came from a single internal project and only the knowledge-synthesis phase.","Generated models used placeholder parameters and lacked some cellular dynamics."],"extracted_claims":[{"text":"The primary challenge identified through validation is extraction completeness rather than accuracy.","location":"Discussion","evidence_type":"empirical"},{"text":"Repeated processing of identical documents produced variable numbers of extracted mechanisms, requiring multiple validation approaches and quality control.","location":"Results, model variability and technical limitations","evidence_type":"empirical"},{"text":"Each extracted biological pair is presented with its source paragraph and page number for expert verification.","location":"Discussion","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"performance_metric","description":"Blood-coagulation mechanism-extraction precision, recall, and F1","value":"[99.1%, 93.8%, 96.4%]","value_numeric":null,"unit":"%","comparison_baseline":"Expert-validated mechanisms in the 10-paper corpus","location":"Results, Section 3.2.2","is_primary_finding":true},{"metric_type":"performance_metric","description":"Gaucher-disease mechanism-extraction precision, recall, and F1","value":"[100.0%, 86.1%, 92.5%]","value_numeric":null,"unit":"%","comparison_baseline":"Expert-validated mechanisms in the 9-paper corpus","location":"Results, Section 3.2.2","is_primary_finding":true},{"metric_type":"effect_size","description":"Reported reduction in knowledge-synthesis duration","value":"~40% (approximately 2 weeks to 6 days)","value_numeric":40,"unit":"%","comparison_baseline":"Traditional literature review and effect-diagram validation in one internal project","location":"Discussion","is_primary_finding":true},{"metric_type":"count","description":"Extracted and retained blood-coagulation interactions","value":"179 extracted; 105 retained","value_numeric":null,"unit":"interaction pairs","comparison_baseline":null,"location":"Results, Section 3.1.1","is_primary_finding":false},{"metric_type f 44 model diagrams correctly on the initial prompt; iterative correction produced diagrams for all 44.","Claude produced 38 of 44 parameter tables successfully on the initial prompt, with errors involving initial/iteration values, OMEGA blocks, and CV calculations.","Eight of 44 generated reports initially omitted parameter values in models with many parameters.","ChatGPT generated simulations for meropenem and nivolumab, but the complex nivolumab clearance relationship still omitted covariate values after correction.","The study evaluates output translation and simulation, so a new diagnostics benchmark should claim novelty only for its engineered reasoning traps, current products, and blinded expert scoring."],"methods_discussed":["LLM","NONMEM","output_interpretation","Mermaid_diagrams","parameter_tables","report_generation","PK_simulation"],"datasets_referenced":["DDMoRe_model_repository","nivolumab_PK_model","meropenem_PK_model"],"tools_software":["NONMEM","Claude","ChatGPT","Python","Mermaid","APAI"],"limitations":["Different LLM products were used for output interpretation and simulation tasks.","Only two relatively simple PK models were used for the simulation assessment.","Prompt correction was allowed but not structured as a uniform agentic retry budget.","The accessible detailed source was the author preprint corresponding to the published version."],"extracted_claims":[{"text":"Claude generated model structure diagrams for 40 of 44 NONMEM outputs with the initial prompt, and the remaining cases were resolved with additional prompts.","location":"Results","evidence_type":"empirical"},{"text":"Complex OMEGA structures and long parameter lists caused omissions or incorrect value extraction.","location":"Results, parameter tables and reports","evidence_type":"empirical"},{"text":"The covariate-rich nivolumab simulation required correction and still omitted some clearance covariate values.","location":"Results, PK simulations","evidence_type":"empirical"}]," LM interpretation and simulation from NONMEM outputs (Cha et al. 2025)"},{"id":"jiang_2024_synthetic_pkpd","source_type":"paper","title":"Generative models for synthetic data generation: application to pharmacokinetic/pharmacodynamic data","authors":["Jiang Y","Garcia-Duran A","Bachali Losada I","Girard P","Terranova N"],"year":2024,"doi":"10.1007/s10928-024-09935-6","pmid":39192091,"url":"https://pubmed.ncbi.nlm.nih.gov/39192091/","journal_or_venue":"Journal of Pharmacokinetics and Pharmacodynamics","content":{"abstract_summary":"Benchmarks PAR, TimeGAN, and MLP conditional GAN approaches on clinical-style longitudinal datasets containing covariates and PK/PD endpoints. Evaluation combines ML fidelity/usefulness scores, univariate distributional tests, and pharmacometrics-specific metrics; MLP cGAN performed best overall on most reported metrics.","key_findings":["The benchmark addresses longitudinal observations, heterogeneous covariates/endpoints, and multiple treatment arms.","Evaluation included discriminative and predictive scores, Kolmogorov-Smirnov and chi-square tests, and pharmacometrics-specific measures.","MLP cGAN performed best overall for most evaluated metrics.","The work supports synthetic-data augmentation and sharing, but the accessible evidence does not establish downstream inferential equivalence, causal validity, or privacy guarantees."],"methods_discussed":["PAR","TimeGAN","MLP_cGAN","synthetic_data","Kolmogorov-Smirnov_test","chi-square_test","PKPD_validation"],"datasets_referenced":["12_Simulx-generated_PKPD_datasets"],"tools_software":["Simulx"],"limitations":["Detailed full-text results were not openly accessible during extraction.","The public abstract and related PAGE study description do not provide a complete downstream model-refitting comparison.","Distributional and predictive similarity do not by themselves establish counterfactual validity or disclosure protection."],"extracted_claims":[{"text":"MLP conditional GAN exhibited the best overall performance for most of the evaluated metrics.","location":"Abstract","evidence_type":"empirical"},{"text":"Synthetic-data quality was evaluated using ML, univariate statistical, and pharmacometrics-related metrics.","location":"Abstract and associated PAGE methods summary","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Simulx-generated benchmark datasets described in the associated PAGE study","value":"12","value_numeric":12,"unit":"N (datasets)","comparison_baseline":null,"location":"Associated PAGE methods summary","is_primary_finding":false}]},"relevance":{"pillars":["generative_ai"],"gaps_addressed":["Supports M4.5-A10 and the requirement to supplement generic fidelity tests with pharmacometric and downstream model-based validation."],"topics":["synthetic_data","PKPD","validation","virtual_patients","generative_models"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"review_status":"draft","provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-29","read_by":"codex","read_depth":"abstract_only","notes":"Publication metadata and abstract verified through PubMed/EPFL. The associated PAGE abstract was used only to identify the method families and reported 12 simulated datasets; full-paper numerical extraction remains a follow-up if licensed access is available."},"title_short":"Generative synthetic PK/PD data benchmark (Jiang et al. 2024)"},{"id":"pasculli_2025_synthetic_data_regulation","source_type":"paper","title":"Synthetic Data in Healthcare and Drug Development: Definitions, Regulatory Frameworks, Issues","authors":["Pasculli G","Virgolin M","Myles P","Vidovszky A","Fisher C","Biasin E","Mourby M","Pappalardo F","D'Amico S","Torchia M","Chebykin A","Carbone V","Emili L","Roeshammar D"],"year":2025,"doi":"10.1002/psp4.70021","pmid":40193292,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12072219/","journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Critical narrative review distinguishing observed external controls from artificial data generated by process-driven or data-driven methods. It proposes clearer terminology and emphasizes provenance, transparency, validation, and the absence of a harmonized regulatory pathway for AI-generated synthetic data in drug approval.","key_findings":["The PubMed search covered 1986-2025, returned 208 results, and retained 91 relevant instances.","The paper distinguishes observed data, RWD, fully/partially/hybrid synthetic data, external control arms, process-driven synthetic data, and data-driven synthetic data.","Process-driven simulation such as PBPK, PopPK/PD, and QSP has established use in drug development, whereas data-driven AI-generated synthetic data remains less established regulatorily.","Synthetic-data provenance should document source data, generation algorithms/models, transformations, and intended use.","Distributional similarity and privacy assumptions should not be treated as automatic evidence of regulatory suitability."],"methods_discussed":["critical_narrative_review","synthetic_data","external_control_arms","data_provenance","regulatory_analysis"],"datasets_referenced":["PubMed_1986-2025_search"],"tools_software":[],"limitations":["Critical narrative rather than systematic-review methodology.","Terminology and regulatory frameworks are evolving.","The paper does not empirically compare Claude, Codex, or Antigravity."],"extracted_claims":[{"text":"Observed external controls and algorithmically generated artificial data should not both be left under an ambiguous synthetic-data label.","location":"Discussion and Conclusions","evidence_type":"review"},{"text":"Robust provenance requires documentation of source data, generating models, transformations, and methodology.","location":"Section 4.1, Provenance of Synthetic Data","evidence_type":"review"},{"text":"AI-generated data remain without a harmonize lification, and reasons models were not considered qualified. It shows that intended-use qualification, not structural plausibility alone, determines whether PBPK evidence can support decisions.","key_findings":["Twenty-five of 95 full-basis applications contained PBPK modeling.","Across 65 proposed intended uses, enzyme/transporter DDI prediction was the most common at 69%.","Only 28% of applications containing PBPK models were considered qualified according to the EMA reporting guideline.","Qualification requires verification, validation against observed data, and evaluation against the question of interest.","Model impact and context determine the needed evidence and acceptance criteria."],"methods_discussed":["PBPK","regulatory_review","model_qualification","context_of_use","DDI"],"datasets_referenced":["EMA_full-basis_MAAs_2022-2023"],"tools_software":[],"limitations":["The analysis covers EMA approvals from only 2022 and 2023.","Confidential submission details limit public transparency.","The review evaluates submitted PBPK evidence, not LLM-generated models."],"extracted_claims":[{"text":"A PBPK model used as key regulatory evidence must be qualified for its intended use.","location":"Abstract and Introduction","evidence_type":"regulatory"},{"text":"Qualification combines platform/equation verification, validation against observed data, and evaluation for the question of interest.","location":"Introduction","evidence_type":"regulatory"},{"text":"Most submitted models were not considered qualified for their intended uses.","location":"Abstract","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Full-basis EMA applications reviewed","value":"95","value_numeric":95,"unit":"N (applications)","comparison_baseline":null,"location":"Abstract","is_primary_finding":false},{"metric_type":"count","description":"Applications containing PBPK modeling","value":"25/95","value_numeric":25,"unit":"N (applications)","comparison_ // ── Helpers ─────────────────────────────────────────────
function esc(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function toggle(arr, v) {
  const i = arr.indexOf(v);
  if (i >= 0) arr.splice(i,1); else arr.push(v);
}
function byId(id) { return document.getElementById(id); }

// ── Filter ──────────────────────────────────────────────
function filtered() {
  return SOURCES.filter(s => {
    const pillars = s.relevance && s.relevance.pillars ? s.relevance.pillars : [];
    if (state.pillars.length && !state.pillars.some(p => pillars.includes(p))) return false;
    if (state.types.length  && !state.types.includes(s.source_type)) return false;
    const depth = s.provenance ? s.provenance.read_depth : null;
    if (state.depths.length && !state.depths.includes(depth)) return false;
    if (state.reviews.length && !state.reviews.includes(s.review_status || "legacy")) return false;
    if (state.q) {
      const hay = [
        s.title_short, s.title,
        (s.authors || []).join(" "),
        (s.relevance && s.relevance.topics ? s.relevance.topics : []).join(" "),
        (s.content && s.content.abstract_summary ? s.content.abstract_summary : "")
      ].join(" ").toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    return true;
  });
}

function renderList() {
  const srcs = filtered();
  byId("count").textContent = srcs.length + " / " + SOURCES.length;
  const list = byId("list");
  list.innerHTML = "";
  srcs.forEach(function(s) {
    const pillars = s.relevance && s.relevance.pillars ? s.relevance.pillars : [];
    const dk = (s.provenance && s.provenance.read_depth) || "abstract_only";
    const d  = DEPTH[dk] || DEPTH.abstract_only;
    const t  = TYPE[s.source_type] || { label: s.source_type, color: "#888" };
    const row = document.createElement("div");
    row.className = "list-row" + (s.id === state.selected ? " selected" : "");
    row.dataset.id = s.id;
    row.innerHTML =
      "<div class='row-top'>" +
        "<div class='row-dots'>" +
          pillars.map(function(p) {
            var pi = PILLAR[p] || { color:"#ccc", label:p };
            return "<span class='dot' style='background:" + pi.color + "' title='" + esc(pi.label) + "'></span>";
          }).join("") +
        "</div>" +
        (s.review_status === "draft" ? "<span class='row-review'>draft</span>" : "") +
        "<span class='row-type' style='background:" + t.color + "'>" + t.label + "</span>" +
      "</div>" +
      "<div class='row-title'>" + esc(s.title_short || s.title || s.id) + "</div>" +
      "<div class='row-meta'>" +
        "<span class='row-year'>" + (s.year || "—") + "</span>" +
        "<div class='depth-bar-wrap' title='" + d.label + "'>" +
          "<div class='depth-bar' style='width:" + d.width + ";background:" + d.color + "'></div>" +
        "</div>" +
        "<span class='depth-label'>" + d.label + "</span>" +
      "</div>";
    row.addEventListener("click", function() {
      state.selected = s.id;
      renderList();
      renderDetail(s);
    });
    list.appendChild(row);
  });
}

// ── Detail ──────────────────────────────────────────────
function renderDetail(s) {
  byId("detail-empty").style.display = "none";
  const el = byId("detail");
  el.style.display = "block";

  const pillars = s.relevance && s.relevance.pillars ? s.relevance.pillars : [];
  const dk  = (s.provenance && s.provenance.read_depth) || "abstract_only";
  const d   = DEPTH[dk] || DEPTH.abstract_only;
  const t   = TYPE[s.source_type] || { label: s.source_type, color: "#888" };
  const c   = s.content   || {};
  const rel = s.relevance  || {};
  const prov= s.provenance || {};
  const rels= s.relationships || {};

  var doiHtml = "";
  if (s.doi) {
    doiHtml = "<a class='doi-link' href='https://doi.org/" + esc(s.doi) + "' target='_blank' rel='noopener'>doi:" + esc(s.doi) + "</a>";
  } else if (s.url) {
    doiHtml = "<a class='doi-link' href='" + esc(s.url) + "' target='_blank' rel='noopener'>" + esc(s.url) + "</a>";
  }

  var kfHtml     = (c.key_findings     || []).map(function(f) { return "<li>" + esc(f) + "</li>"; }).join("");
  var methHtml   = (c.methods_discussed|| []).map(function(m) { return "<span class='tag t-method'>" + esc(m.replace(/_/g," ")) + "</span>"; }).join("");
  var toolHtml   = (c.tools_software   || []).map(function(m) { return "<span class='tag t-tool'>"   + esc(m)                  + "</span>"; }).join("");
  var topHtml    = (rel.topics         || []).map(function(m) { return "<span class='tag t-topic'>"  + esc(m.replace(/_/g," ")) + "</span>"; }).join("");
  var gapsHtml   = (rel.gaps_addressed || []).map(function(g) { return "<li>" + esc(g) + "</li>"; }).join("");

  var claimsHtml = (c.extracted_claims || []).map(function(cl) {
    return "<div class='claim-item'>" +
      "<div class='claim-text'>" + esc(cl.text) + "</div>" +
      "<div class='claim-meta'><span class='tag t-evid'>" + esc(cl.evidence_type) + "</span>" +
        "<span class='claim-loc'>" + esc(cl.location) + "</span></div>" +
      "</div>";
  }).join("");

  var nums = c.numerical_findings || [];
  var numHtml = "";
  if (nums.length) {
    numHtml = "<div class='dsec'><h3>Numerical Findings</h3>" +
      "<table class='num-tbl'><thead><tr><th>Metric</th><th>Value</th><th>vs.</th><th>Location</th></tr></thead><tbody>" +
      nums.map(function(n) {
        return "<tr class='" + (n.is_primary_finding ? "pri" : "") + "'>" +
          "<td class='num-desc'>" + esc(n.description) + "</td>" +
          "<td><span class='num-val'>" + esc(n.value) + "</span>" +
            (n.unit ? " <span class='num-unit'>" + esc(n.unit) + "</span>" : "") + "</td>" +
          "<td class='num-comp'>" + (n.comparison_baseline ? esc(n.comparison_baseline) : "—") + "</td>" +
          "<td class='num-locc'>" + esc(n.location) + "</td>" +
          "</tr>";
      }).join("") +
      "</tbody></table></div>";
  }

  function relGroup(ids, label) {
    if (!ids || !ids.length) return "";
    var links = ids.map(function(id) {
      var found = SOURCES.find(function(x) { return x.id === id; });
      var name  = found ? (found.title_short || found.title || id) : id;
      return "<span class='rel-link' data-id='" + esc(id) + "'>" + esc(name) + "</span>";
    }).join("");
    return "<div class='rel-group'><span class='rel-lbl'>" + label + "</span>" + links + "</div>";
  }
  var relHtml = [
    relGroup(rels.cites,       "Cites"),
    relGroup(rels.cited_by,    "Cited by"),
    relGroup(rels.extends,     "Extends"),
    relGroup(rels.contradicts, "Contradicts"),
  ].filter(Boolean).join("");

  var auth = (s.authors || []).join(", ");

  el.innerHTML =
    "<div class='detail-badges'>" +
      pillars.map(function(p) {
        var pi = PILLAR[p] || { color:"#888", label:p };
        return "<span class='pillar-badge' style='background:" + pi.color + "'>" + esc(pi.label) + "</span>";
      }).join("") +
      "<span class='type-badge' style='background:" + t.color + "'>" + t.label + "</span>" +
      "<span class='depth-badge' style='border-color:" + d.color + ";color:" + d.color + "'>" + d.label + "</span>" +
      (s.review_status === "draft" ? "<span class='review-badge'>Draft - human review required</span>" : "") +
      (s.review_status === "reviewed" ? "<span class='review-badge' style='border-color:#16a34a;color:#166534;background:#dcfce7'>Human reviewed</span>" : "") +
    "</div>" +
    "<h1 class='detail-title'>" + esc(s.title || s.title_short || s.id) + "</h1>" +
    (auth ? "<div class='detail-authors'>" + esc(auth) + "</div>" : "") +
    "<div class='detail-venue'>" +
      (s.year           ? "<span class='detail-year'>"    + s.year                    + "</span>" : "") +
      (s.journal_or_venue ? "<span class='detail-journal'>" + esc(s.journal_or_venue) + "</span>" : "") +
      doiHtml +
    "</div>" +

    "<div class='dsec'><h3>Abstract Summary</h3>" +
      "<p class='abstract-p'>" + esc(c.abstract_summary || "—") + "</p></div>" +

    (kfHtml   ? "<div class='dsec'><h3>Key Findings</h3><ul class='flist'>" + kfHtml + "</ul></div>" : "") +

    (methHtml || toolHtml
      ? "<div class='dsec'><h3>Methods &amp; Tools</h3><div class='tags-row'>" + methHtml + toolHtml + "</div></div>"
      : "") +

    (claimsHtml ? "<div class='dsec'><h3>Extracted Claims</h3>" + claimsHtml + "</div>" : "") +

    numHtml +

    (gapsHtml ? "<div class='dsec'><h3>Gaps Addressed</h3><ul class='flist'>" + gapsHtml + "</ul></div>" : "") +

    (topHtml  ? "<div class='dsec'><h3>Topics</h3><div class='tags-row'>" + topHtml + "</div></div>" : "") +

    "<div class='dsec'><h3>Provenance</h3><div class='prov-grid'>" +
      "<span class='prov-k'>Read depth</span><span class='prov-v' style='color:" + d.color + "'>" + d.label + "</span>" +
      "<span class='prov-k'>Date read</span><span class='prov-v'>"    + esc(prov.date_read    || "—") + "</span>" +
      "<span class='prov-k'>How obtained</span><span class='prov-v'>" + esc(prov.how_obtained || "—") + "</span>" +
      "<span class='prov-k'>Read by</span><span class='prov-v'>"      + esc(prov.read_by      || "—") + "</span>" +
      "<span class='prov-k'>Review status</span><span class='prov-v'>" + esc(s.review_status || "legacy / not recorded") + "</span>" +
      (s.reviewed_by ? "<span class='prov-k'>Reviewed by</span><span class='prov-v'>" + esc(s.reviewed_by) + "</span>" : "") +
      (s.reviewed_date ? "<span class='prov-k'>Review date</span><span class='prov-v'>" + esc(s.reviewed_date) + "</span>" : "") +
      (s.review_notes ? "<span class='prov-k'>Review notes</span><span class='prov-v prov-notes'>" + esc(s.review_notes) + "</span>" : "") +
      (prov.notes ? "<span class='prov-k'>Notes</span><span class='prov-v prov-notes'>" + esc(prov.notes) + "</span>" : "") +
    "</div></div>" +

    (relHtml ? "<div class='dsec'><h3>Related Sources</h3>" + relHtml + "</div>" : "");

  el.querySelectorAll(".rel-link").forEach(function(link) {
    link.addEventListener("click", function() {
      var id  = link.dataset.id;
      var src = SOURCES.find(function(x) { return x.id === id; });
      if (!src) return;
      state.selected = id;
      renderList();
      renderDetail(src);
      var row = document.querySelector(".list-row[data-id='" + id + "']");
      if (row) row.scrollIntoView({ block: "nearest" });
    });
  });

  el.parentElement.scrollTop = 0;
}

// ── Chip wiring ──────────────────────────────────────────
document.querySelectorAll("[data-pillar]").forEach(function(btn) {
  btn.addEventListener("click", function() {
    var p = btn.dataset.pillar;
    toggle(state.pillars, p);
    document.querySelectorAll("[data-pillar]").forEach(function(b) {
      var active = state.pillars.includes(b.dataset.pillar);
      var color  = (PILLAR[b.dataset.pillar] || {color:"#888"}).color;
      b.style.background   = active ? color : "";
      b.style.borderColor  = active ? color : "";
      b.style.color        = active ? "#fff" : "";
    });
    renderList();
  });
});

document.querySelectorAll("[data-type]").forEach(function(btn) {
  btn.addEventListener("click", function() {
    toggle(state.types, btn.dataset.type);
    btn.classList.toggle("active", state.types.includes(btn.dataset.type));
    renderList();
  });
});

document.querySelectorAll("[data-depth]").forEach(function(btn) {
  btn.addEventListener("click", function() {
    toggle(state.depths, btn.dataset.depth);
    btn.classList.toggle("active", state.depths.includes(btn.dataset.depth));
    renderList();
  });
});

document.querySelectorAll("[data-review]").forEach(function(btn) {
  btn.addEventListener("click", function() {
    toggle(state.reviews, btn.dataset.review);
    btn.classList.toggle("active", state.reviews.includes(btn.dataset.review));
    renderList();
  });
});

document.getElementById("search").addEventListener("input", function(e) {
  state.q = e.target.value.trim().toLowerCase();
  renderList();
});

renderList();
</script>
</body>
</html>
