<html lang="en">
<head>

<title>MCS SIG AI/ML — Source Library</title>
<style>
:root {
  --bg:      #f9fafb;
  --surface: #ffffff;
  --border:  #e5e7eb;
  --text:    #111827;
  --muted:   #6b7280;
  --hover:   #f3f4f6;
  --sel-bg:  #eff6ff;
  --sel-bar: #2563eb;
  --list-w:  400px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Filter bar ─────────────────────────────── */
#filters {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}
.frow {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}
.flabel {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .07em;
  min-width: 46px;
  flex-shrink: 0;
}
.fsep { flex: 1; min-width: 10px; }
.chip {
  border: 1.5px solid var(--border);
  background: var(--surface);
  border-radius: 999px;
  padding: 3px 11px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  color: var(--text);
  font-family: inherit;
  transition: background .1s, border-color .1s, color .1s;
}
.chip:hover { background: var(--hover); }
.chip.active { background: #374151; border-color: #374151; color: #fff; }

#search {
  flex: 1;
  min-width: 160px;
  max-width: 280px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 13px;
  outline: none;
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
}
#search:focus { border-color: var(--sel-bar); }
#count {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  padding-left: 8px;
}

/* ── Main split ─────────────────────────────── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── List panel ─────────────────────────────── */
#list-panel {
  width: var(--list-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--surface);
}
#list { flex: 1; overflow-y: auto; }

.list-row {
  padding: 9px 12px 8px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background .08s;
}
.list-row:hover { background: var(--hover); }
.list-row.selected { background: var(--sel-bg); border-left-color: var(--sel-bar); }

.row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 3px;
}
.row-dots { display: flex; gap: 4px; align-items: center; }
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  display: inline-block;
}
.row-type {
  font-size: 9px;
  color: #fff;
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  flex-shrink: 0;
}
.row-review {
  font-size: 9px; color: #92400e; background: #fef3c7;
  border: 1px solid #f59e0b; padding: 0 5px; border-radius: 3px;
  font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
}
.row-title {
  font-size: 12.5px;
  font-weight: 500;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 5px;
}
.row-meta { display: flex; align-items: center; gap: 6px; }
.row-year { font-size: 11px; color: var(--muted); min-width: 28px; flex-shrink: 0; }
.depth-bar-wrap {
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.depth-bar { height: 100%; border-radius: 2px; }
.depth-label { font-size: 10px; color: var(--muted); min-width: 72px; text-align: right; flex-shrink: 0; }

/* ── Detail panel ───────────────────────────── */
#detail-panel { flex: 1; overflow-y: auto; background: var(--bg); }
#detail-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--muted);
  font-size: 13px;
}
#detail { max-width: 820px; padding: 20px 24px 48px; }

.detail-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.pillar-badge {
  color: #fff; padding: 2px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 600;
}
.type-badge {
  color: #fff; padding: 2px 9px; border-radius: 4px;
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
}
.depth-badge {
  padding: 1px 9px; border-radius: 999px;
  font-size: 11px; border: 1.5px solid; background: #fff;
}
.review-badge {
  padding: 1px 9px; border-radius: 999px; font-size: 11px;
  border: 1.5px solid #f59e0b; color: #92400e; background: #fef3c7;
  font-weight: 700;
}

.detail-title { font-size: 17px; font-weight: 700; line-height: 1.35; margin-bottom: 6px; }
.detail-authors { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.detail-venue {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 6px; font-size: 12.5px; margin-bottom: 2px;
}
.detail-year { font-weight: 600; }
.detail-journal { color: var(--muted); }
a.doi-link { color: #2563eb; font-size: 12px; text-decoration: none; }
a.doi-link:hover { text-decoration: underline; }

.dsec {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin-top: 10px;
}
.dsec h3 {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted); margin-bottom: 9px;
}
.abstract-p { font-size: 13px; line-height: 1.65; }

.flist {
  font-size: 13px; line-height: 1.5;
  padding-left: 16px;
  display: flex; flex-direction: column; gap: 5px;
}

.tags-row { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.t-method { background: #dbeafe; color: #1e40af; }
.t-tool   { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
.t-topic  { background: #f3f4f6; color: #374151; }
.t-evid   { background: #fef3c7; color: #92400e; }

.claim-item {
  padding: 9px 11px;
  background: #fffbeb;
  border-left: 3px solid #d97706;
  border-radius: 0 5px 5px 0;
  margin-bottom: 7px;
}
.claim-text { font-size: 13px; line-height: 1.5; font-style: italic; margin-bottom: 5px; }
.claim-meta { display: flex; align-items: center; gap: 6px; }
.claim-loc { font-size: 11px; color: var(--muted); }

.num-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.num-tbl th {
  text-align: left; font-weight: 600; color: var(--muted);
  padding: 4px 8px; border-bottom: 1px solid var(--border); font-size: 11px;
}
.num-tbl td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.num-tbl tr:last-child td { border-bottom: none; }
.num-tbl tr.pri td { background: #f0fdf4; }
.num-val { font-weight: 700; white-space: nowrap; }
.num-unit { font-weight: 400; color: var(--muted); font-size: 10px; }
.num-comp { color: var(--muted); font-size: 11px; }
.num-locc { color: var(--muted); font-size: 11px; }
.num-desc { max-width: 220px; }

.prov-grid {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px;
}
.prov-k {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: var(--muted); padding-top: 2px;
}
.prov-v { color: var(--text); line-height: 1.45; }
.prov-notes { font-size: 12px; color: var(--muted); }

.rel-group { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px; margin-bottom: 5px; }
.rel-lbl {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  color: var(--muted); letter-spacing: .05em;
}
.rel-link {
  color: #2563eb; cursor: pointer; font-size: 11.5px;
  padding: 2px 8px; background: #eff6ff; border-radius: 4px;
  transition: background .1s;
}
.rel-link:hover { background: #dbeafe; }
</style>
</head>

const SOURCES = [{"id":"cpt_moore_2019","source_type":"paper","title":"The Mathematical and Computational Sciences Special Interest Group of the International Society of Pharmacometrics","authors":["Moore H"],"year":2019,"doi":"10.1002/psp4.12410","pmid":null,"url":null,"journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"A perspective article introducing the MCS SIG of ISoP, covering its founding in 2016, mission to bring advanced mathematical and computational techniques into drug development, leadership, early activities (ACoP sessions, poster prizes, webinars), and plans for 2019. Emphasizes the gap between cutting-edge quantitative techniques developed in academia and their adoption in the biopharma industry.","key_findings":["The MCS SIG was founded in 2016 by Wojciech Krzyzanski to promote mathematical and computational techniques in drug development that are not yet widely adopted by industry","The SIG's scope extends well beyond standard PK/PD to include dynamical systems, global sensitivity and identifiability analysis, optimal control, PDEs, delay DEs, stochastic methods, and ML/AI","By 2019, the SIG had ~45 members (~1/3 in academia) and was actively bridging academic math and the biopharma industry","The MCS SIG runs activities including ACoP luncheons, poster walks with prizes, webinars, and tutorials; it seeks to engage SIAM, Society for Mathematical Biology, and related math journals","Three sister SIGs at time of writing: QSP, SxP, Clin PMx — with overlapping interest in model evaluation questions (e.g., what model structure to use for a given biological question)"],"methods_discussed":["dynamical_systems","global_sensitivity_analysis","identifiability_analysis","optimal_control","PDEs","delay_differential_equations","stochastic_methods","machine_learning"],"datasets_referenced":[],"tools_software":["ADAPT","Monolix","NONMEM","Phoenix","R","Stan","StochSS"],"limitations":["Perspective article from 2019; SIG _baseline":null,"location":"Introduction","is_primary_finding":false},{"metric_type":"count","description":"Approximate attendees at the 2018 ACoP MCS SIG luncheon","value":"~80","value_numeric":80,"unit":"N (attendees)","comparison_baseline":null,"location":"Activities to Date","is_primary_finding":false}]},"relevance":{"pillars":[],"gaps_addressed":["Foundational context for why MCS SIG exists and what distinguishes it from other ISoP SIGs — essential for WG positioning"],"topics":["MCS_SIG_history","identifiability","optimal_control","stochastic_methods","pharmacometrics","MIDD"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["crosssig_fostvedt_2025"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"provided_by_user","date_read":"2026-08-26","read_by":"claude","read_depth":"full_text","notes":"Open-access article; full PDF provided in background folder. All 3 pages read. Foundational for understanding MCS SIG identity and differentiators."},"title_short":"MCS SIG founding article (Moore 2019)"},{"id":"crosssig_fostvedt_2025","source_type":"paper","title":"Stronger together: a cross-SIG perspective on improving drug development","authors":["Fostvedt L","Zhou J","Kondic AG","Androulakis IP","Zhang T","Pryor M","Zhuang L","Elassaiss-Schaap J","Chan P","Moore H","Avedissian SN","Tigh J","Goteti K","Thanneer N","Su J","Ait-Oudhia S"],"year":2025,"doi":"10.1007/s10928-024-09960-5","pmid":null,"url":null,"journal_or_venue":"Journal of Pharmacokinetics and Pharmacodynamics","content":{"abstract_summary":"A correspondence article summarizing the missions of all 5 ISoP SIGs (QSP, MCS, SxP, Clin PMx, PMxP) and arguing for cross-SIG collaboration within MIDD. Uses the inaugural cross-SIG session at ACoP14 (2023) as a case study. Provides a table of SIG founding dates, membership sizes, working groups, and websites, and a diagram mapping each SIG's methods to the MIDD framework with AI/ML as a cross-cutting theme.","key_findings":["As of July 2024, ISoP has 5 SIGs: QSP (founded 2014, 200+), MCS (founded 2017, 70+), SxP (founded 2016, 200+), Clin PMx (founded 2017), PMxP (founded 2024, ~50)","MCS SIG's four working groups: Modeling Delays in PKPD; Optimal Control; Sensitivity Analysis/Uncertainty Quantification; AI/Machine Learning","AI/ML is treated as a cross-SIG theme (shown at base of the MIDD diagram) rather than the exclusive domain of any one SIG","Cross-SIG collaboration demonstrated at ACoP14 (2023): three examples illustrated mathematical/computational approaches central to MIDD from QSP, MCS, and SxP perspectives","Overlapping interests include AI/ML methods, data generation, covariate selection, model evaluation, package development, and ethical AI — areas where collaboration rather than duplication is essential"],"methods_discussed":["MIDD","model_based_meta_analysis","Bayesian_statistics","latent_variable_modeling","machine_learning","optimal_control"],"datasets_referenced":["TransCelerate BioPharma Historical Trial Data Sharing Initiative"],"tools_software":[],"limitations":["Sections on each SIG are high-level; technical depth on how MCS differentiates on AI/ML is not provided","Published in early 2025; the AI/ML SIG (launched Dec 2023) is not mentioned, understating the competitive landscape"],"extracted_claims":[{"text":"\"The potential of AI/ML methodologies to transform drug discovery and development is at the forefront of our entire industry. As we attempt to identify how and where we can take advantage of opportunities from AI/ML, it is imperative that we work together and exchange knowledge.\"","location":"Discussion","evidence_type":"opinion"},{"text":"MCS SIG working groups listed in Table 1: \"Modeling Delays in PKPD; Optimal Control; Sensitivity Analysis/Uncertainty Quantification; AI/Machine learning\"","location":"Table 1","evidence_type":"review"},{"text":"\"Collaboration across the SIGs will result in better science, better leaders, and better medicines.\"","location":"Discussion","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"count","description":"MCS SIG membership as of July 2024","value":"70+","value_numeric":70,"unit":"N (members)","comparison_baseline":null,"location":"Table 1","is_primary_finding":false},{"metric_type":"count","description":"QSP SIG membership as of July 2024","value":"200+","value_numeric":200,"unit":"N (members)","comparison_baseline":null,"location":"Table 1","is_primary_finding":false},{"metric_type":"count","description":"SxP SIG membership as of July 2024","value":"200+","value_numeric":200,"unit":"N (members)","comparison_baseline":null,"location":"Table 1","is_primary_finding":false},{"metric_type":"count","description":"PMxP SIG membership (newly founded March 2024)","value":"~50","value_numeric":50,"unit":"N (members)","comparison_baseline":null,"location":"Table 1","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability","optimal_control_rl"],"gaps_addressed":["Provides the official view of each SIG's scope and working groups — essential for differentiating the MCS AI/ML WG from other ISoP SIGs","Confirms that Optimal Control and Sensitivity Analysis/UQ are established MCS SIG working groups, providing the institutional basis for Pillars 2 and 3"],"topics":["SIG_landscape","cross_SIG_collaboration","MIDD","MCS_SIG_history","pharmacometrics","AI_ML_positioning"],"relevance_score":"high"},"relationships":{"cites":["cpt_moore_2019"],"cited_by":[],"extends":["cpt_moore_2019"],"contradicts":[]},"provenance":{"how_obtained":"provided_by_user","date_read":"2026-08-26","read_by":"claude","read_depth":"sections_key","notes":"Full PDF in background folder. Read pages 1-6 of an 8-page paper; references section not captured. Critical source for understanding the formal SIG structure and MCS's positioning as of 2025."},"title_short":"Stronger together: cross-SIG perspective (Fostvedt et al. 2025)"},{"id":"aiml_chatgpt_background","source_type":"background","title":"AI/ML in Pharmaceutical R&D: Novel Methods Across the Workflow","authors":[],"year":null,"doi":null,"pmid":null,"url":null,"journal_or_venue":null,"content":{"abstract_summary":"A ChatGPT-generated survey covering AI/ML methods across the pharmaceutical R&D workflow, from literature mining through regulatory submission. Organized by workflow stage (8 stages), each section covers methods, examples, impacts, limitations/validation, and implementation considerations. Broad orientation map; not grounded in directly verifiable primary literature citations.","key_findings":["Literature mining: LLMs (GPT-4 via RAG), semantic search (BioBERT, SciBERT), and knowledge graphs now automate literature screening and evidence synthesis at scale","Target ID: GNNs on heterogeneous knowledge graphs integrate genomic, proteomic, and phenotypic data; AlphaFold provides 3D protein structures enabling binding site analysis for previously intractable targets","HCS and virtual screening: deep learning (CNNs, autoencoders) analyzes microscopy images; graph-based docking models (DeepDock) claim to outperform classical scoring in binding pose prediction","Hybrid mechanistic-ML PK/PD: ML layers learn residuals or missing dynamics on top of known mechanistic models; model credibility requires validation and interpretability (citing Baran & Gaburro)","Generative lead design: VAEs, GANs, transformers, and RL design new molecules; active learning cited as reducing experimental campaigns by ~50%","Preclinical digital twins: virtual human twins (e.g. TWIN-GPT) simulate patient physiology; physics-based multiscale models (PDEs, PBPK) combined with ML surrogates speed computation"],"methods_discussed":["LLM","RAG","knowledge_graph","GNN","AlphaFold","CNN","hybrid_mechanistic_ML","VAE","GAN","transformer","reinforcement_learning","active_learning","PBPK","digital_twins"],"datasets_referenced":["PubMed","ChEMBL","ZINC","STRING","Reactome"],"tools_software":["HuggingFace","LangChain","NLTK","spaCy","PyTorch","TensorFlow","NONMEM","Monolix","PyMC3","SimBiology","SimCYP","CellProfiler","DeepCell","AutoDock Vina","Rosetta","RDKit","Chemistry42","Nextflow"],"limitations":["Generated by ChatGPT; quantitative claims and specific references cannot be independently verified without checking each cited study","Covers the full pharma R&D pipeline broadly; pharmacometrics-specific applications (PK/PD, PMx) are only part of one section","No date-stamped literature basis; cannot determine what literature cutoff was used"],"extracted_claims":[{"text":"\"Hybrid models risk overfitting if not rigorously validated. Baran et al. note that model credibility relies on validation and interpretability rather than complexity; overly complex hybrids without clear benefit may fail regulatory acceptance.\"","location":"Model Building — Limitations/Validation","evidence_type":"review"},{"text":"\"Generative AI dramatically expands accessible chemical space, potentially finding molecules human chemists would not. Active learning shortens experimental campaigns by ~50% by only testing informative compounds.\"","location":"Lead Optimization and de Novo Design — Impacts","evidence_type":"review"},{"text":"\"LLMs can hallucinate or miss context; they perform well on abstracts but still struggle with detailed files. Knowledge graphs depend on curated sources; biases in source data propagate.\"","location":"Literature and Background Research — Limitations/Validation","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"performance_metric","description":"GPT-4 kappa agreement with human reviewers for abstract screening in a PRISMA-style NLP trial matching review (from a cited study, not original finding)","value":">0.9","value_numeric":null,"unit":"kappa","comparison_baseline":"vs. human reviewer agreement","location":"Literature and Background Research — Examples","is_primary_finding":false},{"metric_type":"effect_size","description":"Reduction in experimental campaign length using active learning for lead optimization (from a cited study, not original finding)","value":"~50%","value_numeric":50,"unit":"%","comparison_baseline":"vs. random compound selection","location":"Lead Optimization and de Novo Design — Impacts","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability","optimal_control_rl","generative_ai"],"gaps_addressed":["Broad orientation to AI/ML applications across pharma pipeline — useful for scoping the landscape before narrowing to MCS-specific angles"],"topics":["literature_mining","GNN","hybrid_mechanistic_ML","generative_design","ADMET","digital_twins","pharmacokinetics","pharmacovigilance"],"relevance_score":"medium"},"relationships":{"cites":["baran_gaburro_2026"],"cited_by":["aiml_claude_background"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"background_doc","date_read":"2026-08-26","read_by":"claude","read_depth":"sections_key","notes":"ChatGPT-generated background document. Read pages 1-5 (Literature mining through Lead Optimization stages). Remaining stages (Preclinical, Clinical, Regulatory) not read in full. Treat quantitative claims as illustrative, not verified from primary sources."},"title_short":"AI/ML in Pharma R&D — ChatGPT survey (background doc)"},{"id":"aiml_claude_background","source_type":"background","title":"Novel AI/ML & Computational Science Methods in Pharmaceutical Workflows","authors":[],"year":2026,"doi":null,"pmid":null,"url":null,"journal_or_venue":null,"content":{"abstract_summary":"A Claude-generated structured review of novel AI/ML methods in pharmaceutical workflows, explicitly grounded in PubMed literature (searches conducted May 2026, all DOIs linked). Organized into four stages: Literature & Background Research, Model Building (Target ID & Lead Discovery), Implementation (Preclinical to Clinical), and Output (Safety, Monitoring & Post-Market Surveillance). More rigorously sourced than the companion ChatGPT background document.","key_findings":["DrugProt (BERT/BioBERT on 5,000+ PubMed abstracts) produced a knowledge graph with ~54M nodes and ~19M edges, with precision/recall 0.92–0.95 for specific chemical-protein relation types","TARGETFLOW (LLM-based mining pipeline): 56% high-potential target validation rate and 100% novel-target validation pass rate on rheumatoid arthritis and idiopathic pulmonary fibrosis","DrugCLIP (contrastive learning framework, Science 2026): virtual screening up to 10 million times faster than traditional molecular docking, tested on ~10,000 human proteins vs. 500M compounds","MM-TcoCPin GNN: AUC = 0.93, F1 = 0.92 for chemical-protein interaction prediction with ablation-validated multimodal contributions","Clinical trial optimization using persona-driven LLM frameworks: 60–70% timeline reductions reported in a 2025 Drug Discovery Today review","XGBoost + SHAP on FAERS database for pharmacovigilance: AUC = 0.738 for predicting drug-associated miscarriage; SHAP identified adalimumab and infliximab as strongest predictors","Model-informed precision dosing (MIPD) with NeuralODEs and LSTM handles sparse, irregular PK data better than classical compartmental approaches"],"methods_discussed":["BioBERT","PubMedBERT","knowledge_graph","GNN","contrastive_learning","LLM","AlphaFold","VAE","GAN","neural_ODE","LSTM","MIPD","XGBoost","SHAP","UMAP"],"datasets_referenced":["PubMed","FAERS","electronic_health_records"],"tools_software":["BioBERT","NONMEM","Julia","R"],"limitations":["Claude-generated synthesis; while grounded in PubMed literature, the framing and selection of which papers to highlight reflects Claude's judgment, not a systematic PRISMA review","Only pages 1-5 of a longer document read — post-market surveillance and manufacturing sections may contain additional relevant findings","Literature cutoff May 2026; does not include publications after that date"],"extracted_claims":[{"text":"\"The DrugProt initiative at BioCreative VII demonstrates scalability: deep learning systems built on BERT/BioBERT applied to over 5,000 PubMed abstracts generated a silver-standard knowledge graph with ~54 million nodes and ~19 million edges encoding chemical–protein interactions, with precision and recall values reaching 0.92 and 0.95 for specific relation types.\"","location":"Section 1: Literature & Background Research — Named Entity Recognition","evidence_type":"empirical"},{"text":"\"A landmark 2026 paper in Science describes DrugCLIP, a contrastive learning framework enabling virtual screening up to 10 million times faster than traditional molecular docking. Tested on ~10,000 human proteins screened against 500 million compounds, it achieved a 15% hit rate against the norepinephrine transporter and a 17.5% hit rate against a target (TRIP12) using only AlphaFold2-predicted structures.\"","location":"Section 2: Model Building — Contrastive Learning for Genome-Wide Virtual Screening","evidence_type":"empirical"},{"text":"\"A 2025 Drug Discovery Today review documents 60-70% timeline reductions and improved clinical trial efficiency using [persona-driven LLM] approaches, while flagging ongoing challenges in hallucination mitigation and regulatory validation.\"","location":"Section 3: Implementation — AI in Clinical Trial Optimization","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"count","description":"Nodes in the DrugProt knowledge graph (chemical-protein interactions, BioCreative VII)","value":"~54 million","value_numeric":54000000,"unit":"nodes","comparison_baseline":null,"location":"Section 1: Literature & Background Research","is_primary_finding":false},{"metric_type":"count","description":"Edges in the DrugProt knowledge graph","value":"~19 million","value_numeric":19000000,"unit":"edges","comparison_baseline":null,"location":"Section 1: Literature & Background Research","is_primary_finding":false},{"metric_type":"performance_metric","description":"DrugProt knowledge graph precision for specific chemical-protein relation types","value":"0.92","value_numeric":0.92,"unit":"precision","comparison_baseline":null,"location":"Section 1: Literature & Background Research","is_primary_finding":false},{"metric_type":"performance_metric","description":"TARGETFLOW LLM mining pipeline: high-potential target validation rate","value":"56%","value_numeric":56,"unit":"%","comparison_baseline":null,"location":"Section 1: Literature & Background Research — Automated Target Discovery","is_primary_finding":false},{"metric_type":"computational_metric","description":"Speed advantage of DrugCLIP contrastive learning vs. traditional molecular docking","value":"10 million times faster","value_numeric":null,"unit":"fold","comparison_baseline":"vs. traditional molecular docking","location":"Section 2: Model Building — Contrastive Learning for Virtual Screening","is_primary_finding":false},{"metric_type":"performance_metric","description":"MM-TcoCPin GNN: AUC for chemical-protein interaction prediction","value":"0.93","value_numeric":0.93,"unit":"AUC","comparison_baseline":null,"location":"Section 2: Model Building — Graph Neural Networks","is_primary_finding":false},{"metric_type":"effect_size","description":"Clinical trial timeline reductions using persona-driven LLM frameworks (from cited 2025 Drug Discovery Today review)","value":"60-70%","value_numeric":null,"unit":"%","comparison_baseline":"vs. standard trial workflow (inferred)","location":"Section 3: Implementation — AI in Clinical Trial Optimization","is_primary_finding":false},{"metric_type":"performance_metric","description":"XGBoost + SHAP on FAERS database: AUC for predicting drug-associated miscarriage","value":"0.738","value_numeric":0.738,"unit":"AUC","comparison_baseline":null,"location":"Section 4: Output — Explainable ML for ADR Risk Stratification","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability","optimal_control_rl","generative_ai"],"gaps_addressed":["Maps the current state of AI/ML across the pharma pipeline with primary literature support — provides the evidence base for the gap analysis in Section 2 of the WG plan","Identifies specific gaps including model explainability limitations, hallucination risks in LLMs, and validation gaps in hybrid PK/PD models"],"topics":["literature_mining","knowledge_graph","virtual_screening","GNN","hybrid_mechanistic_ML","neural_ODE","clinical_trial_optimization","pharmacovigilance","ADMET","explainable_AI"],"relevance_score":"medium"},"relationships":{"cites":["baran_gaburro_2026","gerard_2025"],"cited_by":[],"extends":["aiml_chatgpt_background"],"contradicts":[]},"provenance":{"how_obtained":"background_doc","date_read":"2026-08-26","read_by":"claude","read_depth":"sections_key","notes":"Claude-generated background document grounded in PubMed literature (searches May 2026). Read pages 1-5 of a longer document. Metrics reported are from cited primary studies, not original findings of this document itself. More reliable than the ChatGPT companion document due to explicit primary citations."},"title_short":"Novel AI/ML in Pharmaceutical Workflows — Claude survey (background doc)"},{"id":"baran_gaburro_2026","source_type":"paper","title":"Hybrid mechanistic-machine learning PK/PD models with digital biomarkers: from cage to clinic","authors":["Baran SW","Gaburro S"],"year":2026,"doi":"10.3389/fphar.2026.1815118","pmid":null,"url":null,"journal_or_venue":"Frontiers in Pharmacology","content":{"abstract_summary":"A review of hybrid mechanistic-ML PK/PD modeling focused on digital biomarker integration. Surveys model architectures, covariate discovery, cross-species scaling, and validation for preclinical-to-clinical extrapolation (2015–2025 literature). Concludes that model credibility depends on validation rigor and regulatory alignment, not algorithmic novelty.","key_findings":["Hybrid approaches improve clearance estimation, covariate discovery, and cross-species scaling when the mechanistic model is structurally sound but parametrically under-identified","Adding an ML layer risks overfitting without measurable gain when mechanistic models already fit well and sample sizes are small","Integration of multimodal (digital biomarker) datasets introduces challenges: missing data, device drift, and data leakage requiring explicit mitigation","Credibility depends on validation rigor, interpretability, and regulatory alignment rather than algorithmic novelty","Reporting and audit practices are needed to support robustness, reproducibility, and regulatory review"],"methods_discussed":["hybrid_mechanistic_ML","neural_ODE","digital_biomarkers","cross_species_scaling","covariate_discovery"],"datasets_referenced":[],"tools_software":[],"limitations":["Only abstract read; extracted claims may not capture nuance from the Methods or Results sections","Narrative (non-systematic) review; search protocol and inclusion criteria not described in abstract — potential selection bias","No quantitative synthesis of hybrid model performance across studies; conclusions are qualitative"],"extracted_claims":[{"text":"\"The credibility of hybrid models depends on validation rigor, interpretability, and regulatory alignment rather than on algorithmic novelty.\"","location":"Abstract / Conclusions","evidence_type":"review"},{"text":"\"When mechanistic models fit well and sample sizes are small, adding an ML layer risks overfitting without measurable gain.\"","location":"Discussion","evidence_type":"review"},{"text":"\"Models that are prospectively tested, transparently documented, and fitted to a defined context of use will be more influential than those that are merely complex.\"","location":"Conclusions","evidence_type":"review"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Publication date range covered by the review","value":"2015–2025","value_numeric":null,"unit":"years","comparison_baseline":null,"location":"Abstract","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["No mathematical criteria for when hybrid models add value over purely mechanistic models","Lack of validation and benchmarking standards for hybrid PK/PD models","FDA credibility framework not yet operationalized for hybrid ML-mechanistic pharmacometric models"],"topics":["hybrid_mechanistic_ML","pharmacokinetics","pharmacodynamics","validation","regulatory","digital_biomarkers","cross_species"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["aiml_chatgpt_background","aiml_claude_background"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-26","read_by":"claude","read_depth":"abstract_only","notes":"Retrieved via PubMed search for 'machine learning pharmacokinetics pharmacodynamics hybrid model 2025'. Full abstract available. Primary evidence source for gap: no mathematical criteria for when hybrid models add value."},"title_short":"Hybrid mechanistic-ML PK/PD with digital biomarkers (Baran & Gaburro 2026)"},{"id":"dermawan_2026","source_type":"paper","title":"Global Trends in Integrating Machine Learning (ML) with Model-Informed Drug Development (MIDD): A Bibliometric and Systematic Review (2015-2025)","authors":["Dermawan D","Chtita S","Alotaiq N"],"year":2026,"doi":"10.3390/pharmaceutics18050542","pmid":42198236,"url":null,"journal_or_venue":"Pharmaceutics","content":{"abstract_summary":"A combined bibliometric and systematic review of ML-MIDD research (2015–2025) using Web of Science, Scopus, and PubMed. Starting from 770 records, 607 unique publications were identified after deduplication; 560 met eligibility criteria. Findings: (1) ML-MIDD follows exponential growth (Price's Law) from 7 publications in 2016 to 159 in 2025 (22-fold); (2) US and China dominate output; (3) thematic evolution proceeds from foundational PK/PD-ML methods (2016–2018) → hybrid mechanistic-ML, deep learning, and RL (2022–2025); (4) formal regulatory endorsement of ML-MIDD as a standalone methodology has not yet occurred — ML components appear as adjuncts to established MIDD workflows in submissions. Tools: Bibliometrix, VOSviewer, PRISMA. PROSPERO registered: CRD420251276229.","key_findings":["ML-MIDD publications follow exponential (Price's Law) growth: 7 articles in 2016 → 159 in 2025 (>22-fold increase); confirms the field is transitioning from early exploration to rapid maturation","Only 4.3% of publications were indexed in all three databases (Web of Science, Scopus, PubMed) — extreme fragmentation requires multi-database retrieval; using PubMed alone would miss >60% of relevant ML-MIDD literature","Top journals: CPT: Pharmacometrics & Systems Pharmacology (5.1%) and J Pharmacokinetics Pharmacodynamics (5.1%) — core pharmacometric venues anchor the field, but core journals account for only 28% of output","US leads (665 publications, 20.8%), followed by China (394, 12.3%) and France (180, 5.6%); US also leads citations (2,871) but citation leaders also include Switzerland and Germany despite lower volume","Most cited article in the corpus: Badillo et al. 2020 (Clinical Pharmacology & Therapeutics) with 303 citations — indicating that methodological reviews dominate citation impact, not primary empirical studies","Thematic evolution from 'machine learning' + 'PK/PD' + 'prediction' (motor themes 2019–2021) to 'machine learning' + 'humans' + 'personalized medicine' + 'pharmaco-omics' (2022–2025) — confirms shift from methods to clinical translation","No ML-MIDD approach has received standalone regulatory endorsement; FDA and EMA examples (Sotorasib, Abemaciclib, Lorlatinib) show ML as adjunctive tool within conventional MIDD, not as independent decision-making methodology","Hybrid mechanistic-ML models identified as the most impactful emerging paradigm: neural surrogate within PBPK workflows (Jia et al. 2025) achieved 2-fold accuracy across 106 test drugs; VAE for joint NLME parameter estimation and covariate selection in a single run","Global AI-in-pharma market: ~$1.94 billion in 2025 → ~$16.5 billion by 2034 (CAGR ~27%) — industry adoption context for the urgency of methodological standardization","Explainable AI (SHAP, LIME, counterfactuals) increasingly required to make ML-MIDD recommendations interpretable in pharmacological terms — a precondition for regulatory review","Drug development still costly and risky: mean cost ~$515.8 million per drug; ~90% of candidates fail in clinical development — the economic stakes motivating ML-MIDD investment"],"methods_discussed":["bibliometric_analysis","systematic_review","deep_learning","reinforcement_learning","hybrid_mechanistic_ML","neural_ODE","PBPK_ML_surrogate","VAE_for_NLME","XGBoost","SHAP","LIME","VOSviewer","Bibliometrix","PRISMA","exponential_growth_modeling"],"datasets_referenced":["Web_of_Science_ML_MIDD_2015_2025","Scopus_ML_MIDD_2015_2025","PubMed_ML_MIDD_2015_2025"],"tools_software":["Bibliometrix R package v4.1.2","Biblioshiny v5.0","VOSviewer v1.6.20","R v4.5.2"],"limitations":["Database selection excludes preprints (bioRxiv, medRxiv), regulatory submissions, conference proceedings — may underrepresent industry-specific and very recent innovations","English-language restriction may omit non-English contributions; gray literature excluded","Bibliometric reliance on metadata accuracy; interdisciplinary ML-MIDD papers may be misclassified","No quantitative quality assessment of included studies — maps the landscape but cannot assess methodological rigor of individual works","Rapidly evolving field: search cutoff September 2025 means recent publications and regulatory developments not captured"],"extracted_claims":[{"text":"\"The extent to which ML methods are explicitly integrated into regulatory decision-making remains limited and unevenly characterized.\"","location":"Abstract","evidence_type":"review"},{"text":"\"If only Web of Science had been used, 37% of relevant publications would have been lost. This loss would rise to more than 60% if PubMed were used as the sole source.\"","location":"Section 3.1 (Database Overlap)","evidence_type":"empirical"},{"text":"\"The most impactful advances will likely come from coupling mechanistic models with ML surrogates or parsers, rather than treating ML as a purely black-box replacement.\"","location":"Section 4.1 (Methodological Advances and Hybrid Modeling)","evidence_type":"review"},{"text":"\"Regulatory acceptance of virtual bioequivalence relies heavily on the validation of computational models and the availability of accurate, comprehensive data inputs.\"","location":"Section 4.3 (Regulatory Context)","evidence_type":"regulatory"}],"numerical_findings":[{"metric_type":"count","description":"Publications included in the final systematic review (2015–2025) after screening 607 unique deduplicated records","value":"560","value_numeric":560,"unit":"N (publications)","comparison_baseline":"of 770 initially retrieved; 607 after deduplication","location":"Abstract; Section 3.4","is_primary_finding":true},{"metric_type":"count","description":"Unique publication sources (journals/venues) in the ML-MIDD corpus","value":"269","value_numeric":269,"unit":"N (sources)","comparison_baseline":null,"location":"Abstract","is_primary_finding":false},{"metric_type":"study_statistic","description":"Exponential growth in ML-MIDD publications 2016–2025","value":"7 (2016) to 159 (2025)","value_numeric":null,"unit":"articles/year","comparison_baseline":">22-fold increase over 9 years; conforms to Price's Law","location":"Section 3.2 (Price's Law analysis, Figure)","is_primary_finding":true},{"metric_type":"study_statistic","description":"US share of total authorship records in ML-MIDD 2015–2025","value":"20.8%","value_numeric":20.8,"unit":"% of author records","comparison_baseline":"China 12.3%, France 5.6%","location":"Section 3.2","is_primary_finding":false},{"metric_type":"study_statistic","description":"Share of ML-MIDD publications in core journals (Bradford's Law concentration)","value":"28%","value_numeric":28,"unit":"% in top 10 journals","comparison_baseline":"CPT:PSP and JPKPD each 5.1%; only 4.3% across all 3 databases","location":"Section 3.2","is_primary_finding":false},{"metric_type":"count","description":"Publications jointly indexed across all three databases (Web of Science, Scopus, PubMed) — illustrating the extreme fragmentation of the ML-MIDD literature","value":"26 (4.3%)","value_numeric":26,"unit":"N (publications)","comparison_baseline":"of 607 unique records; only 4.3% three-way overlap","location":"Section 3.1","is_primary_finding":true},{"metric_type":"count","description":"Citations for most-cited article in the ML-MIDD corpus (Badillo et al. 2020, Clin Pharmacol Ther)","value":"303","value_numeric":303,"unit":"N (global citations)","comparison_baseline":"2nd: Fan et al. 2019 (278 citations); 3rd: Greffier et al. 2020 (254 citations)","location":"Section 3.2","is_primary_finding":false},{"metric_type":"study_statistic","description":"Global AI-in-pharmaceutical market size 2025 and projected 2034 (CAGR ~27%)","value":"$1.94 billion (2025) → ~$16.5 billion (2034)","value_numeric":1940000000,"unit":"USD","comparison_baseline":"CAGR ~27%","location":"Section 1 (Introduction)","is_primary_finding":false},{"metric_type":"study_statistic","description":"Clinical development failure rate for drug candidates (context for ML-MIDD investment rationale)","value":"~90%","value_numeric":90,"unit":"% failure rate","comparison_baseline":"Mean cost per approved drug: ~$515.8 million; >10 years development time","location":"Section 1 (Introduction)","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability","optimal_control_rl","generative_ai"],"gaps_addressed":["Quantifies the ML-MIDD landscape: 560 publications, 22-fold growth — establishes why MCS WG action is urgent and well-timed","Confirms that formal regulatory ML-MIDD integration has not occurred — the exact gap the WG's credibility framework operationalization work addresses","Hybrid mechanistic-ML (neural PBPK surrogates, VAE for NLME) identified as the most impactful paradigm — directly maps to WG Pillar 1","XAI (SHAP, LIME) required for regulatory review — confirms WG Pillar 2 focus on interpretability and UQ is not optional","RL for precision dosing is a documented thematic cluster in the corpus — confirms WG Pillar 3 is a recognized and growing research space"],"topics":["bibliometric_analysis","MIDD","hybrid_mechanistic_ML","deep_learning","reinforcement_learning","PBPK","pharmacometrics","regulatory","explainable_AI","generative_AI"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-26","read_by":"claude","read_depth":"full_text","notes":"Full text retrieved via PMC (PMC13210285, PMID 42198236, DOI 10.3390/pharmaceutics18050542). Open access in Pharmaceutics (MDPI). Full text includes all sections: Introduction, Materials and Methods (database search, PRISMA, deduplication workflow), Results 3.1–3.4 (database overlap, geography/journals, thematic structure, systematic review), Discussion 4.1–4.3 (hybrid modeling, pipeline applications, regulatory context), Limitations/Future Works. PROSPERO ID: CRD420251276229. Relevance score upgraded to high after full-text read."},"title_short":"Global trends: ML with MIDD bibliometric review (Dermawan et al. 2026)"},{"id":"gerard_2025","source_type":"paper","title":"A new chapter in pharmacology: Artificial intelligence's expanding role in pharmacokinetics, pharmacodynamics, and pharmacovigilance","authors":["Gérard AO","Lombardi R","Merino D","Bouveyron C","Dellamonica J","Drici MD","Lavrut T","Destere A"],"year":2025,"doi":"10.1016/j.therap.2025.09.002","pmid":41093670,"url":null,"journal_or_venue":"Therapie","content":{"abstract_summary":"A narrative review covering AI applications in three pharmacology domains: pharmacokinetics (individualized exposure prediction, MIPD, sparse data handling via RNNs/NeuralODEs), pharmacodynamics (precision medicine, adaptive dosing, interindividual variability), and pharmacovigilance (ADR detection, safety signal identification, EHR analysis). Also addresses pharmacology education. Uses the ARTIREV hybrid bibliometric tool. Emphasizes the 'black box' explainability problem and absent external validation as principal barriers to safe clinical deployment.","key_findings":["AI/ML significantly improves individualized PK prediction and supports MIPD, especially for sparse, irregular clinical data","RNNs and NeuralODEs are the primary architectures bridging mechanistic PK/PD modeling and ML for handling irregular clinical pharmacokinetic data","AI enables adaptive dosing regimens tailored to individual patient constraints; models for interindividual variability in PD are now feasible","AI enhances pharmacovigilance: automated ADR detection, safety signal identification at population level, and analysis of unstructured EHR data","Critical barriers: training data quality, 'black box' explainability, and lack of external validation are preventing safe clinical deployment of AI in pharmacology"],"methods_discussed":["machine_learning","hybrid_mechanistic_ML","neural_ODE","LSTM","recurrent_neural_network","MIPD","natural_language_processing","bibliometric_analysis"],"datasets_referenced":["electronic_health_records"],"tools_software":[],"limitations":["Only abstract read; specific studies cited, quantitative benchmarks, and ARTIREV search methodology not reviewed","Narrative (non-systematic) review using a proprietary bibliometric tool (ARTIREV); selection bias possible","Published in Therapie (French pharmacology journal); may emphasize European clinical practice context"],"extracted_claims":[{"text":"\"In PK, machine learning and hybrid approaches improve the prediction of individualized drug exposure, support model-informed precision dosing and handle irregular and sparse data through architectures such as recurrent neural networks and NeuralODEs.\"","location":"Abstract","evidence_type":"review"},{"text":"\"Despite their potential, AI models face several significant limitations. These include the quality of training data, limited explainability due to the 'black box' effect and a lack of external validation of the models developed.\"","location":"Abstract","evidence_type":"review"},{"text":"\"This review emphasizes the role of AI in pharmacology and the necessity of training future professionals to ensure the safe and validated use of AI in personalized medical applications.\"","location":"Abstract — Conclusions","evidence_type":"opinion"}],"numerical_findings":[]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Confirms the 'black box' explainability gap for AI/ML in clinical pharmacology — directly supports Pillar 2 (UQ/identifiability) need for principled uncertainty quantification","Documents that NeuralODEs and RNNs are the main architectures bridging mechanistic PK/PD and ML, consistent with Pillar 1 scope"],"topics":["pharmacokinetics","pharmacodynamics","pharmacovigilance","MIPD","neural_ODE","explainable_AI","ADR_detection","precision_dosing"],"relevance_score":"medium"},"relationships":{"cites":[],"cited_by":["aiml_claude_background"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-26","read_by":"claude","read_depth":"abstract_only","notes":"Retrieved via PubMed search (PMID 41093670). Not open access — Elsevier paywall (Therapie). Full text not read. No quantitative findings reported in abstract."},"title_short":"AI in PK/PD/pharmacovigilance review (Gérard et al. 2025)"},{"id":"de_carlo_2025","source_type":"paper","title":"Precision Dosing in Presence of Multiobjective Therapies by Integrating Reinforcement Learning and PK-PD Models: Application to Givinostat Treatment of Polycythemia Vera","authors":["De Carlo A","Tosca EM","Magni P"],"year":2025,"doi":"10.1002/psp4.70012","pmid":40325832,"url":null,"journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Applies Q-learning (QL) integrated with a population PK-PD model to the multiobjective adaptive dosing problem for givinostat (HDAC inhibitor) in polycythemia vera (PV). PV treatment must simultaneously normalize three hematological parameters (PLT, WBC, HCT) as both efficacy and toxicity endpoints. The MDP state space is 487 states; 7 dose levels (50–200 mg/day) are the actions. Two QL approaches: QL-agent (one agent trained on a population of 98 virtual patients) and QL-agents (one personal agent per patient). QL-agent achieves similar CHR to the clinical protocol (77% vs. 83%) with slightly worse safety. QL-agents outperform both: 93% CHR, 0% severe toxicities, median time to stable CHR 47 days vs. 99–105 days for comparators. Limitation: validated only in-silico; RUV excluded; individual PK-PD parameters assumed fully known.","key_findings":["The givinostat adaptive dosing problem is formalized as an MDP with 487 states (PLT×WBC×HCT categories + previous dose + interruption flags), 7 dose-level actions, and a manually designed multi-term reward function balancing three simultaneous endpoints","Population-level QL-agent (trained on 98 virtual patients, evaluated on 10 test sets of 98 patients): 77% CHR vs. 83% for the clinical Phase III protocol — statistically similar efficacy but higher severe toxicity rate (40.30% vs. 14.28%)","The QL-agent notably learned the same dose-maintenance rule as the clinical protocol when parameters are in the efficacy range — a nontrivial validation of the RL framework's ability to rediscover clinical knowledge from scratch","Personal QL-agents (one per patient, trained on patient-specific PK-PD model simulations): 93% CHR vs. 79% (population QL-agent) vs. 75% (clinical protocol); median time to stable CHR 47 days vs. 99–105 days; 0% severe toxicities","Computational cost: training 98 personal QL-agents + 1 population agent simultaneously took 26 and 52 days respectively on an 8-core i7 Linux machine (3.6 GHz) using NONMEM 7.3.0 + MATLAB — a practical barrier to clinical translation","Key unresolved limitation: residual unexplained variability (RUV) was not simulated; adding RUV may require switching from tabular QL to stochastic RL variants or POMDP formulations","The study provides one of the first RL applications to a true multiobjective precision dosing problem with 3 simultaneous biomarkers — a more realistic oncology scenario than prior single-biomarker work"],"methods_discussed":["reinforcement_learning","Q_learning","Markov_decision_process","PK_PD_modeling","population_PK_PD","hybrid_mechanistic_ML","precision_dosing","virtual_population_simulation","NONMEM"],"datasets_referenced":["virtual_population_givinostat_PV_98_patients"],"tools_software":["NONMEM 7.3.0","MATLAB"],"limitations":["Residual unexplained variability (RUV) excluded from simulations — deterministic PK-PD assumed; RUV introduction may require switching from tabular QL to stochastic RL or POMDP","Individual PK-PD parameters assumed fully known from treatment start — in practice, Bayesian estimation would be needed to progressively update individual parameters","Not validated on real clinical data; all results are in-silico based on a published givinostat population PK-PD model","Computational time (26–52 days) is impractical for real-time clinical deployment; efficient implementation on high-performance computing is needed","State space (487 states) and reward function are manually designed and specific to givinostat clinical context — generalizability to other drugs/biomarkers not demonstrated"],"extracted_claims":[{"text":"\"QL-agent learned a general adaptive dosing protocol that achieved a similar CHR rate (77% vs. 83%) when compared to the actual givinostat clinical protocol on 10 simulated populations.\"","location":"Abstract","evidence_type":"empirical"},{"text":"\"These QL-based patient-specific adaptive dosing rules outperformed both the clinical protocol and QL-agent by reaching the CHR in 93% of the test patients and completely avoided severe toxicities during the whole treatment period.\"","location":"Abstract","evidence_type":"empirical"},{"text":"\"The QL-agent estimated the same dosing rules of the clinical protocol for all patient efficacy status (i.e., maintaining the current dose level) — a confirmation of the powerfulness of RL algorithms that are able to learn from scratch a set of reasonable rules close to those formulated on the basis of the clinical knowledge.\"","location":"Section 3.1 / Discussion","evidence_type":"empirical"},{"text":"\"Defining a clinical trial setup that meets current regulatory standards to evaluate model-informed RL approaches for precision dosing remains one of the most important and challenging open issues.\"","location":"Section 4 Discussion (Limitations)","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"performance_metric","description":"Population-level QL-agent (QL-pop) CHR rate for givinostat, evaluated on 10 external test sets of 98 virtual PV patients","value":"77%","value_numeric":77,"unit":"%","comparison_baseline":"vs. givinostat Phase III clinical protocol (83%)","location":"Abstract; Table 2","is_primary_finding":true},{"metric_type":"performance_metric","description":"Givinostat Phase III clinical protocol CHR rate (benchmark for population QL-agent comparison)","value":"83%","value_numeric":83,"unit":"%","comparison_baseline":null,"location":"Abstract; Table 2","is_primary_finding":false},{"metric_type":"performance_metric","description":"Personalized QL-agents (QL-ind) CHR rate on 98 virtual PV patients","value":"93%","value_numeric":93,"unit":"%","comparison_baseline":"vs. population QL-agent (79%) and clinical protocol (75%) on same 98 patients","location":"Abstract; Table 3","is_primary_finding":true},{"metric_type":"effect_size","description":"Severe toxicity rate with personalized QL-agents over full treatment period","value":"0%","value_numeric":0,"unit":"%","comparison_baseline":"vs. clinical protocol (12.24%) and population QL-agent (43.88%)","location":"Abstract; Table 3","is_primary_finding":true},{"metric_type":"study_statistic","description":"Median days until stable complete hematological response: personalized QL-agents vs. population QL-agent vs. clinical protocol","value":"47 vs. 99 vs. 105","value_numeric":47,"unit":"days (median)","comparison_baseline":"vs. population QL-agent (99 days) and clinical protocol (105 days)","location":"Table 3","is_primary_finding":true},{"metric_type":"study_statistic","description":"Virtual patient population size for each training and test set","value":"98","value_numeric":98,"unit":"N (virtual patients)","comparison_baseline":null,"location":"Section 2.4","is_primary_finding":false},{"metric_type":"count","description":"MDP state space size for the givinostat precision dosing problem","value":"487","value_numeric":487,"unit":"N (states)","comparison_baseline":null,"location":"Section 2.2.2","is_primary_finding":false},{"metric_type":"computational_metric","description":"Simultaneous training time for 98 personal QL-agents on Linux (8 i7 Intel cores, 3.6 GHz)","value":"26 days","value_numeric":26,"unit":"days","comparison_baseline":"population QL-agent took 52 days","location":"Section 4 Discussion","is_primary_finding":false}]},"relevance":{"pillars":["optimal_control_rl","hybrid_foundations"],"gaps_addressed":["Most complete current proof-of-concept of RL+PK-PD for precision dosing — the computational cost (26–52 days) quantifies the MCS WG's Pillar 3 target: efficient RL implementations using surrogate models or faster simulation engines","The manually designed 3-endpoint reward function and 487-state MDP are exactly where MCS's mathematical expertise (optimal control theory, MDP theory, Lyapunov-based reward design) can add rigor beyond current empirical approaches"],"topics":["reinforcement_learning","precision_dosing","pharmacokinetics","pharmacodynamics","polycythemia_vera","givinostat","hematology","adaptive_dosing","Markov_decision_process"],"relevance_score":"high"},"relationships":{"cites":["ribba_2023","de_carlo_2024"],"cited_by":[],"extends":["de_carlo_2024"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-26","read_by":"claude","read_depth":"full_text","notes":"Full text retrieved via PMC (PMC12167923, PMID 40325832, DOI 10.1002/psp4.70012). Open access in CPT: Pharmacometrics & Systems Pharmacology. Full text includes Methods (MDP formulation, reward function, state/action design), Results (Tables 2 & 3 with complete metrics), Discussion (limitations including RUV, computational cost, clinical validation gap). Authors: De Carlo A (A.D.C.), Tosca EM (E.M.T.), Magni P (P.M.) — 3 authors."},"title_short":"RL + PK-PD precision dosing: givinostat (De Carlo et al. 2025)"},{"id":"de_carlo_2024","source_type":"paper","title":"Reinforcement Learning and PK-PD Models Integration to Personalize the Adaptive Dosing Protocol of Erdafitinib in Patients With Metastatic Urothelial Carcinoma","authors":["De Carlo A","Tosca EM","Fantozzi M","Magni P"],"year":2024,"doi":"10.1002/cpt.3176","pmid":38339803,"url":null,"journal_or_venue":"Clinical Pharmacology and Therapeutics","content":{"abstract_summary":"Introduces and evaluates a Q-learning (QL) + PK-PD framework for individual-level personalization of the erdafitinib adaptive dosing protocol in metastatic urothelial carcinoma. Erdafitinib is an FDA-approved FGFR inhibitor whose dosing is guided by serum phosphate [PO4]serum — a dual biomarker of efficacy (≥5.5 mg/dL) and toxicity (<7 mg/dL). The MDP is formulated with 86 states (L_PO4 × D_P × L_int), 5 dose levels (4, 5, 6, 8, 9 mg/day), and a manually designed reward function. A personal QL agent is trained for each of 141 virtual patients (96 completely + 45 partially responsive) using the patient's PK-PD model as a digital twin. QL-agents outperform the FDA-approved protocol at every clinical timepoint, achieving 97.87% vs. 70.21% in the efficacy range at month 4, and completely eliminating severe hyperphosphatemia events. The companion paper de_carlo_2025 extends this framework to a 3-biomarker multiobjective dosing problem.","key_findings":["The erdafitinib case study is formalized as an MDP with 86 states (combining [PO4]serum discretized in 6 levels, previous dose, and hyperphosphatemia interruption flag), 5 dose levels as actions, and a piecewise reward function (β1=10 for biomarker level, β2=5 for % of days in target range)","At 2 weeks: QL agents had 76.59% of patients in efficacy range vs. 34.05% for clinical protocol; 0% vs. 15.60% in severe hyperphosphatemia — largest relative gap across all timepoints","At end of month 4 (median time for assessing erdafitinib efficacy): QL 97.87% vs. clinical 70.21% in efficacy range; severe hyperphosphatemia: 0% vs. 0% (both)","At end of treatment (5 months): QL 68.09% vs. clinical 56.73% in efficacy (all patients); in completely responsive subgroup: QL 100% vs. clinical 83.33%","Severe hyperphosphatemia completely eliminated by QL agents throughout the full 5-month treatment; moderate hyperphosphatemia drastically reduced","Personalization of the starting dose is key: QL agents chose the clinical starting dose of 8 mg/day in only 23.40% of patients — lower starting doses were preferred in most patients to avoid early toxicity","Population QL (one-for-all agent trained on all 141 patients) performed worse than personalized QL agents — confirms that individual-level optimization is necessary for heterogeneous populations","Completely and partially responsive patients (96 vs. 45) behave differently — the stratified virtual population design is essential to test framework flexibility across IIV"],"methods_discussed":["reinforcement_learning","Q_learning","Markov_decision_process","population_PK_PD_modeling","digital_patient_twin","precision_dosing","virtual_population_simulation","Bayesian_estimation"],"datasets_referenced":["virtual_population_erdafitinib_urothelial_carcinoma_141_patients"],"tools_software":["R v3.4.1","RsSimulx (Simulx 2021R1, Lixoft SAS)"],"limitations":["RUV not considered — assumes PK-PD model perfectly describes pharmacological response; adding RUV may require switching from MDP to POMDP or from QL to stochastic RL variants","Individual PK-PD parameters assumed fully known from treatment start — in practice, Bayesian online learning must progressively estimate these from monitoring observations","Only validated on virtual patients derived from a published PopPK-PD model — no real-world clinical data","Reward function and action set designed by modelers based on literature knowledge; reward function design should be reviewed with clinicians before clinical translation","A completely different action set or freedom level could change results — the arbitrary design choices in MDP formulation are a key limitation of all RL dosing frameworks"],"extracted_claims":[{"text":"\"QL agents outperform the approved dose-adaptive rules, increasing more than 10% the efficacy and the safety of treatment at each end point.\"","location":"Abstract","evidence_type":"empirical"},{"text":"\"At each of the three timepoints, the QL-based individual protocols resulted in a higher percentage of patients with [PO4]serum in the efficacy range and in a lower percentage of subjects in hyperphosphatemia then the clinical one.\"","location":"Results","evidence_type":"empirical"},{"text":"\"The personalization of the initial dose significantly increased QL-agent performances. As reported in Figure 4e, the clinical initial dose of 8mg/day was selected by the QL-agents only in 23.40% of patients, whereas the lower starting doses were generally preferred.\"","location":"Results","evidence_type":"empirical"},{"text":"\"In view of an actual clinical application, the design of the reward function, as well as the entire formalization of the proposed RL-framework, should be carefully reviewed with clinicians to ensure that all the key aspects of the erdafitinib treatment are correctly considered and modeled.\"","location":"Discussion","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Size and composition of the virtual patient population used for evaluation","value":"141 (96 completely responsive + 45 partially responsive)","value_numeric":141,"unit":"N (virtual patients)","comparison_baseline":null,"location":"Methods: Evaluation; Results","is_primary_finding":false},{"metric_type":"count","description":"Total MDP states for the erdafitinib precision dosing problem (L_PO4 × D_P × L_int combinations, with infeasible states removed)","value":"86","value_numeric":86,"unit":"N (states)","comparison_baseline":null,"location":"Methods: System States","is_primary_finding":false},{"metric_type":"performance_metric","description":"% patients in efficacy range [5.5, 7 mg/dL] at 2 weeks: QL-agents vs. FDA clinical protocol","value":"76.59% vs. 34.05%","value_numeric":76.59,"unit":"% of patients","comparison_baseline":"vs. FDA clinical protocol (34.05%)","location":"Table 2 (evaluation at 2nd week)","is_primary_finding":true},{"metric_type":"performance_metric","description":"% patients in severe hyperphosphatemia (>9 mg/dL) at 2 weeks: QL-agents vs. clinical protocol","value":"0% vs. 15.60%","value_numeric":0,"unit":"% of patients","comparison_baseline":"vs. FDA clinical protocol (15.60%)","location":"Table 2 (evaluation at 2nd week)","is_primary_finding":true},{"metric_type":"performance_metric","description":"% patients in efficacy range at end of month 4 (median time for assessing erdafitinib efficacy): QL-agents vs. clinical","value":"97.87% vs. 70.21%","value_numeric":97.87,"unit":"% of patients","comparison_baseline":"vs. FDA clinical protocol (70.21%)","location":"Table 2 (evaluation at end of month 4)","is_primary_finding":true},{"metric_type":"performance_metric","description":"% completely responsive patients in efficacy range at end of treatment (5 months): QL-agents vs. clinical","value":"100% vs. 83.33%","value_numeric":100,"unit":"% of completely responsive patients","comparison_baseline":"vs. FDA clinical protocol (83.33%), n=96 completely responsive","location":"Table 2 (evaluation at end of treatment, subgroup)","is_primary_finding":true},{"metric_type":"study_statistic","description":"% of QL-agents that selected the clinical starting dose of 8 mg/day — key evidence for value of personalized initial dosing","value":"23.40%","value_numeric":23.4,"unit":"% of QL-agents","comparison_baseline":"clinical protocol always starts at 8 mg/day (100%)","location":"Results (Figure 4e)","is_primary_finding":false}]},"relevance":{"pillars":["optimal_control_rl","hybrid_foundations"],"gaps_addressed":["Provides the first complete MDP formulation for a real FDA-approved oncology dose-adaptive protocol (erdafitinib) — establishes the state/action/reward design methodology that de_carlo_2025 then extends to 3 biomarkers","The 86-state MDP, reward function (piecewise, two-term), and digital patient twin paradigm are the technical building blocks the WG needs to critically analyze and improve with mathematical rigor (Pillar 3)","The 23.40% adoption of clinical starting dose is a striking empirical result that validates individual-level optimization — directly motivates the WG's position on RL vs. one-size-fits-all protocols"],"topics":["reinforcement_learning","Q_learning","precision_dosing","pharmacokinetics","pharmacodynamics","urothelial_carcinoma","erdafitinib","adaptive_dosing","digital_patient_twin","Markov_decision_process","FDA"],"relevance_score":"high"},"relationships":{"cites":["ribba_2023"],"cited_by":["de_carlo_2025","irie_2025","tosca_2024"],"extends":["ribba_2023"],"contradicts":[]},"provenance":{"how_obtained":"provided_by_user","date_read":"2026-08-26","read_by":"claude","read_depth":"full_text","notes":"PDF provided by user (file: aiml_wg/background/Clin Pharma and Therapeutics - 2024 - De Carlo - Reinforcement Learning and PK-PD Models Integration to Personalize the.pdf). Full text read: Introduction, Methods (RL formalism, MDP equations, reward function Eqs. 3-5, state design Eqs. 6-8, action Table 1, implementation, evaluation), Results (Table 2, Figures 4-5), Discussion (limitations: RUV, known parameters, need for Bayesian online learning), References (50 refs). Open access (CC BY-NC-ND). 4 authors: De Carlo A, Tosca EM, Fantozzi M, Magni P — all University of Pavia. Fantozzi M contributed to design, research execution, and data analysis."},"title_short":"RL + PK-PD: erdafitinib (De Carlo et al. 2024)"},{"id":"ribba_2023","source_type":"paper","title":"Reinforcement Learning as an Innovative Model-Based Approach: Examples from Precision Dosing, Digital Health and Computational Psychiatry","authors":["Ribba B"],"year":2023,"doi":"10.3389/fphar.2022.1094281","pmid":36873047,"url":null,"journal_or_venue":"Frontiers in Pharmacology","content":{"abstract_summary":"A single-author perspective from a Roche scientist positioning RL as a natural extension of the model-based pharmacometrician's toolkit across three domains: (1) precision dosing of pharmacological drugs (propofol anesthesia as the case study — Q-learning on a 16M+ solution space at 5-second intervals), (2) digital health (HeartSteps JITAI app using Thompson Sampling to personalize walking suggestions), and (3) computational psychiatry (RL as a mechanistic model of aberrant reward learning in anhedonia/depression). The unifying thread: RL solves sequential decision-making problems as MDP optimization, and pharmacometrics provides both the environment dynamics (PK-PD model) and the scientific framing (response variability, individual-level inference).","key_findings":["RL is formally at the crossroads of two fields: learning by trial-and-error (behavioral psychology) and optimal control — a framing that positions it as a generalization of, not a departure from, classical pharmacometric optimal control","Advantage over classical precision dosing: RL handles high-dimensional PK/PD marker spaces while classical model-based approaches are limited to a small number of variables (typically one plasma concentration + one endpoint)","Propofol anesthesia case study: Q-learning algorithm, dosing every 5 seconds over 2 minutes → solution space exceeds 16 million possibilities — makes heuristic search impractical, motivating RL","Digital health (HeartSteps JITAI): RL (Thompson Sampling) used to personalize timing and content of walking suggestion messages; simulation engine built from linear models on retrospective data rather than a PK-PD model — illustrates RL without a mechanistic model","Computational psychiatry: RL is not an optimization tool but a mechanistic model of brain computation — Q-learning parameters (learning rate, reward sensitivity) are estimated from trial-by-trial cognitive task data and correlated with clinical symptom severity","Anhedonia finding: reward sensitivity negatively correlated with anhedonic depression score; learning rate not correlated — suggesting that sensitivity to reward, not learning speed, is the key driver of anhedonic behavior","Micro-randomized trial (MRT) design cited as the correct experimental framework for evaluating personalized JITAI interventions — a potential methodological contribution from the RL/digital health intersection to clinical trial design","All RL applications described are in-silico or retrospective — the paper explicitly calls for the PMX community to provide statistical population inference tools to computational psychiatry and digital health"],"methods_discussed":["reinforcement_learning","Q_learning","temporal_difference_learning","Markov_decision_process","Thompson_sampling","JITAI","micro_randomized_trial","model_based_pharmacometrics","precision_dosing","digital_health","computational_psychiatry","Bayesian_estimation"],"datasets_referenced":["HeartSteps_physical_activity","propofol_theoretical_PKPD"],"tools_software":[],"limitations":["Perspective/opinion piece — no new empirical data; all RL examples are illustrative case studies from published literature","The propofol and computational psychiatry examples are theoretical or based on retrospective analysis — no prospective clinical validation reported","Does not formally analyze the mathematical relationship between RL and classical optimal control (Pontryagin's minimum principle, Hamilton-Jacobi-Bellman equations) — this connection is asserted but not derived"],"extracted_claims":[{"text":"\"RL is at the crossroads between two scientific fields. First, the field of learning by trial and error that started with the study of the psychology of animal learning and second, the field of optimal control.\"","location":"Section 1 (Precision Dosing)","evidence_type":"review"},{"text":"\"RL presents several advantages [over classical PMX precision dosing]. First, the possibility to take into account high dimensional PKPD variables while classical model-based approaches are often limited to a low number of variables (plasma concentration and one endpoint).\"","location":"Section 1 (Precision Dosing)","evidence_type":"opinion"},{"text":"\"In our example on propofol, dosing could happen every 5 s so over a short period of 2 min, the space of solutions to explore when considering dichotomous dosing even is greater than 16 million possibilities.\"","location":"Section 1 (Precision Dosing)","evidence_type":"empirical"},{"text":"\"The field of digital health should benefit from what constitutes one of the essential objectives of model-based drug development approaches, namely: elucidating response variability.\"","location":"Section 4 (Conclusion)","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"count","description":"Solution space for dichotomous propofol dosing at 5-second intervals over 2 minutes — motivating RL over heuristic approaches","value":">16 million","value_numeric":16000000,"unit":"N (possible dosing sequences)","comparison_baseline":null,"location":"Section 1 (Precision Dosing)","is_primary_finding":true},{"metric_type":"study_statistic","description":"Estimated share of coronary heart disease burden attributable to physical inactivity (context for HeartSteps digital health JITAI)","value":"6%","value_numeric":6,"unit":"% of burden","comparison_baseline":"vs. 7% type II diabetes, 10% breast cancer, 10% colon cancer (same cause)","location":"Section 2 (Digital Health)","is_primary_finding":false},{"metric_type":"effect_size","description":"Estimated deaths averted annually with 25% reduction in global physical inactivity","value":"1.3 million","value_numeric":1300000,"unit":"N (deaths/year)","comparison_baseline":"of 57 million global deaths that year (2008 dataset)","location":"Section 2 (Digital Health)","is_primary_finding":false}]},"relevance":{"pillars":["optimal_control_rl"],"gaps_addressed":["Provides the essential conceptual bridge: RL is formally at the intersection of trial-and-error learning and optimal control — the WG's Pillar 3 task is to operationalize this connection with mathematical rigor (MDP theory, Bellman equations, convergence guarantees)","The propofol 16M+ solution space example directly motivates why classical optimal control fails for high-frequency adaptive dosing — a concrete argument for RL","Digital health (JITAI) and computational psychiatry extensions broaden Pillar 3 scope: RL is not just a dosing optimizer but a mechanistic model of adaptive sequential decision-making in biological systems"],"topics":["reinforcement_learning","optimal_control","precision_dosing","digital_health","JITAI","computational_psychiatry","pharmacometrics","model_based_approaches","Markov_decision_process"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["de_carlo_2024","de_carlo_2025"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-26","read_by":"claude","read_depth":"full_text","notes":"Full text retrieved via PMC (PMC9981647, PMID 36873047, DOI 10.3389/fphar.2022.1094281). Open access in Frontiers in Pharmacology. DOI year /fphar.2022/ = submitted 2022, published February 2023. Single-author perspective by Bernard Ribba (Roche). Full text covers 4 sections plus appendix (RL demystified via video gaming analogy). Three use cases detailed with Table 1 summarizing state/action/reward/algorithm for each domain."},"title_short":"RL as innovative model-based approach: dosing, digital health (Ribba 2023)"},{"id":"aiml_sig_page2026","source_type":"web","title":"AI/ML in Pharmacometrics: Hands-On Workshop and Regulatory Panel (PAGE 2026 Satellite)","authors":[],"year":2026,"doi":null,"pmid":null,"url":"https://aiml-sig.github.io/2026-page-workshop/","journal_or_venue":"PAGE 2026 (Population Approach Group Europe, Dubrovnik, Croatia)","content":{"abstract_summary":"A satellite workshop organized by the ISoP AI/ML SIG at PAGE 2026 (Dubrovnik, June 2, 2026). Full-day hands-on program covering GenAI coding assistants (GitHub Copilot), neural ODEs in Julia, ML covariate selection in R (XGBoost, SHAP, UMAP), and a regulatory/industry panel (FDA, EMA). Targets practitioners with basic R/Julia skills. Positions the AI/ML SIG as the practical education hub for AI in pharmacometrics.","key_findings":["The ISoP AI/ML SIG actively provides practical AI/ML education for pharmacometrics — a role MCS must not duplicate but can complement with mathematical depth","Workshop topics are explicitly practical and implementation-focused: GitHub Copilot for coding, XGBoost/SHAP for covariate analysis, NeuralODEs for model fitting","A regulatory/industry panel with FDA and EMA representatives confirms AI in pharmacometrics is now a live regulatory concern, not just a research topic","SHAP values are positioned as the primary XAI tool — consistent with the WG's need to critically evaluate SHAP limitations and address them more rigorously","GenAI coding assistants (GitHub Copilot) are highlighted as a distinct educational topic — the AI/ML SIG is claiming this space; MCS should not compete here"],"methods_discussed":["neural_ODE","XGBoost","SHAP","UMAP","LLM","GenAI_coding_assistant"],"datasets_referenced":[],"tools_software":["GitHub Copilot","Julia","R","xgboost"],"limitations":["Workshop agenda and overview only — no research outcomes, benchmark results, or methodological depth documented","Single-day program; depth of coverage on each topic is limited by time"],"extracted_claims":[{"text":"The workshop covers \"GenAI coding assistants (GitHub Copilot demonstrations)\" and \"deep compartment models and neural ODEs in Julia\" — positioning the ISoP AI/ML SIG firmly in practical education rather than mathematical foundations.","location":"Agenda section","evidence_type":"opinion"},{"text":"Workshop frames AI/ML as \"rapidly transforming pharmacometrics\" by offering \"new tools for model development, covariate selection, and data analysis.\"","location":"Workshop overview","evidence_type":"opinion"}],"numerical_findings":[]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability","generative_ai"],"gaps_addressed":["Confirms the ISoP AI/ML SIG's positioning as the practical education provider — the MCS WG must differentiate by providing mathematical rigor, not duplicating this workshop content","Shows NeuralODEs and SHAP are now mainstream enough for workshop education — MCS should engage at the foundational/limitations level, not the introductory level"],"topics":["AI_ML_SIG","education","neural_ODE","explainable_AI","regulatory","GenAI_tools","pharmacometrics","PAGE_conference"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"web_fetch","date_read":"2026-08-26","read_by":"claude","read_depth":"full_text","notes":"Fetched from https://aiml-sig.github.io/2026-page-workshop/. Key strategic source for understanding what the ISoP AI/ML SIG (launched Dec 2023) is doing educationally — directly informs MCS WG differentiation strategy."},"title_short":"ISoP AI/ML SIG PAGE 2026 workshop"},{"id":"fda_ai_guidance_2025","source_type":"report","title":"Considerations for the Use of Artificial Intelligence to Support Regulatory Decision-Making for Drug and Biological Products","authors":[],"year":2025,"doi":null,"pmid":null,"url":"https://www.fda.gov/media/184830/download","journal_or_venue":"U.S. Food and Drug Administration (FDA)","content":{"abstract_summary":"FDA draft guidance (January 2025, docket 59502407dft) providing a 7-step risk-based credibility assessment framework for AI models used to produce data or information supporting regulatory decision-making for drug and biological products. Issued jointly by CDER, CBER, CDRH, CVM, OCE, OCP, and OII. The framework centers on two constructs: the Context of Use (COU) — the specific role and scope of the AI model — and model risk, defined as the joint product of model influence (how much the AI model drives the decision relative to other evidence) and decision consequence (severity of an adverse outcome from an incorrect decision). Credibility evidence requirements must be commensurate with model risk. The guidance explicitly excludes drug discovery and internal operational efficiencies that do not affect patient safety, drug quality, or study reliability. Life cycle maintenance of AI model credibility is required where model performance may change over time.","key_findings":["The guidance establishes a 7-step credibility assessment framework: (1) Define the question of interest, (2) Define the COU, (3) Assess model risk, (4) Develop a credibility assessment plan, (5) Execute the plan, (6) Document results and deviations, (7) Determine adequacy of the AI model for the COU","Model risk
