mens. From the Karniadakis group at Brown University — the leading academic group in physics-informed ML for scientific computing.","key_findings":["CMINNs integrate fractional calculus (anomalous diffusion, drug trapping/escape in heterogeneous tissues) with compartmental PK/PD models using PINNs — extends standard integer-order compartmental models to capture non-Fickian diffusion phenomena","Achieves modeling of drug resistance, persistence, tolerance, and absorption anomalies within a system of just 2 (fractional) ODEs — demonstrates that physics-constrained neural approaches can uncover dynamics inaccessible to standard compartmental forms","Time-varying parameters (piecewise constant or continuous) are learned by the neural network, enabling adaptation to changing patient physiology during treatment","Multi-dose administration modeled explicitly — relevant to oncology protocols (doxorubicin) where dose-response history affects cell death dynamics","Karniadakis group (Brown/NIH) involvement signals connection to the broader SciML ecosystem and potential for tool integration"],"methods_discussed":["physics_informed_neural_networks","fractional_PINNs","fractional_calculus","compartmental_model","pharmacokinetics","pharmacodynamics","anomalous_diffusion","multi_dose_modeling","time_varying_parameters"],"datasets_referenced":["doxorubicin_cancer_pharmacodynamics_multi_dose"],"tools_software":[],"limitations":["Demonstrated on synthetic/simulated cancer PD data — clinical validation on real patient data is not presented","Fractional differential equations are computationally more expensive than integer ODEs and have less established estimation theory in pharmacometrics","Identifiability of fractional order parameter and neural components is not addressed — adding fractional calculus increases the identifiability challenge beyond standard hybrid models"],"extracted_claims":[{"text":"CMINNs uncover different drug-effect dynamics, providing new insights into absorption rates, anomalous diffusion, drug resistance, persistence, and pharmacokinetic tolerance, all within a system of just two (fractional) ODEs with explainable results.","location":"Abstract / Results","evidence_type":"empirical"}],"numerical_findings":[]},"relevance":{"pillars":["hybrid_foundations","generative_ai"],"gaps_addressed":["Fills the PINN-based hybrid category in M1.1 architecture taxonomy — CMINNs represent the physics-informed approach (constraints from known ODE structure) rather than the data-driven neural ODE approach, giving a third architectural option alongside serial and embedded hybrids","The fractional calculus extension is directly relevant to M4.1 — physics-constrained generative models where the physics constraint is a fractional ODE rather than an integer ODE; this is an underexplored area the WG could carve out"],"topics":["compartment_model_informed_neural_networks","physics_informed_neural_networks","fractional_calculus","pharmacokinetics","pharmacodynamics","doxorubicin","cancer","Karniadakis_group","Brown_University","SciML"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'physics-informed neural network drug pharmacology' (PMID 39608036). Computers in Biology and Medicine 2024, 184:109392. Brown University (Karniadakis G = corresponding, george_karniadakis@brown.edu). NIH-funded (R01). Note: this is a Research Support, N.I.H., Extramural paper. Upgrade to full_text recommended if the WG pursues fractional PDE extensions as part of M4.1 scope."},"title_short":"CMINNs: compartment model informed neural networks with fractional calculus (Karniadakis group, 2024)"},{"id":"chhetri_2026","source_type":"paper","title":"CBINN: Cancer Biology-Informed Neural Network for Unknown Parameter Estimation and Missing Physics Identification","authors":["Chhetri B","Kumar BVR"],"year":2026,"doi":"10.1007/s11538-026-01698-0","pmid":42365212,"url":null,"journal_or_venue":"Bulletin of Mathematical Biology","content":{"abstract_summary":"Develops CBINN (Cancer Biology-Informed Neural Network) for simultaneous unknown parameter estimation and missing physics identification in tumor-immune ODE systems — the 'gray-box identification' problem where partial mechanistic structure is known but some ODE terms or parameters are missing. Addresses both (i) accurate parameter estimation and (ii) discovery of missing mathematical equations governing biological systems. Validates on three nonlinear compartmental tumor-immune models. Explicitly discusses structural and practical identifiability using computational and Fisher Information Matrix-based analysis. IIT Kanpur, 2026.","key_findings":["Addresses the gray-box identification problem: given partial ODE structure + data, simultaneously estimate unknown parameters AND discover missing ODE terms — directly relevant to M1.1 (hybrid architectures with partially known structure)","Structural and practical identifiability are explicitly analyzed using computational methods and Fisher Information Matrix — makes this one of the few PINN papers that directly addresses identifiability of the neural components","Validated on three distinct nonlinear compartmental tumor-immune models with multiple synthetic noise levels — demonstrates robustness of CBINN across different model structures","The three benchmark models represent dynamic patterns in compartmental tumor-immune interaction — relevant to pharmacodynamics of immunotherapy drugs"],"methods_discussed":["physics_informed_neural_networks","Fisher_Information_Matrix","structural_identifiability","practical_identifiability","gray_box_identification","missing_physics_discovery","tumor_immune_dynamics","ODE_parameter_estimation"],"datasets_referenced":["synthetic_tumor_immune_model_1","synthetic_tumor_immune_model_2","synthetic_tumor_immune_model_3"],"tools_software":[],"limitations":["Validated only on synthetic data — real clinical tumor-immune data not used","Tumor-immune models are more QSP-scale than standard pharmacometric (NLME) scale — direct translation to population PK/PD requires adaptation","Fisher Information Matrix-based identifiability is an approximation (assumes local quadratic likelihood) — for highly nonlinear neural components, this may underestimate uncertainty"],"extracted_claims":[{"text":"Structural and practical identifiability of the model parameters are also discussed using computational and Fisher information matrix based analysis.","location":"Abstract","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"count","description":"Number of distinct tumor-immune compartmental models tested","value":"3","value_numeric":3,"unit":"N (models)","comparison_baseline":null,"location":"Abstract / Methods","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Directly addresses M1.2 (structural identifiability of neural ODE/PINN components) — one of the few papers that explicitly applies FIM-based identifiability analysis to biology-informed neural networks rather than treating identifiability as a post-hoc concern","The gray-box identification framing (partial known structure + missing terms) is the most accurate description of the scientific problem in hybrid pharmacometric models — a key framing the WG should adopt in the scoping paper"],"topics":["cancer_biology_informed_neural_networks","physics_informed_neural_networks","structural_identifiability","practical_identifiability","Fisher_Information_Matrix","tumor_immune_dynamics","gray_box_identification","IIT_Kanpur"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'structural identifiability neural ordinary differential equations dynamical systems' (PMID 42365212). Bull Math Biol 2026, 88(7). IIT Kanpur (Chhetri B, Kumar BVR = kumarrathish0123@gmail.com). Published June 2026. Note: cites campo_manzanares_2026 tentatively — need to verify if arXiv 2608.13044 was submitted before this paper's final revision date (June 27, 2026) to confirm the citation; it was submitted Aug 13, 2026, so unlikely to be cited. Remove the cites relationship if unverified."},"title_short":"CBINN: cancer biology-informed NN with FIM-based identifiability (Chhetri & Kumar 2026)"},{"id":"upinn_2025","source_type":"paper","title":"Learning Chemotherapy Drug Action via Universal Physics-Informed Neural Networks","authors":["Podina L","Ghodsi A","Kohandel M"],"year":2025,"doi":"10.1007/s11095-025-03858-8","pmid":40244511,"url":null,"journal_or_venue":"Pharmaceutical Research","content":{"abstract_summary":"Applies Universal Physics-Informed Neural Networks (UPINNs) to learn unknown components of pharmacodynamic ODE models for chemotherapy — the gray-box identification problem in oncology PK/PD. Demonstrates on three standard chemotherapeutic drug action models (log-kill, Norton-Simon, and a third model) using synthetic data, then learns the net proliferation rate in a doxorubicin pharmacodynamics model. The UPINN framework uses the neural network as a universal approximator for unknown ODE terms while the known mechanistic structure constrains the solution space. University of Waterloo, 2025.","key_findings":["UPINN successfully learns three standard chemotherapeutic drug action terms (log-kill, Norton-Simon, and a third form) from synthetic data — demonstrates that physics-informed ML can recover known ODE structure from data without a priori specification","Parameter fitting for multiple synthetic datasets simultaneously is demonstrated — multi-experiment training with shared mechanistic structure","Net proliferation rate in doxorubicin PD model successfully learned — a real pharmacological unknown that standard ODE parameterization cannot capture","The approach occupies the exact gray-box niche: known mechanistic ODE scaffold (cell kill kinetics) + neural network to learn unknown term (proliferation rate function)","Authors explicitly frame these as 'toy examples' and 'highlight the usefulness' rather than clinical validation — honest scope statement"],"methods_discussed":["universal_physics_informed_neural_networks","gray_box_identification","pharmacodynamics","ODE_learning","doxorubicin","chemotherapy_drug_action","mechanistic_ML_hybrid"],"datasets_referenced":["synthetic_log_kill_model","synthetic_Norton_Simon_model","doxorubicin_pharmacodynamics_synthetic"],"tools_software":[],"limitations":["All validation is on synthetic data — 'toy examples' by authors' own description; clinical validation is not provided","Does not address identifiability of the learned neural network term — the UPINN may fit multiple solutions equally well","No comparison against standard ODE parameter estimation (e.g., NONMEM/Monolix) on the same data — only internal UPINN performance reported"],"extracted_claims":[{"text":"\"As the examples we study are only toy examples, we highlight the usefulness of UPINNs in learning unknown terms in pharmacodynamic and pharmacokinetic models.\"","location":"Abstract","evidence_type":"opinion"},{"text":"We show that the UPINN can successfully learn the hidden terms and unknown parameters in a variety of differential equations (with differing time and variable scales) that model the effect of chemotherapeutics on cancer cells.","location":"Abstract","evidence_type":"empirical"}],"numerical_findings":[]},"relevance":{"pillars":["hybrid_foundations","generative_ai"],"gaps_addressed":["Fills the UPINN slot in M1.1 — a specific form of physics-informed hybrid where a neural network learns an unknown ODE term while the rest of the mechanistic structure is fixed; directly relevant to M1.4 (when do hybrids help: when a term in the ODE is unknown but the scaffold is known)","Doxorubicin application connects to M4.1 (generative AI for pharmacometrics): UPINNs can be viewed as constrained generative models for ODE terms, where the physics constraint is the known mechanistic scaffold"],"topics":["universal_PINNs","physics_informed_neural_networks","chemotherapy","pharmacodynamics","doxorubicin","gray_box_identification","ODE_learning","University_of_Waterloo"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'physics-informed neural network drug pharmacology' (PMID 40244511). Pharmaceutical Research 2025, 42(4):593-612. University of Waterloo (Podina L, Ghodsi A, Kohandel M). Authors are upfront that validation is on toy/synthetic examples — honest scope statement is a positive signal for scientific quality. Upgrade to full_text only if the WG specifically pursues gray-box ODE identification as a M4.1 sub-task."},"title_short":"UPINNs for chemotherapy drug action: gray-box ODE identification (Podina et al. 2025)"},{"id":"karlsen_2025","source_type":"paper","title":"Covariate Model Selection Approaches for Population Pharmacokinetics: A Systematic Review of Existing Methods, From SCM to AI","authors":["Karlsen M","Khier S","Fabre D","Marchionni D","Azé J","Bringay S","Poncelet P","Calvier E"],"year":2025,"doi":"10.1002/psp4.13306","pmid":39831409,"url":null,"journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Systematic review of all covariate modeling methods in population pharmacokinetics, from traditional stepwise covariate modeling (SCM) through modern AI/ML alternatives. Reviews evaluation settings, performance metrics, and computational times for each method across the literature. Main conclusion: EBE-based ML methods stood out as the best covariate selection methods for prescreening; AALASSO (a hybrid genetic algorithm) was the overall best covariate model selection technique. Proposes standardized benchmarking and reporting practices for future method comparisons. From Montpellier University + Sanofi R&D, published in CPT:PSP.","key_findings":["EBE-based ML methods (using Empirical Bayes Estimates as targets for ML covariate selection) are the best covariate prescreening approach across the methods reviewed — faster and more accurate than traditional graphical correlations or GAM","AALASSO (Adaptive LASSO hybrid with genetic algorithm) is the best overall covariate model selection technique — outperforms standard SCM, SCM+, SAMBA, LASSO, Wald's approximation, and FREM in systematic comparison","FREM (full random effects model with clinical significance criterion) and SCM+ with stagewise filtering are the next best approaches after AALASSO","No consensus on how to benchmark simulated datasets across scenarios or which performance metrics to use — the field lacks standardized evaluation, making method comparisons unreliable","Proposed standardized metrics: TPR (sensitivity), FPR (Type I error), FNR (Type II error), TNR (specificity), covariate parameter error bias (MPE), and precision (RMSE), plus model fitness by BIC and concentration prediction error","Recommendation: new methods should always be compared against SCM as a baseline; covariate selection techniques should be combined with SCM or FFEM for head-to-head comparison"],"methods_discussed":["SCM","SCM_plus","SAMBA","LASSO","AALASSO","Wald_approximation","FREM","COSSAC","EBE_based_ML","XGBoost","random_forest","neural_network","SHAP","genetic_algorithm","population_pharmacokinetics","covariate_modeling"],"datasets_referenced":[],"tools_software":["NONMEM"],"limitations":["Review is limited to published comparisons of method performance — unpublished industry practice (likely dominated by SCM) is not captured","Lack of standardized benchmarking datasets makes quantitative cross-study comparison difficult; the review identifies this as the main obstacle to progress in the field","Most comparisons lack external validation — performance rankings may be simulation-scenario-specific"],"extracted_claims":[{"text":"EBEs-based ML methods stood out as the best covariate selection methods. AALASSO, a hybrid genetic algorithm, FREM with a clinical significance criterion and SCM+ with stagewise filtering were the best covariate model selection techniques — AALASSO being the very best one.","location":"Abstract / Results","evidence_type":"theoretical"},{"text":"We also highlight the need for an open-source benchmark of simulated datasets on a representative set of scenarios.","location":"Abstract","evidence_type":"opinion"}],"numerical_findings":[]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Provides the definitive landscape map for M1.3 (ML for covariate selection in pop PK) — any WG tutorial or scoping paper covering ML in pharmacometrics should cite this systematic review as the reference for covariate selection methods","The AALASSO finding (best overall method) vs EBE-ML (best prescreening) is a concrete recommendation the WG can build on for hybrid pharmacometric workflows","The call for open-source benchmarks maps directly to the WG's potential contribution: creating benchmark datasets for hybrid methods is a concrete, achievable WG deliverable"],"topics":["systematic_review","covariate_selection","population_pharmacokinetics","SCM","LASSO","AALASSO","FREM","EBE","ML_prescreening","benchmarking","Sanofi","Montpellier_University"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["kekic_2026"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"sections_key","notes":"Found via PubMed search 'machine learning covariate selection population pharmacokinetics' (PMID 39831409). PMC12001260 (open access). CPT:PSP 2025, 14(4):621-639. Montpellier University (LIRMM + IMAG) and Sanofi R&D Montpellier. Full text retrieved via PMC but is 71KB — stored to disk; key findings extracted from abstract and executive summary. The open-source benchmark recommendation is a direct WG opportunity. The companion to kekic_2026 for providing context on the covariate selection landscape."},"title_short":"Systematic review: pop PK covariate modeling from SCM to AI (Karlsen et al., Sanofi, CPT:PSP 2025)"},{"id":"kekic_2026","source_type":"paper","title":"Stochastic Gates for Covariate Selection in Population Pharmacokinetics Modeling","authors":["Kekic M","Stepanov O","Wang W","Richardson S","Olabode D","Traynor C","Dearden R","Zhou D","Tang W","Gibbs M","Nowojewski A"],"year":2026,"doi":"10.1002/psp4.70147","pmid":41637692,"url":null,"journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Proposes Stochastic Gates (SG), an embedded neural network feature selection method, for automated covariate prescreening in population pharmacokinetics. Unlike wrapped approaches (SHAP + XGBoost), SG simultaneously trains the model and selects covariates via a penalized gate layer — eliminating the need for post-hoc feature removal and separate retraining. Evaluated on synthetic datasets (correlated covariates, low-frequency categorical, high IIV, small population, XOR nonlinear dependency) and on two clinical datasets: monalizumab (507 subjects) and tixagevimab/cilgavimab (4940 participants). From AstraZeneca (Barcelona/Cambridge/Gaithersburg/Waltham), published in the WG's target journal CPT:PSP.","key_findings":["Stochastic Gates exactly match expert-identified covariates for monalizumab CL (BWT, BALB) and Vc (BWT, BALB, SMK, SEX) — demonstrates ML covariate prescreening can achieve expert-level accuracy on a real industry dataset","For tixagevimab/cilgavimab, SG identifies a superset of expert covariates (all expert covariates included plus additional ones) — backward elimination recommended after SG prescreening; XGBoost identifies fewer spurious covariates than BorutaShap but more than SG","SG outperforms XGBoost/BorutaShap specifically for highly correlated covariates — correctly identifies BWT (not correlated BBSA) in reference scenario where XGBoost cannot distinguish them","Warm start capability: initializing μ-gate parameters for preferred covariates allows domain knowledge priors to influence selection — useful when biologically meaningful and synthetic covariates are linearly dependent (data cannot distinguish them alone)","XOR nonlinear covariate dependency successfully recovered — key advantage of ML over linear SCM; stepwise approaches cannot detect nonlinear covariate interactions","Limitation explicitly flagged: SG relies on EBE, which can be biased under high shrinkage; peripheral compartment parameters with >30% shrinkage excluded from analysis"],"methods_discussed":["stochastic_gates","embedded_feature_selection","empirical_Bayes_estimates","neural_network_covariate_selection","SCM","LASSO","SHAP","XGBoost","BorutaShap","NONMEM","population_pharmacokinetics","covariate_modeling"],"datasets_referenced":["monalizumab_pop_PK_n507_subjects","tixagevimab_cilgavimab_n4940_participants","synthetic_covariate_scenarios_6"],"tools_software":["NONMEM","XGBoost","BorutaShap"],"limitations":["SG relies on EBE which is biased under high shrinkage (>30%) — peripheral compartment parameters must be excluded, limiting scope to identifiable parameters","Does not specify the functional form of covariate-parameter relationships; visual inspection (SHAP, symbolic regression) is still needed after covariate selection","High IIV (120% CV) narrows the range of penalty hyperparameter λ over which correct covariate selection occurs — fine-tuning becomes harder","Small populations (N=100) cause overfitting; only medium-effect covariates (30% effect size) reliably found","Covariate 'leakage' across PK parameters when correlations between random effects are high (>40%) — backward elimination step required"],"extracted_claims":[{"text":"For monalizumab, the covariates found on clearance and volume of distribution corresponded exactly to the covariates found by the expert.","location":"Discussion","evidence_type":"empirical"},{"text":"This machine learning-based method enhances the covariate preselection process in population pharmacokinetics model development, offering significant time savings and improving efficiency even under challenging scenarios.","location":"Abstract","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Monalizumab clinical dataset size (pooled from 2 studies)","value":"507","value_numeric":507,"unit":"N (subjects)","comparison_baseline":null,"location":"Methods / Datasets","is_primary_finding":false},{"metric_type":"study_statistic","description":"Tixagevimab/cilgavimab clinical dataset size (pooled from 8 clinical trials)","value":"4940","value_numeric":4940,"unit":"N (participants)","comparison_baseline":null,"location":"Methods / Datasets","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Directly fills M1.3 (ML for covariate selection in pop PK) — the dominant practical use of ML in industry pharmacometrics; provides a state-of-the-art embedded method that outperforms wrapped SHAP/XGBoost approaches for correlated and nonlinear covariate effects","The XOR scenario result is a key argument for ML in the WG scoping paper: standard SCM/LASSO cannot detect nonlinear covariate interactions that neural networks recover"],"topics":["covariate_selection","stochastic_gates","population_pharmacokinetics","NONMEM","EBE","SHAP","XGBoost","AstraZeneca","monalizumab","tixagevimab"],"relevance_score":"high"},"relationships":{"cites":["janssen_2024"],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"full_text","notes":"Found via PubMed search 'machine learning covariate selection population pharmacokinetics' (PMID 41637692). PMC12872115 (open access). CPT:PSP 2026, 15(2):e70147. AstraZeneca (all authors). Industry-funded. All authors are or were AstraZeneca employees. Retrieved full text via PMC. The 'warm start for preferred covariates' capability is a novel contribution not available in XGBoost/SHAP approaches and would be useful when WG needs to prioritize physiologically interpretable covariates over correlated alternatives."},"title_short":"Stochastic gates for ML covariate selection in pop PK (Kekic et al., AstraZeneca, CPT:PSP 2026)"},{"id":"tosca_2024","source_type":"paper","title":"Model-Informed Reinforcement Learning for Enabling Precision Dosing Via Adaptive Dosing","authors":["Tosca EM","De Carlo A","Ronchi D","Magni P"],"year":2024,"doi":"10.1002/cpt.3356","pmid":38989560,"url":null,"journal_or_venue":"Clinical Pharmacology and Therapeutics","content":{"abstract_summary":"Tutorial review of reinforcement learning (RL) coupled with population PK/PD models for precision dosing. Covers: RL framework components (state, action, reward) for dosing problems; case studies including propofol-induced anesthesia, warfarin anticoagulation, and anticancer treatments; how PK/PD models serve as the simulation engine for RL training. Identifies heterogeneity in approaches and proposes a standard problem formulation. From the U Pavia group (Tosca, De Carlo, Magni) — the leading academic group developing model-informed RL for precision dosing. Published in Clinical Pharmacology and Therapeutics.","key_findings":["RL naturally fits the sequential decision-making paradigm of adaptive dosing: clinicians adapt doses based on patient response and evolution monitoring, exactly the structure RL is designed for","PK/PD models as simulation engines for RL training enable safe, data-rich training environments: virtual patient populations can be simulated without patient risk, enabling RL to explore suboptimal or dangerous dosing that could never be ethically tested clinically","Case studies cover: (1) propofol anesthesia — one of the earliest and most developed RL dosing applications; (2) warfarin anticoagulation — narrow therapeutic window, INR feedback; (3) anticancer treatments — most diverse, covering agents with different PD biomarkers","Identified heterogeneity in: precision dosing approaches, RL methodologies used, and degree of adherence to clinical domain — the field lacks standardization comparable to population PK modeling","Tutorial on problem formulation: state space (patient biomarkers, PK parameters, drug concentrations), action space (dose amounts and intervals), reward function design (target concentration ranges, safety penalties)","Integration of PK/PD models into RL holds great promise but further investigation is needed — identifies the translational gap between simulation results and clinical deployment"],"methods_discussed":["reinforcement_learning","Q_learning","deep_Q_network","population_PK","population_PK_PD","model_informed_precision_dosing","propofol_TCI","warfarin_dosing","anticancer_dosing","reward_function_design","state_action_formulation"],"datasets_referenced":["virtual_patient_populations_general"],"tools_software":[],"limitations":["Current heterogeneity in RL dosing methodology and clinical adherence means results across studies are not directly comparable — an identified gap the review calls for the field to address","Further investigations needed to address current limitations and extend applicability to drugs requiring adaptive dosing — the review acknowledges the field is still pre-clinical for most applications","No new primary results — this is a review and tutorial, not a methods paper with novel experiments"],"extracted_claims":[{"text":"Reinforcement learning naturally fits this paradigm: it perfectly mimics the sequential decision-making process where clinicians adapt dose administration based on patient response and evolution monitoring.","location":"Abstract","evidence_type":"theoretical"},{"text":"The integration of PK/PD models into a RL-framework holds great promise for precision dosing, but further investigations and advancements are still needed to address current limitations.","location":"Abstract / Conclusions","evidence_type":"opinion"}],"numerical_findings":[]},"relevance":{"pillars":["optimal_control_rl"],"gaps_addressed":["The definitive tutorial/review for M3 (RL for precision dosing) from the leading group in this area — a WG scoping paper or tutorial on RL+pharmacometrics should cite this as the primary review of the field","The standard problem formulation (state/action/reward structure for dosing) is directly usable as a template for the WG's RL tutorial component of the scoping paper","The heterogeneity finding creates a clear gap for the WG to address: proposing standardized RL+PKPD benchmarking is a concrete contribution analogous to karlsen_2025's call for standardized covariate selection benchmarks"],"topics":["reinforcement_learning","model_informed_precision_dosing","propofol","warfarin","anticancer","population_PK_PD","tutorial_review","University_of_Pavia","Magni_group"],"relevance_score":"high"},"relationships":{"cites":["de_carlo_2024"],"cited_by":["irie_2025"],"extends":["de_carlo_2024"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'reinforcement learning drug dosing pharmacokinetics optimal' (PMID 38989560). CPT 2024, 116(3):619-636. University of Pavia (Tosca EM, De Carlo A, Ronchi D, Magni P). This is the review companion to de_carlo_2024 and de_carlo_2025 from the same group. No PMC entry found — not open access. Upgrade to full_text if the WG writes a tutorial on RL+pharmacometrics as part of the M3 workstream."},"title_short":"Model-informed RL for precision dosing: tutorial review (Tosca/De Carlo/Magni, CPT 2024)"},{"id":"irie_2025","source_type":"paper","title":"Model-Informed Deep Q-Networks to Guide Infliximab Dosing in Pediatric Crohn's Disease","authors":["Irie K","Minar P","Reifenberg J","Boyle BM","Noe JD","Hyams JS","Mizuno T"],"year":2025,"doi":"10.1002/cpt.70118","pmid":41189499,"url":null,"journal_or_venue":"Clinical Pharmacology and Therapeutics","content":{"abstract_summary":"Develops a model-informed Deep Q-Network (DQN) to automate and personalize infliximab dosing in pediatric Crohn's disease. The DQN is trained in a simulation environment using a population PK model and virtual pediatric patients over 80,000 episodes. Retrospectively validated against real clinical data from REFINE + APPDASH studies. First application of Q-learning to infliximab and first real-world validation of an RL-based precision dosing framework for biologics in pediatrics. From Cincinnati Children's Hospital Medical Center, NIH-funded.","key_findings":["DQN achieves 92.9% target attainment probability (PTA) at Infusion 4 and 98.4% at Infusion 5 vs 27.8% and 22.4% with standard 5 mg/kg weight-based dosing — a 3-4× improvement in target attainment","High doses (11-20 mg/kg) selected in only 0.2% of virtual patients with decision-based reward function — the reward structure successfully penalizes unnecessary dose escalation, a clinically critical safety constraint","Standard 8-week dosing interval maintained for 66.8% of patients at Infusion 4 and 57.3% at Infusion 5 — RL learns clinically preferred dosing behaviors when embedded in the reward function","Retrospective real-world validation: patients whose actual doses aligned with DQN recommendations had trough concentrations significantly closer to target ranges (Spearman correlation at Infusions 4 and 5) — first real-world validation of RL dosing for a biologic","No correlation at Infusion 1 (baseline covariates only): DQN cannot outperform population predictions for initial dosing without concentration data — a fundamental PK uncertainty that RL cannot overcome without feedback","DQN converged after 80,000 training episodes using double DQN with dueling architecture and prioritized experience replay — standard deep RL components enable stable learning in continuous covariate space"],"methods_discussed":["deep_Q_network","double_DQN","dueling_network_architecture","prioritized_experience_replay","model_informed_precision_dosing","population_PK","virtual_patient_simulation","reward_function_design","reinforcement_learning","therapeutic_drug_monitoring"],"datasets_referenced":["REFINE_study_infliximab_pediatric_Crohn","APPDASH_study_infliximab_CCHMC","virtual_pediatric_patients_PK_simulation"],"tools_software":[],"limitations":["PK model trained on only 78 pediatric patients (Xiong) — small training set limits generalizability of the underlying PK model driving the simulation environment","Limited PD biomarkers (no fecal calprotectin, clinical remission status) — DQN can only optimize PK exposure targets, not disease outcomes directly","Initial dosing (Infusion 1) limited by absence of concentration feedback — RL cannot improve over population-level predictions without any observed drug levels","Real-world validation is retrospective and associational, not prospective causal — DQN concordance correlates with target attainment partly because both reflect accurate PK model predictions"],"extracted_claims":[{"text":"This is the first study to apply Q-learning to infliximab therapy and to validate an RL-based precision dosing framework using clinical data.","location":"Study Highlights","evidence_type":"theoretical"},{"text":"Target attainment probabilities (PTAs) of 92.9% and 98.4% at Infusions 4 and 5, respectively, in 1000 virtual patients.","location":"Abstract","evidence_type":"empirical"},{"text":"High doses (11-20 mg/kg) were selected in only 0.2% of cases.","location":"Abstract / Results","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"performance_metric","description":"Target attainment probability (PTA) at Infusion 4: DQN vs standard 5 mg/kg","value":"92.9% vs 27.8%","value_numeric":92.9,"unit":"% (PTA)","comparison_baseline":"27.8% standard weight-based dosing","location":"Results / Table 2","is_primary_finding":true},{"metric_type":"performance_metric","description":"Target attainment probability (PTA) at Infusion 5: DQN vs standard 5 mg/kg","value":"98.4% vs 22.4%","value_numeric":98.4,"unit":"% (PTA)","comparison_baseline":"22.4% standard weight-based dosing","location":"Results / Table 2","is_primary_finding":true},{"metric_type":"model_parameter","description":"DQN training episodes to convergence","value":"80,000","value_numeric":80000,"unit":"N (episodes)","comparison_baseline":null,"location":"Methods","is_primary_finding":false}]},"relevance":{"pillars":["optimal_control_rl"],"gaps_addressed":["Fills M3.2 (deep RL for model-informed precision dosing) with a concrete biologic/immunology application — a different drug class (mAb vs the HDAC inhibitor givinostat and kinase inhibitor erdafitinib in the de_carlo papers)","First real-world retrospective validation of RL-based dosing (the de_carlo papers use only virtual populations) — directly relevant to the M3 question of translational readiness","The reward function design (penalizing high doses and extra clinic visits) illustrates how clinical constraints and safety preferences can be encoded in RL without changing the PK model — a practical contribution for the WG tutorial"],"topics":["deep_Q_network","reinforcement_learning","infliximab","pediatric_Crohn_disease","model_informed_precision_dosing","biologic_dosing","therapeutic_drug_monitoring","Cincinnati_Childrens_Hospital","MIPD"],"relevance_score":"high"},"relationships":{"cites":["de_carlo_2024"],"cited_by":[],"extends":["de_carlo_2024"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"full_text","notes":"Found via PubMed search 'reinforcement learning drug dosing pharmacokinetics optimal' (PMID 41189499). PMC12816428 (open access). CPT 2025, 119(2):555-563. Cincinnati Children's Hospital Medical Center (Mizuno T = corresponding). NIH-funded (DK132408 from NIDDK). Crohn's and Colitis Foundation. The first ML/RL paper from a purely clinical translational team (not a methods group like U Pavia) — adds credibility for clinical adoption angle. The CCHMC clinical dashboards (RoadMAB platform) mentioned as integration target."},"title_short":"DQN for infliximab dosing in pediatric Crohn's: first RL real-world validation (Irie et al., CPT 2025)"},{"id":"chenel_2026","source_type":"paper","title":"Best Practices in Physiologically Based Pharmacokinetic (PBPK) Modeling","authors":["Chenel M","Dallmann A","Ince I","Meyer M","Schlender JF","Teutonico D","Sjögren E"],"year":2026,"doi":"10.1002/psp4.70295","pmid":42400597,"url":null,"journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Comprehensive best-practice guidance for PBPK model development, evaluation, and regulatory submission, explicitly aligned with the ICH M15 guideline on Model-Informed Drug Development (MIDD). Addresses a documented gap: recent EMA reviews show many submitted PBPK models are not adequately qualified for their intended application. Framework: (1) define Question of Interest (QoI) and Context of Use (CoU) prospectively; (2) develop with bottom-up/middle-out/top-down approaches; (3) verify, validate, and assess applicability; (4) document comprehensively for regulatory review. Covers DDI assessment, special populations (pediatrics, organ impairment), formulation/food effects, and first-in-human dose projections. Authors from Pharmetheus, Bayer, Boehringer Ingelheim, Novartis, Sanofi.","key_findings":["EMA review of PBPK models in new medicinal product approvals finds that many submitted models are not deemed adequately qualified for their intended application — a documented quality gap drives this best-practice guidance","ICH M15 core principle: the Context of Use (CoU) dictates model complexity, data requirements, and validation rigor. Risk assessment = Model Influence × Consequence of a Wrong Decision (CoWD); evaluation rigor must be proportional to model risk","Model evaluation is three-stage: (1) Verification (mathematical/computational integrity), (2) Validation (accuracy vs. experimental data, qualitative + quantitative), (3) Applicability assessment (fit-for-purpose for the specific QoI within the CoU)","Uncertainty quantification required: local sensitivity analysis (tornado plots, spider plots, one-at-a-time); global SA (Sobol indices, simultaneously varying all parameters); Bayesian hierarchical methods for population parameter uncertainty — current best practices not yet fully standardized","Sequential model development recommended: IV model first (elimination + distribution) → fix systemic parameters → develop oral absorption model. Mechanistic parameter adjustment (intrinsic clearance) preferred over adjusting composite parameters (total plasma clearance)","ICH M15 'assessment table' as documentation standard: prospectively document QoI, CoU, Model Influence, CoWD, and credibility criteria — demonstrated with vericiguat DDI case study where PBPK replaced a clinical study","Regulatory acceptance landscape: FDA and EMA maintain platform-agnostic stance (Simcyp, GastroPlus, PK-Sim/OSP all acceptable); fundamental requirement is adequate verification regardless of platform","PBPK applications in order of regulatory risk: DDI assessment (waiving clinical studies), pediatric dosing, organ impairment, formulation/food effects, first-in-human projections — each requires progressively documented credibility"],"methods_discussed":["PBPK","ICH_M15","MIDD","sensitivity_analysis","uncertainty_quantification","Bayesian_parameter_estimation","DDI_modeling","pediatric_extrapolation","IVIVE","virtual_population","PBPK_verification_validation","context_of_use","model_risk_assessment"],"datasets_referenced":[],"tools_software":["Simcyp","GastroPlus","PK-Sim","MoBi","Open Systems Pharmacology Suite"],"limitations":["Uncertainty quantification section explicitly notes 'it is currently premature to establish definitive best practices for uncertainty quantification' — field consensus not yet reached","Paper is guidance-oriented, not validation study: no new empirical data, all recommendations based on regulatory experience and literature synthesis","ML/AI methods for PBPK are not discussed — paper focuses entirely on classical mechanistic PBPK; hybrid PBPK+ML or surrogate modeling is outside scope"],"extracted_claims":[{"text":"A recent European Medicines Agency (EMA) review of PBPK models in new medicinal product approvals indicates that regulatory expectations are frequently unmet, with many submitted models not deemed adequately qualified for their intended application.","location":"Background","evidence_type":"regulatory_report"},{"text":"The CoU dictates the necessary model complexity, data requirements, and validation rigor.","location":"Methods","evidence_type":"guideline"},{"text":"Adhering to these practices—including systematic development, formal evaluation, and comprehensive documentation—will enhance the quality and regulatory acceptance of PBPK submissions, solidifying their role in quantitative decision-making.","location":"Conclusion","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"study_statistic","description":"DDI case study: CYP3A4 fraction metabolized adjusted from 0.90 to 0.57 to align with observed clinical DDI magnitude, demonstrating middle-out parameter refinement","value":"fm_CYP3A4 = 0.57 (adjusted from 0.90)","value_numeric":0.57,"unit":"fraction metabolized","comparison_baseline":"initial bottom-up estimate: 0.90","location":"Box 1 case example","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Provides the most current regulatory framework for mechanistic modeling in drug submissions — directly relevant to WG positioning: hybrid mechanistic-ML models must satisfy ICH M15 CoU-based credibility criteria, not just benchmark metrics","UQ section highlights the unresolved state of uncertainty quantification best practices in PBPK — an open problem where MCS SIG's SA/UQ expertise could contribute directly to regulatory science","Identifies where AI could help: EMA gap in PBPK quality vs. regulatory expectations suggests ML-assisted automated verification, sensitivity analysis, or surrogate emulation as opportunities"],"topics":["PBPK","ICH_M15","MIDD","regulatory_submissions","EMA","FDA","DDI_modeling","uncertainty_quantification","context_of_use","pediatric_pharmacology","model_credibility","Pharmetheus","Bayer","Novartis","Sanofi"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"full_text","notes":"Found via PubMed search 'ICH M15 model informed drug development guideline pharmacometrics' (PMID 42400597). Full text retrieved from PMC13332702 (DOI: 10.1002/psp4.70295). CPT:PSP 2026, 15(7):e70295. Open access. Authors from 7 European pharma and consultancy organizations: Pharmetheus AB (Chenel M, Sjögren E), Bayer (Dallmann A, Meyer M), Boehringer Ingelheim (Ince I), Novartis (Schlender JF), Sanofi (Teutonico D). ICH M15 is the active regulatory guideline governing MIDD submissions to FDA, EMA, PMDA. Key WG relevance: any hybrid ML-mechanistic model the WG promotes must fit within this ICH M15 CoU + credibility framework to be regulatory-relevant."},"title_short":"PBPK best practices aligned with ICH M15 MIDD guideline (Chenel et al., CPT:PSP 2026)"},{"id":"goryanin_2025","source_type":"paper","title":"Revolutionizing drug discovery: Integrating artificial intelligence with quantitative systems pharmacology","authors":["Goryanin I","Goryanin I","Demin O"],"year":2025,"doi":"10.1016/j.drudis.2025.104448","pmid":40774584,"url":null,"journal_or_venue":"Drug Discovery Today","content":{"abstract_summary":"Critical review of AI integration within Quantitative Systems Pharmacology (QSP), covering AI-driven databases, cloud platforms, surrogate modeling, virtual patient generation, and digital twin technologies. Identifies QSP-as-a-service (QSPaaS) as an emerging model enabled by AI. Persistent challenges: computational complexity, high dimensionality, explainability, data integration, and regulatory acceptance of AI-enhanced QSP. Specifically discusses surrogate modeling (replacing computationally expensive QSP simulations with ML emulators), virtual patient generation (GAN/VAE-based synthetic populations), and digital twins linking patient-specific mechanistic models to real-time data. Authors from University of Edinburgh (Goryanin I), MMWR Ltd (Goryanin I), InSysBio CY Ltd (Demin O). Drug Discovery Today 2025.","key_findings":["Surrogate modeling (emulating expensive QSP/ODE simulations with ML) is identified as the primary computational advantage AI brings to QSP — reduces evaluation cost from hours to milliseconds for virtual screening and global sensitivity analysis","Virtual patient generation via GANs, VAEs, and diffusion models enables construction of realistic synthetic patient populations for QSP simulations; addresses the small-sample QSP calibration problem by augmenting scarce clinical datasets","Digital twins (DTs) in QSP context: mechanistic QSP model personalized to individual patient data, iteratively updated as new clinical data arrives — distinguished from simpler exposure-response modeling by real-time twinning capability","QSPaaS (QSP-as-a-service): AI-enabled cloud platforms democratize QSP modeling beyond specialist groups — reduces entry barrier for smaller organizations; analogous to software services model in tech industry","Explainability is identified as a critical barrier to regulatory acceptance: black-box AI components in QSP pipelines are not acceptable to regulators without XAI methods (SHAP, attention, LIME) demonstrating mechanistic interpretability","Regulatory acceptance remains a core challenge: FDA and EMA have no specific guidance yet for AI-augmented QSP submissions; the paper calls for regulatory engagement analogous to how the field developed PBPK acceptance (now covered by ICH M15)"],"methods_discussed":["QSP","surrogate_modeling","ML_emulators","virtual_patient_generation","GAN","VAE","digital_twins","QSPaaS","XAI","SHAP","PBPK","AI_drug_discovery","cloud_computing"],"datasets_referenced":[],"tools_software":[],"limitations":["Review paper with no new empirical results — all claims are synthesis of existing literature, no validation experiments","Authors affiliated with commercial QSP platform (InSysBio) creating potential conflict of interest in QSPaaS advocacy","No pharmacometrics-specific methods (NONMEM, nlmixr, NLME) discussed — gap between QSP and PMx communities not bridged","Surrogate modeling accuracy vs. fidelity tradeoff not quantified — no benchmark comparisons provided for how well ML emulators replicate full QSP simulations across scenarios"],"extracted_claims":[{"text":"AI-driven databases and cloud-based platforms might support QSP model development and facilitate QSP as a service (QSPaaS).","location":"Abstract","evidence_type":"opinion"},{"text":"Challenges such as computational complexity, high dimensionality, explainability, data integration, and regulatory acceptance persist.","location":"Abstract","evidence_type":"opinion"},{"text":"Novel methodologies like surrogate modeling, virtual patient generation, and digital twin technologies [are highlighted] to enhance precision medicine, regulatory acceptability, and mechanistic interpretability.","location":"Abstract","evidence_type":"opinion"}],"numerical_findings":[]},"relevance":{"pillars":["hybrid_foundations","generative_ai","uq_identifiability"],"gaps_addressed":["Fills the cross-SIG (QSP×AI) positioning gap — allows MCS SIG AI WG to understand what QSP SIG is doing on AI and where MCS's mathematical rigor (UQ, identifiability) differentiates from the explainability/interpretability angle QSP uses","Surrogate modeling for QSP = the PBPK-ML emulator use case the WG has been unable to find in PubMed — this paper provides the conceptual framework even if without empirical benchmarks","Regulatory acceptance framing matches the WG's mandate: arguing that AI-augmented mechanistic models need XAI + UQ for regulatory acceptance is exactly the MCS SIG value-add over pure ML approaches"],"topics":["QSP","AI_QSP_integration","surrogate_modeling","ML_emulators","virtual_patients","digital_twins","QSPaaS","regulatory_acceptance","XAI","explainability","University_of_Edinburgh","InSysBio","drug_discovery"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'explainability interpretability machine learning drug regulatory acceptance' (PMID 40774584). DOI: 10.1016/j.drudis.2025.104448. Drug Discovery Today 2025, 30(9):104448. Paywalled — no PMC ID. Abstract only. Authors: I. Goryanin (U Edinburgh + MMWR Ltd), I. Goryanin (MMWR Ltd), O. Demin (InSysBio CY Ltd, Cyprus + InSysBio UK Ltd, Edinburgh). InSysBio is a commercial QSP platform vendor. Key value: provides cross-SIG intelligence on what QSP groups are doing with AI; surrogate modeling and QSPaaS concepts are directly relevant to MCS WG positioning. If user obtains PDF, upgrade to full_text."},"title_short":"AI+QSP integration: surrogate modeling, virtual patients, digital twins, regulatory acceptance (Goryanin et al. 2025)"},{"id":"krishna_2025","source_type":"paper","title":"State-of-the-Art on Model-Informed Drug Development Approaches for Pediatric Rare Diseases","authors":["Krishna R","Mitra A","Zierhut ML","East L","Durairaj C"],"year":2025,"doi":"10.1002/psp4.70083","pmid":40697166,"url":null,"journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Comprehensive state-of-the-art review of MIDD approaches in pediatric rare disease drug development, illustrating growing regulatory acceptance of pharmacometric modeling in submissions with limited trial data. Six detailed case studies from FDA-approved drugs (risdiplam/SMA, nusinersen/SMA, maribavir/CMV, pozelimab/CHAPLE, mirdametinib/NF1, eteplirsen+delandistrogene/DMD) show how PopPK, PBPK, disease progression models, and exposure-response relationships substitute for traditional RCTs. Future directions include Bayesian trial design, synthetic control arms (including digital twins and generative AI-based approaches), and longitudinal clustering for patient stratification. Authors from Certara, Kura Oncology, Sarepta Therapeutics, Takeda Pharmaceuticals. CPT:PSP 2025.","key_findings":["Six regulatory approval case studies: MIDD replaced or supplemented clinical trials in all cases — risdiplam (PBPK for DDI bridging adult→pediatric), maribavir (PopPK simulation of adolescent exposure-matching), pozelimab (single-arm trial + E-R modeling), mirdametinib (PopPK-based pediatric dose selection), eteplirsen and delandistrogene (disease progression + vector load-expression-response analysis)","PBPK + PopPK integration strategy validated in risdiplam: PBPK predicted DDI liability; separate mechanistic PopPK model estimated in vivo FMO3 ontogeny from data across ages 2 months–61 years — enabling a dosing strategy recommendation without additional pediatric DDI trials","Digital twins and synthetic data explicitly listed as 'reduced RCT' approaches: AI/ML-trained virtual control arms, Bayesian hybrid designs, patient-generated health data from wearables — FDA and EMA increasingly accept external controls and real-world evidence for rare diseases","Longitudinal clustering identified as an emerging AI method for rare disease: temporal clustering of disease trajectories identifies patient subgroups missed by cross-sectional analysis; handles irregular visit schedules and missing data common in rare disease registries","MBMA limitations in rare disease: insufficient data, heterogeneous endpoints, limited comparative trials — calls for innovative data sharing and standardization; MIDD fills gaps where MBMA cannot","FDA MIDD paired meeting program: formal pathway to engage agency proactively on MIDD strategy — WG can leverage this as an example of regulatory engagement for AI/pharmacometrics topics","AAV gene therapy (delandistrogene): first application of PK/PD evaluation to AAV-based gene transfer — vector load-expression-response analysis as a new form of MIDD beyond traditional small molecule PK"],"methods_discussed":["MIDD","PopPK","PBPK","disease_progression_modeling","exposure_response","Bayesian_trial_design","clinical_trial_simulation","digital_twins_synthetic_control","longitudinal_clustering","MBMA","pediatric_extrapolation","allometric_scaling","natural_history_data","biomarker_modeling"],"datasets_referenced":["FDA_summary_basis_of_approval_multiple_drugs","SMA_natural_history_registries","DMD_natural_history_data"],"tools_software":["NONMEM","DoseMeRx","WAPPS-Hemo"],"limitations":["Review focuses on regulatory success stories — selection bias toward approved drugs where MIDD worked; failures where MIDD was insufficient are not discussed","AI/ML methods are mentioned only in the forward-looking section (synthetic data, digital twins, clustering) — not yet in the regulatory submission case studies; AI+MIDD is still aspirational not standard practice","MBMA criticism is acknowledged as limited to rare disease context — in common diseases MBMA is well-established; the rare disease limitations do not generalize"],"extracted_claims":[{"text":"Digital twins/simulated control arms: AI/machine learning trained on historical or observational data; model the disease trajectory without intervention for a virtual control arm; no need to withhold treatment from real patients.","location":"Table 2","evidence_type":"opinion"},{"text":"Longitudinal clustering represents a transformative approach in pediatric rare disease research, allowing the detection of distinct disease progression phenotypes from complex, temporal clinical data.","location":"Section 5.4","evidence_type":"opinion"},{"text":"Our vision remains that RCTs are replaced by responsible data-integrated alternatives.","location":"Summary","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Risdiplam PopPK: data from 26 healthy volunteers and 301 SMA patients across infants, adolescents, and adults; weight-based dosing ≤2yr and <20kg, fixed dose ≥2yr >20kg","value":"327","value_numeric":327,"unit":"N (subjects in PopPK model)","comparison_baseline":null,"location":"Case Study 1","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability","generative_ai"],"gaps_addressed":["Documents the current regulatory acceptance landscape for MIDD in detail — gives WG a concrete picture of what FDA and EMA already accept and where AI/ML submissions are being positioned","Explicitly bridges AI/ML (digital twins, generative synthetic controls, longitudinal clustering) with the MIDD regulatory framework — provides the connective tissue between what WG is researching and why regulators care","Bayesian hybrid trial designs and external control arms are the pathway through which AI-generated synthetic data enters regulatory submissions — case studies show the regulatory logic chain"],"topics":["MIDD","regulatory_pharmacometrics","pediatric_rare_diseases","PBPK","PopPK","Bayesian_trial_design","digital_twins","synthetic_control_arms","FDA","EMA","Certara","Sarepta","Takeda","gene_therapy_PK"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"sections_key","notes":"Found via PubMed search 'Bayesian pharmacokinetics regulatory pharmacometrics model informed drug development' (PMID 40697166). Full text retrieved from PMC12625129 (DOI: 10.1002/psp4.70083). CPT:PSP 2025, 14(11):1743-1759. Open access. Authors: industry perspective (Certara, Kura Oncology, Sarepta, Takeda). Full text is 74.8KB — key sections extracted: introduction, case studies summary, Table 1 (selected drugs), Table 2 (synthetic data approaches), future directions (sections 5.4-6.3). The AI/ML section is forward-looking (not yet implemented in submissions) but the regulatory logic chain (MIDD → external controls → synthetic data → digital twins) is well-documented through real approval cases."},"title_short":"State-of-the-art MIDD for pediatric rare diseases: regulatory case studies + AI future directions (Krishna et al. 2025)"},{"id":"dette_2025","source_type":"paper","title":"Advancing rare disease therapeutics through digital twins: Opportunities in drug development and precision dosing","authors":["Dette CMU","Alberg V","Rüdesheim S","Selzer D","Marok FZ","Bragazzi NL","Fuhr LM","Brunak S","Pearson ER","Zahn T","Kiritsi D","Schwab M","Lehr T"],"year":2025,"doi":"10.1016/j.csbj.2025.11.047","pmid":41404110,"url":null,"journal_or_venue":"Computational and Structural Biotechnology Journal","content":{"abstract_summary":"Systematic review (16 studies from 49 identified) of digital twin (DT) implementations in rare disease (RD) drug development, analyzing PBPK, PopPK, QSP, physiome modeling, and combined approaches. Key finding: no published paper implements a true DT as defined by three criteria — (1) individual patient representation, (2) fusion of heterogeneous data sources, (3) real-time iterative updating. Current implementations are DT precursors, not full DTs. Reviews disease progression modeling, preclinical-to-FIH scaling, pediatric extrapolation, scarce-data scenarios, DDI modeling, and clinical accessibility. Forward-looking: generative AI (GANs, VAEs, diffusion models) and generative digital twins (GDTs) integrating spatial omics + mechanistic models as the next step. Use case: epidermolysis bullosa (EB). Saarland University, Saarbrücken (Lehr group).","key_findings":["True DT definition (from authors): dynamic, continuously updateable computational representation of an individual patient, integrating mechanistic + empirical + population models with patient-specific real-world data — NONE of the 16 reviewed papers fully satisfy this definition because all lack real-time iterative updating","Three closest DT precursors: Susilo et al. (QSP for NHL mosunetuzumab — per-patient parameter estimation), Kaddi et al. (QSP/PBPK for Pompe disease — calibrated to individual patients), Yıldırım et al. (cardiovascular hemodynamic DT for congenital heart disease) — all fail the real-time updating criterion","FDA and EMA regulatory context: FDA CDER AI discussion paper describes DTs as a coming technology; EMA multi-annual AI workplan includes DT pilot studies in 2024 and 2026 — specific DT regulatory framework does not yet exist","Generative digital twins (GDTs): emerging concept integrating generative AI (spatial omics, multiplexed imaging, diffusion models, GANs) with mechanistic models — enables multi-scale DTs that reproduce tissue/organ-level phenotypes and can be interrogated causally ('what-if' simulations)","QSP model accepted as confirmatory FDA evidence: McBride et al. QSP model for rADAMTS13 in congenital TTP was submitted to and accepted by FDA as confirmatory evidence for rADAMTS131 efficacy over plasma — first QSP-for-regulatory-approval case","Key barriers for DT clinical adoption: data interoperability (FHIR, DICOM, OMOP not uniformly implemented), computational cost, interpretability/clinician trust, validation against clinical outcomes, ethical issues (federated learning, dynamic consent, patient data ownership)","Generative approaches for RD data augmentation: GANs, VAEs, diffusion models can generate synthetic yet biologically plausible datasets; ontology-enhanced or knowledge-guided versions improve biological consistency and fairness in underrepresented populations"],"methods_discussed":["digital_twins","PBPK","PopPK","QSP","physiome_modeling","disease_progression_modeling","GAN","VAE","diffusion_models","generative_digital_twins","spatial_omics","federated_learning","virtual_clinical_trials","virtual_control_arms"],"datasets_referenced":["QSP_models_16_studies_rare_diseases_PubMed"],"tools_software":["FHIR","DICOM","OMOP","WAPPS-Hemo","Simcyp"],"limitations":["16 studies reviewed is a small sample — rare disease DT publications are too few for robust conclusions; findings reflect early-stage field, not mature technology","DT definition is stricter than many papers use — creates gap between authors' 'true DT' and what most publications call a DT; practical guidance for the field may be different from the strict theoretical definition","Generative DTs section is forward-looking with minimal empirical support — Wu & Koelzer reference is cited but not critically reviewed; actual performance of GDTs in rare disease settings not yet documented"],"extracted_claims":[{"text":"In general, all assessed manuscripts do not align with the DT definition stated [here] because they lack more than one of the following essential elements: (i) representation of an individual patient, (ii) fusion of heterogeneous data sources, and (iii) iterative updating via real-time data transfer.","location":"Section 2.8","evidence_type":"empirical"},{"text":"FDA accepted the results from the QSP model as confirmative evidence proving the advantages of rADAMTS13 compared to plasma-based therapy.","location":"Section 2.3","evidence_type":"empirical"},{"text":"GDTs integrate generative AI with omics and imaging-derived data, including spatial omics and multiplexed imaging, to create high-fidelity, spatially resolved virtual representations of biological systems.","location":"Section 4.2","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Systematic literature review scope: 16 included studies from 49 identified via PubMed search on digital twins in rare diseases","value":"16/49","value_numeric":16,"unit":"N (included studies / identified)","comparison_baseline":"49 total identified","location":"Methods","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","generative_ai","uq_identifiability"],"gaps_addressed":["Provides the most rigorous definition of digital twin in the pharmacology context — anchors WG discussion so members do not conflate a population model with a true DT; the 'three criteria' framework is directly usable in the scoping paper","QSP model accepted as regulatory evidence (McBride et al. rADAMTS13 FDA case) is the most concrete cross-SIG (QSP×regulatory) example in the library — directly supports WG argument that mechanistic models enhance regulatory trust","Generative DT concept (GDTs) bridges generative_ai pillar and hybrid_foundations: integrating spatial omics + diffusion models + mechanistic QSP is the direction that extends beyond current neural-ODE pharmacokinetics work"],"topics":["digital_twins","rare_diseases","QSP","PBPK","PopPK","generative_AI","GAN","VAE","diffusion_models","regulatory_evidence","FDA","EMA","Saarland_University","precision_dosing","synthetic_data"],"relevance_score":"high"},"relationships":{"cites":["janssen_2024"],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"sections_key","notes":"Found via PubMed search 'digital twin patient pharmacokinetics pharmacodynamics personalized medicine' (PMID 41404110). Full text retrieved from PMC12703978 (DOI: 10.1016/j.csbj.2025.11.047). CSBJ 2025, 28:592-608. Open access. Lead institution: Clinical Pharmacy, Saarland University (Lehr group); co-authors from Novo Nordisk Foundation (Brunak S, Copenhagen), U Dundee (Pearson ER), U Freiburg (Kiritsi D), Crowd Pharma (Zahn T). Full text is 78.4KB — key sections extracted: DT definition (1.5), regulatory perspective (1.3), 16-study evaluation (2.2-2.8), generative DTs (4.2). Note: dette_2025 cites janssen_2024 (haemophilia A DCM paper) in Section 2.5 as a scarce-data modeling example."},"title_short":"Digital twins for rare disease therapeutics: 16-study review; generative DTs (Dette et al., Lehr group, CSBJ 2025)"},{"id":"chen_2024_amd","source_type":"paper","title":"A fully automatic tool for development of population pharmacokinetic models","authors":["Chen X","Nordgren R","Belin S","Hamdan A","Wang S","Yang T","Huang Z","Carter SJ","Buatois S","Abrantes JA","Hooker AC","Karlsson MO"],"year":2024,"doi":"10.1002/psp4.13222","pmid":39190006,"url":null,"journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Presents AMD (Automated Model Development), a fully automated tool for population PK model building implemented in Pharmpy, an open-source Python-based pharmacometrics library. AMD iterates through six modeling components: structural model, IIV model, IOV model, RUV model, covariate model, and allometry model. Evaluated on 10 real PK datasets. AMD produces models with lower BIC than published models while achieving similar VPC performance. Run time is reasonable. From the Uppsala pharmacometrics group (Karlsson MO, Hooker AC), with Roche co-authors (Buatois S, Abrantes JA). CPT:PSP 2024.","key_findings":["AMD automates the entire population PK model building workflow: structural model selection (1/2/3-compartment), IIV model (full/diagonal), IOV model, RUV model (proportional/additive/combined), covariate model, and allometry — all without user intervention after dataset specification","10 real PK datasets evaluated across three module sequences: generally consistent structural models across sequences, but variations in IIV and RUV model results — suggesting covariate and IIV estimation remain sources of variability even in automated pipelines","AMD final models show lower BIC values than published manually-developed models, indicating better statistical fit; visual predictive check plots are similar — automated pipeline achieves competitive quality without human expert iteration","Pharmpy is the implementation platform: open-source Python library for pharmacometrics, providing access to NONMEM and other backends; AMD is available as a reproducible, version-controlled open-source tool from Uppsala","Limitation acknowledged: covariate selection variability across sequences remains; the fully automated covariate step may not match expert judgment for all cases — consistent with the challenge documented in karlsen_2025 (no consensus on covariate benchmarking)"],"methods_discussed":["automated_model_development","population_PK","NONMEM","BIC","IIV_modeling","covariate_modeling","allometric_scaling","RUV_modeling","VPC","open_source_pharmacometrics"],"datasets_referenced":["10_real_PK_datasets_Uppsala_evaluation"],"tools_software":["Pharmpy","NONMEM"],"limitations":["IIV and RUV model selection shows variability across three AMD sequences — not fully reproducible at the component level, only consistent at the structural model level","Covariate step may not match pharmacometrician expert judgment — automated covariate selection does not encode domain knowledge about which covariates are clinically meaningful vs. statistically significant","Evaluated only on 10 datasets — limited generalizability; complex PK situations (nonlinearity, flip-flop, enterohepatic recirculation) not specifically assessed"],"extracted_claims":[{"text":"The final models of the AMD tool showed lower Bayesian Information Criterion (BIC) values and similar visual predictive check plots compared with the available published models, indicating reasonable quality, in addition to reasonable run time.","location":"Abstract","evidence_type":"empirical"},{"text":"The developed AMD tool serves as a promising tool for fast and fully automatic population PK model building with the potential to facilitate the use of modeling and simulation in drug development.","location":"Abstract","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Number of real PK datasets used to evaluate AMD tool across three module sequences","value":"10","value_numeric":10,"unit":"N (PK datasets)","comparison_baseline":null,"location":"Methods / Results","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Fills the M1.3 gap for automated pop PK model building — complementary to karlsen_2025 (systematic review of covariate selection methods) and kekic_2026 (stochastic gates): AMD automates the full pipeline, not just covariate selection","Pharmpy open-source toolchain is an actionable WG deliverable to reference: demonstrates that automation of pharmacometrics is not theoretical but implemented and open-access — sets a benchmark for what the WG could recommend or build upon","BIC-based comparison vs. published models provides a concrete benchmark methodology — relevant to karlsen_2025's call for standardized benchmarking metrics"],"topics":["automated_model_development","population_PK","Pharmpy","NONMEM","open_source_pharmacometrics","covariate_modeling","model_building_automation","Uppsala_pharmacometrics","Karlsson","Hooker","Roche"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'Bayesian pharmacokinetics regulatory pharmacometrics model informed drug development' (PMID 39190006). Full text available from PMC11494844 (DOI: 10.1002/psp4.13222). CPT:PSP 2024, 13(10):1784-1797. Open access. Uppsala University (Karlsson MO corresponding + 9 co-authors), Roche Innovation Center Basel (Buatois S, Abrantes JA). Pharmpy is maintained at https://github.com/pharmpy/pharmpy. AMD is listed as cited_by karlsen_2025 based on position in the covariate selection review; confirm when reading karlsen_2025 full text. Note: citation direction may be reverse — karlsen_2025 (2025) published after chen_2024 — karlsen_2025 likely cites chen_2024_amd."},"title_short":"AMD: fully automated population PK model building tool in Pharmpy (Chen et al., Uppsala, CPT:PSP 2024)"},{"id":"elmokadem_2024","source_type":"paper","title":"Hierarchical deep compartment modeling: A workflow to leverage machine learning and Bayesian inference for hierarchical pharmacometric modeling","authors":["Elmokadem A","Wiens M","Knab T","Utsey K","Callisto SP","Kirouac D"],"year":2024,"doi":"10.1111/cts.70045","pmid":39402751,"url":null,"journal_or_venue":"Clinical and Translational Science","content":{"abstract_summary":"Introduces Hierarchical Deep Compartment Modeling (HDCM), an extension of Deep Compartment Modeling (DCM) that integrates Bayesian inference (NUTS sampler via Turing.jl) to add IIV, residual error, and full uncertainty quantification — three features missing from vanilla DCM. DCM uses a neural network to map covariates to PK parameters but assesses no random effects, leading to overfitting and misspecification. HDCM addresses this by estimating IIV (log-normal, on CL, V2, ka) and proportional residual error jointly with NN weights via MCMC. Demonstrated on synthetic two-compartment oral data (30 subjects, 15 dense samples, 10 covariates). Open-source Julia workflow. Metrum Research Group.","key_findings":["DCM (the predecessor architecture) does not evaluate any residual error or IIV — stated as primary failure mode leading to model misspecification and overfitting; HDCM adds both IIV and proportional residual error estimated jointly with NN weights via MCMC","Full Bayesian inference via NUTS (No U-Turn Sampler): 4 parallel chains × 1000 total samples (500 warmup + 500 sampling); all R-hat values ≤1.05; run time ~5 hours on synthetic dataset","Bayesian prior on NN weights (σ_w = 0.6) acts as regularizer, enabling stable training on small datasets (N=30) without significant overfitting: 'Bayesian analysis offered the added benefit of putting a penalty on the NN optimization via the prior information, which allows practitioners to train the NN on a small sample size without introducing significant overfitting'","Posterior estimates within reasonable range of true values: V2 error 5.06%, Q error 0.08%, ka error 25.4%, CL error 19.0%; IIV parameters recoverable (ω_CL median 0.13, ω_V2 median 0.09, ω_ka median 0.39) with wide credible intervals at N=30","SHAP implemented via ShapML.jl with Bayesian credible intervals: weight most influential for CL, but wide CIs at small N indicate SHAP interpretation requires larger datasets","BLQ handling included via left-censored likelihood (log-normal CDF); MAP initialization via Nelder-Mead as optional starting point","No real-world dataset validation performed — limitation explicitly stated; no benchmarking against NONMEM — both acknowledged as future work"],"methods_discussed":["deep_compartment_model","hierarchical_Bayesian","NUTS_MCMC","neural_network","IIV_modeling","RUV_modeling","BLQ_handling","SHAP","population_PK","two_compartment_model","Julia"],"datasets_referenced":["synthetic_two_compartment_oral_PK_N30_simulated"],"tools_software":["Julia","Turing.jl","Flux.jl","OrdinaryDiffEq.jl","Optimization.jl","Optim.jl","ShapML.jl","StatsPlots.jl","AlgebraOfGraphics.jl"],"limitations":["Only tested on synthetic data; real-world application unvalidated — 'it is essential to test HDCM with real-world pharmacokinetic and pharmacodynamic datasets'","No benchmarking against NONMEM or other ML methods — 'Comparative studies are necessary'","Run time ~5 hours for 1000 MCMC samples on small synthetic dataset — potentially prohibitive for larger datasets or complex models","No sample size analysis; SHAP credible intervals are wide at N=30","IIV not added to all parameters (Q and V3 excluded in demonstration) — simplification not motivated"],"extracted_claims":[{"text":"DCM fell short in assessing residual errors and interindividual variability (IIV), potentially leading to model misspecification and overfitting. Furthermore, DCM lacked the ability to quantify model uncertainty.","location":"Abstract","evidence_type":"opinion"},{"text":"Bayesian analysis offered the added benefit of putting a penalty on the NN optimization via the prior information, which allows practitioners to train the NN on a small sample size without introducing significant overfitting.","location":"Discussion","evidence_type":"empirical"},{"text":"The high performance nature of the Julia language and the composability of the Julia workflow gives Julia an edge over other languages like Python and R.","location":"Discussion","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"performance_metric","description":"Typical PK parameter recovery error: V2, Q, CL, ka vs. true values","value":"V2 5.06%, Q 0.08%, CL 19.0%, ka 25.4%","value_numeric":null,"unit":"% error vs. true value","comparison_baseline":"true data-generating parameter values","location":"Table 2","is_primary_finding":true},{"metric_type":"study_statistic","description":"MCMC run time for N=30 synthetic dataset, 4 chains × 1000 samples","value":"~5 hours","value_numeric":5,"unit":"hours","comparison_baseline":null,"location":"Methods / Results","is_primary_finding":false},{"metric_type":"study_statistic","description":"Residual error posterior: median and 95% CI","value":"σ = 0.23 (95% CI: 0.20, 0.26), R-hat = 1.004","value_numeric":0.23,"unit":"proportional error (σ)","comparison_baseline":null,"location":"Table 1","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Directly fills M2.1 (Bayesian deep learning for PK): HDCM is the most complete implementation of Bayesian inference in a hybrid pharmacometric model available as open-source Julia workflow — adds full IIV + RUV + UQ to the DCM architecture","Extends and critiques janssen_2024 (deep compartment models): janssen_2024 added physiological constraints; HDCM adds Bayesian IIV/RUV — together they define the state-of-the-art in pharmacometric hybrid modeling","Provides a concrete criticism of DCM that the WG can use: 'DCM does not evaluate IIV or residual error' — motivating the HDCM work and framing why Bayesian approaches are necessary for regulatory-grade pharmacometric hybrid models"],"topics":["deep_compartment_model","hierarchical_Bayesian","MCMC","NUTS","IIV","population_PK","hybrid_mechanistic_ML","Julia","Metrum_Research_Group","SHAP","uncertainty_quantification"],"relevance_score":"high"},"relationships":{"cites":["janssen_2024"],"cited_by":[],"extends":["janssen_2024"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"full_text","notes":"Found via PubMed search 'Bayesian deep learning PK population UQ' (PMID 39402751). Full text retrieved from PMC11473376 (DOI: 10.1111/cts.70045). CTS 2024, 17(10):e70045. Open access. All 6 authors from Metrum Research Group (Tariffville, CT) — Kirouac D is senior author. Julia code available in Supplementary Materials. HDCM extends janssen_2024 by adding full Bayesian IIV/RUV; janssen_2024 extends lu_2021 by adding physiological constraints. This paper does NOT cite janssen_2024 explicitly (confirmed from extraction) but is architecturally an extension of the DCM line started by janssen_2024; relationship noted as extends."},"title_short":"HDCM: hierarchical deep compartment modeling with Bayesian IIV/RUV + UQ (Elmokadem et al., Metrum, CTS 2024)"},{"id":"shin_2024_llm","source_type":"paper","title":"Evaluation of ChatGPT and Gemini large language models for pharmacometrics with NONMEM","authors":["Shin E","Yu Y","Bies RR","Ramanathan M"],"year":2024,"doi":"10.1007/s10928-024-09921-y","pmid":38656706,"url":null,"journal_or_venue":"Journal of Pharmacokinetics and Pharmacodynamics","content":{"abstract_summary":"Systematic evaluation of ChatGPT 4.0 and Gemini Ultra 1.0 on NONMEM coding tasks relevant to pharmacometrics and clinical pharmacology. Tasks ranged from curriculum generation and code structure overview to generating complete NONMEM control streams for (1) a linear one-compartment oral PK model and (2) a complex model with two parallel first-order absorption mechanisms. Reproducibility and temperature hyperparameter effects also assessed. Both LLMs reviewed by two NONMEM experts. University at Buffalo (Ramanathan M). JPKPD 2024.","key_findings":["ChatGPT and Gemini can generate NONMEM curriculum structures that combine foundational knowledge with advanced concepts (covariate modeling, Bayesian approaches) and practical skills including control stream structure","Both LLMs generated NONMEM control stream code from lay-language prompts for both tasks (simple linear PK and complex dual-absorption), but code contained 'focal structural and syntax errors that required revision before they could be executed without errors and warnings'","LLM output was not reproducible: same prompts produced different code on repeat runs; varying the temperature hyperparameter did not substantively reduce errors or omissions","Key conclusion: LLMs useful for 'efficiently generating an initial coding template for modeling projects' but 'the output can contain errors and omissions that require correction' — positioning LLMs as accelerators requiring expert review, not replacements","Gemini and ChatGPT gave similar performance overall — both required correction by NONMEM ex
