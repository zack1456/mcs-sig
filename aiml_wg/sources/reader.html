= model influence × decision consequence (Figure 1 risk matrix): both factors are independently assessed, and risk scales from low (both low) to high (both high) — a key operationalizable construct for the WG","The COU is the central organizing concept: it defines what the AI model will do, how its output will be used, and whether other evidence (animal studies, clinical trials) will be used in conjunction — high COU specificity is required at every step","Drug discovery is explicitly out of scope; the guidance covers nonclinical, clinical, postmarketing, and manufacturing phases only","Internal operational uses (workflows, resource allocation, drafting submissions) are out of scope as long as they do not affect patient safety, drug quality, or study reliability","Life cycle maintenance of AI model credibility is a 'special consideration' (Section IV.B), particularly critical in manufacturing where models may be self-evolving or exposed to data drift","FDA strongly encourages early engagement: sponsors should bring the question of interest, COU, and model risk assessment to FDA before completing the credibility assessment plan","The framework was informed by ASME V&V40 ('Assessing the Credibility of Computational Modeling through Verification and Validation: Application to Medical Device') — a standards-grounded foundation that aligns with MCS's computational rigor emphasis","Required model evaluation elements include: independent test data (separate from training/tuning), performance metrics with confidence intervals (AUC-ROC, F1, PPV/NPV, PLR/NLR), uncertainty quantification, and bias documentation","The guidance explicitly requires describing uncertainty and confidence level of model predictions — a direct entry point for UQ methods (WG Pillar 2)","Pre-trained models must document pre-training dataset and how the model was obtained — covering transfer learning and foundation model adaptation","Ensemble methods, federated learning, and data drift are each explicitly named as considerations in the credibility assessment plan","The guidance cites Liu et al. 2023 (Clin Pharmacol Ther 113(4):771-774) — a landscape analysis of AI in regulatory submissions 2016-2021 — as the empirical basis for the claim that AI use in submissions has increased"],"methods_discussed":["credibility_assessment","context_of_use_framework","risk_based_framework","model_risk_matrix","uncertainty_quantification","life_cycle_maintenance","data_drift","ensemble_methods","federated_learning","transfer_learning","verification_and_validation"],"datasets_referenced":[],"tools_software":[],"limitations":["Draft guidance — nonbinding, not yet finalized; positions may shift before finalization","The guidance does not endorse any specific AI technique — methodology-agnostic by design","No quantitative thresholds for model risk levels are provided; risk assessment requires sponsor and FDA subject matter expertise and judgment","Does not cover drug discovery AI (explicitly out of scope)"],"extracted_claims":[{"text":"\"The risk-based credibility assessment framework described here consists of the following 7-step process to establish and assess the credibility of an AI model output for a specific COU based on model risk.\"","location":"Section IV.A, lines 117-119","evidence_type":"regulatory"},{"text":"\"Model risk is a combination of two factors: (a) model influence, which is the contribution of the evidence derived from the AI model relative to other contributing evidence used to inform the question of interest and (b) decision consequence, which describes the significance of an adverse outcome resulting from an incorrect decision concerning the question of interest.\"","location":"Section IV.A.3, lines 211-220","evidence_type":"regulatory"},{"text":"\"This guidance does not address the use of AI models (1) in drug discovery or (2) when used for operational efficiencies (e.g., internal workflows, resource allocation, drafting/writing a regulatory submission) that do not impact patient safety, drug quality, or the reliability of results from a nonclinical or clinical study.\"","location":"Section II (Scope), lines 47-50","evidence_type":"regulatory"},{"text":"\"Specify the process by which the uncertainty and confidence level of model predictions were estimated. If relevant, include any other descriptions or metrics that quantify confidence or uncertainty.\"","location":"Section IV.A.4.b (model evaluation), lines 459-461","evidence_type":"regulatory"},{"text":"\"The high-level key concepts and principles of the risk-based credibility assessment framework described in this guidance (sections IV.A.1 through A.3) were informed by an FDA-recognized consensus standard for medical devices titled 'American Society of Mechanical Engineers Assessing Credibility of Computational Modeling through Verification and Validation: Application to Medical Device' (ASME V&V40).\"","location":"Section II footnote 13","evidence_type":"regulatory"},{"text":"\"FDA strongly encourages sponsors and other interested parties to engage early with FDA to (1) set expectations regarding the appropriate credibility assessment activities for the proposed model based on model risk and COU and (2) help identify potential challenges and how such challenges may be addressed.\"","location":"Section IV.C (Early Engagement), lines 571-574","evidence_type":"regulatory"}],"numerical_findings":[{"metric_type":"count","description":"Number of steps in the FDA risk-based credibility assessment framework for AI models","value":"7","value_numeric":7,"unit":"N (steps)","comparison_baseline":null,"location":"Section IV.A, lines 117-119","is_primary_finding":true},{"metric_type":"count","description":"Number of independent factors composing model risk (model influence and decision consequence)","value":"2","value_numeric":2,"unit":"N (risk factors)","comparison_baseline":null,"location":"Section IV.A.3 (Step 3), Figure 1","is_primary_finding":true},{"metric_type":"count","description":"AI submissions reviewed by FDA (2016-2021), cited as empirical basis for increasing AI use in regulatory submissions","value":"not stated in document body — cited via Liu et al. 2023 (Clin Pharmacol Ther 113(4):771-774)","value_numeric":null,"unit":"N (submissions)","comparison_baseline":null,"location":"Section III (Background), footnote 14","is_primary_finding":false},{"metric_type":"count","description":"FDA centers jointly issuing this guidance (CDER, CBER, CDRH, CVM, OCE, OCP, OII)","value":"7","value_numeric":7,"unit":"N (FDA centers/offices)","comparison_baseline":null,"location":"Title page","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability","optimal_control_rl","generative_ai"],"gaps_addressed":["Provides the official FDA framework that the WG must operationalize for PK/PD-specific AI use cases — the COU and model risk constructs are the regulatory language pharmacometricians must speak","The mandatory uncertainty quantification requirement (Step 4.b) is a direct entry point for WG Pillar 2 (UQ/identifiability) work — no AI model passes without it","Hybrid mechanistic-ML models fall within scope (the guidance covers all AI approaches); the WG's task is to define what model influence, COU, and credibility evidence mean specifically for hybrid PK/PD models","Life cycle maintenance requirements (Section IV.B) directly apply to adaptive dosing models using RL (Pillar 3) — a model that continues learning post-deployment has special credibility challenges","Generative AI models (Pillar 4) face the highest documentation burden under Step 4 — pre-training dataset disclosure, model architecture, ensemble composition"],"topics":["regulatory","FDA","credibility_framework","context_of_use","model_risk","AI_validation","uncertainty_quantification","life_cycle_maintenance","MIDD","drug_development","ASME_VV40"],"relevance_score":"high"},"relationships":{"cites":["liu_2023"],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"provided_by_user","date_read":"2026-08-26","read_by":"claude","read_depth":"full_text","notes":"PDF provided by user (file: aiml_wg/background/fda_59502407dft.pdf). Full document read: cover pages, Table of Contents, Introduction (pp.1-2), Scope (p.3), Background (p.4), Section IV.A Steps 1-7 (pp.5-15), Section IV.B Life Cycle Maintenance (pp.16-17), Section IV.C Early Engagement (p.17). Footnote 14 cites Liu et al. 2023 (Clin Pharmacol Ther 113(4):771-774, doi:10.1002/cpt.2668) — a landscape analysis of AI in regulatory submissions 2016-2021 that should be added as a separate source record. A separate FDA-EMA joint AI principles document (January 2026) is also referenced in context but is not part of this guidance."},"title_short":"FDA draft guidance: AI to support regulatory decision making (2025)"},{"id":"liu_2023","source_type":"paper","title":"Landscape Analysis of the Application of Artificial Intelligence and Machine Learning in Regulatory Submissions for Drug Development From 2016 to 2021","authors":["Liu Q","Huang R","Hsieh J","Zhu H","Tiwari M","Liu G","Jean D","ElZarrad MK","Fakhouri T","Berman S","Dunn B","Diamond MC","Huang SM"],"year":2023,"doi":"10.1002/cpt.2668","pmid":35707940,"url":null,"journal_or_venue":"Clinical Pharmacology and Therapeutics","content":{"abstract_summary":"A 4-page FDA-internal landscape analysis by 13 CDER/CDRH scientists characterizing the volume, types, and trajectory of AI/ML use in regulatory submissions (IND, NDA, ANDA, BLA, CPIM, DDT) from 2016 to 2021. Total submissions containing AI/ML keywords: 158 (1, 1, 3, 7, 14, 132 by year), with a dramatic ~10-fold jump from 2020 to 2021. The vast majority (140/158) occurred at the clinical development stage; oncology dominated by therapeutic area. Six analysis types and nine application objectives are catalogued (Figure 2). Authors conclude the regulatory use of AI/ML will continue to increase, and signal ongoing FDA capacity-building to evaluate these submissions. The 2022 paper is the empirical baseline that directly motivated the 2025 FDA AI draft guidance (fda_ai_guidance_2025).","key_findings":["AI/ML-containing CDER submissions grew from 1/year in 2016–2017 to 132 in 2021 alone — an approximately 10-fold jump from 2020 (14) to 2021 (132); 2017–2020 growth was 2–3× annually","Total 158 submissions 2016–2021 identified by searching CDER databases for 'machine learning' or 'artificial intelligence' across IND, NDA, ANDA, BLA, CPIM, and Drug Development Tools submissions","Most submissions occurred at the clinical development stage (140/158); drug discovery/repurposing (4), nonclinical (8), and postmarketing (6) each accounted for fewer than 10 submissions","Oncology was the leading therapeutic area; psychiatry, gastroenterology, and neurology followed — consistent with data-rich disease areas and biomarker-heavy trial designs","Six AI/ML analysis types identified in submissions: outcome prediction, covariate selection/confounding adjustment, pharmacometric modeling, anomaly detection, imaging/video/voice analysis, RWD phenotyping/NLP","Nine application objectives identified: drug discovery/repurposing, drug toxicity prediction, enrichment design, patient risk stratification/management, dose selection/optimization, adherence monitoring, synthetic control, endpoint/biomarker assessment, postmarketing surveillance","FDA frequency counts likely underestimate actual AI/ML use: 'the frequency by which AI/ML is mentioned in regulatory submissions to the FDA likely only represents a fraction of its increasingly widespread use in drug discovery'","FDA and other regulators jointly identified 10 Good Machine Learning Practice (GMLP) guiding principles in 2021 (originally for medical devices, but noted as applicable to drug development)"],"methods_discussed":["landscape_analysis","keyword_search_regulatory_databases","pharmacometric_modeling","NLP","outcome_prediction","anomaly_detection","covariate_selection","synthetic_control"],"datasets_referenced":["FDA_CDER_IND_NDA_ANDA_BLA_CPIM_DDT_submissions_2016_2021"],"tools_software":[],"limitations":["Search limited to submissions mentioning 'machine learning' or 'artificial intelligence' by keyword — submissions using AI/ML without these exact terms are missed; authors themselves note this is likely a fraction of actual use","Covers CDER submissions only (drug/biologics); CDRH (device) AI/ML submissions not included in counts, though Diamond MC (CDRH) is a co-author","No statistical modeling of trends — descriptive counts only; no causal analysis of drivers of the 2021 spike","4-page Perspectives piece: examples of each category are illustrative, not exhaustive; analysis type and objective categories are not mutually exclusive","Disclaimer: 'The contents of this article reflect the views of the authors and should not be construed to represent the FDA's views or policies'"],"extracted_claims":[{"text":"\"submissions with AI/ML components have increased rapidly in the past few years. In 2016 and 2017, we identified only one such submission each year. From 2017 to 2020, the numbers of submissions increased by approximately twofold to threefold yearly. Then in 2021, the number of submissions increased sharply to 132 (approximately 10-fold as compared with that in 2020).\"","location":"Section: The Trend of Increasing AI/ML-Related Submissions at the FDA's CDER","evidence_type":"empirical"},{"text":"\"the frequency by which AI/ML is mentioned in regulatory submissions to the FDA likely only represents a fraction of its increasingly widespread use in drug discovery.\"","location":"Section: The Trend of Increasing AI/ML-Related Submissions","evidence_type":"opinion"},{"text":"\"It is important to note that the regulatory considerations for the application of AI/ML in drug development are evolving and will require input from all stakeholders in various disciplines.\"","location":"Section: Envisioning the Future","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"count","description":"AI/ML-containing CDER regulatory submissions in 2021 — the single-year peak driving the overall trend","value":"132","value_numeric":132,"unit":"N (submissions)","comparison_baseline":"vs. 14 in 2020 (~10-fold increase); 1 each in 2016 and 2017","location":"Figure 1a; Section: Trend","is_primary_finding":true},{"metric_type":"count","description":"Total AI/ML-containing CDER submissions identified across the full 2016–2021 period","value":"158","value_numeric":158,"unit":"N (submissions)","comparison_baseline":"annual breakdown: 1, 1, 3, 7, 14, 132 (2016–2021)","location":"Figure 1a","is_primary_finding":true},{"metric_type":"count","description":"Submissions at the clinical development stage — the dominant lifecycle phase for AI/ML use in FDA submissions","value":"140","value_numeric":140,"unit":"N (submissions)","comparison_baseline":"of 158 total; discovery/repurposing: 4, nonclinical: 8, postmarketing: 6","location":"Figure 1c; Section: Trend","is_primary_finding":false},{"metric_type":"count","description":"Number of distinct AI/ML analysis types catalogued across submissions","value":"6","value_numeric":6,"unit":"N (types)","comparison_baseline":"outcome prediction, covariate selection, pharmacometric modeling, anomaly detection, imaging/video/voice, RWD/NLP","location":"Figure 2; Section: Common Analysis Types","is_primary_finding":false},{"metric_type":"count","description":"Number of distinct AI/ML application objectives catalogued across submissions","value":"9","value_numeric":9,"unit":"N (objectives)","comparison_baseline":"drug discovery, toxicity prediction, enrichment design, risk stratification, dose optimization, adherence, synthetic control, endpoint/biomarker, postmarketing surveillance","location":"Figure 2; Section: Common Objectives","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability","optimal_control_rl","generative_ai"],"gaps_addressed":["Provides the empirical baseline — 158 submissions, 2016-2021, 10× jump in 2021 — that justifies the urgency of the WG's regulatory alignment work and the FDA's 2025 guidance","The six analysis types and nine objectives in Figure 2 map directly onto the WG's four pillars: pharmacometric modeling → hybrid_foundations; dose optimization → optimal_control_rl; biomarker assessment/anomaly detection → uq_identifiability; imaging/NLP → generative_ai","The 'fraction of actual use' caveat is an important rhetorical point for WG white papers arguing that the pharmacometrics community must proactively engage with AI/ML even if regulatory submissions don't yet reflect full industry adoption"],"topics":["regulatory","FDA","AI_ML_submissions","drug_development","landscape_analysis","MIDD","pharmacometric_modeling","clinical_trials","dose_optimization","biomarkers","NLP","synthetic_control"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["fda_ai_guidance_2025"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"provided_by_user","date_read":"2026-08-26","read_by":"claude","read_depth":"full_text","notes":"PDF provided by user (Clin Pharma and Therapeutics 2022 Liu Landscape Analysis.pdf). Published online 2022-06-16; print Clin Pharmacol Ther 113(4):771-774, April 2023. Open access (CC BY-NC). US Government work, public domain in the USA. Corresponding author: Hao Zhu (hao.zhu@fda.hhs.gov). First 4 authors (Liu Q, Huang R, Hsieh J, Zhu H) contributed equally. Hsieh J and Tiwari M were ORISE fellows. Full text read: all 4 pages including Figures 1a/1b/1c and Figure 2, all sections, references (10 refs). Relevance upgraded to high after full-text read."},"title_short":"FDA landscape: AI/ML in regulatory submissions 2016–2021 (Liu et al. 2023)"},{"id":"mcs_wg_2026v03","source_type":"working_doc","title":"MCS SIG AI Working Group Planning Document 2026 (v0.3)","authors":["Chakravarty S","Kenz Z"],"year":2026,"doi":null,"pmid":null,"url":null,"journal_or_venue":null,"content":{"abstract_summary":"The primary internal planning document for the MCS SIG AI/ML Working Group, version 0.3 (2026). Co-chaired by Sourish Chakravarty and Zackary Kenz, with Cameron Meaney as an active member. The WG is positioned within the MCS SIG's methodological mandate: it focuses on the mathematical and computational techniques underpinning AI/ML, advancing community awareness of methods that complement and extend traditional pharmacometrics. Key focus: testing and comparing generative AI methods and novel ML techniques (neural network applications) to assess how tools can be applied in existing and novel workflows. Secondary foci: external perspectives from Biopharma and broad AI community; cross-SIG collaboration; white papers, tutorials, and curated resources on the MCS SIG website. Six specific goals are enumerated, from organizing invited talks to authoring tutorials and collaborating with other ISoP SIGs.","key_findings":["WG leadership: Co-Chairs Sourish Chakravarty and Zackary Kenz; Active member Cameron Meaney (v0.3 roster)","MCS SIG AI/ML positioning: mathematical and computational techniques underpinning AI/ML, complementing and extending traditional pharmacometrics — explicit methodological differentiation from other ISoP SIGs","Primary focus: testing and comparing generative AI methods and novel ML techniques (neural network applications) for existing and novel MIDD workflows; sharing best MCS AI/ML practices","Secondary focus: external perspective from Biopharma AI experts; cross-SIG collaboration; collaborative authoring; pedagogical endeavors (tutorials, white papers)","Six specific goals: (1) invited AI-expert talks and panel discussions, (2) informal discussion forums/journal clubs, (3) assess relevant software tools and scientific articles, (4) author tutorials and white papers, (5) share curated knowledge on MCS SIG website, (6) collaborate with other ISoP SIGs and the broader ISoP community"],"methods_discussed":["generative_AI","neural_networks","machine_learning","AI_ML_workflows"],"datasets_referenced":[],"tools_software":[],"limitations":["Version 0.3 — early collaborative draft; specific technical priorities, planned publications, and timelines may evolve as membership grows","Short document: mission and 6 goals only; no detailed methodological content, pillar definitions, or publication roadmap in this version","Membership list reflects v0.3 state and likely does not represent the current full WG roster"],"extracted_claims":[{"text":"\"The MCS SIG focuses on the mathematical and computational techniques underpinning AI/ML, with the goal of advancing community awareness and improved understanding of methodologies that complement and extend traditional pharmacometrics.\"","location":"Opening paragraph","evidence_type":"opinion"},{"text":"\"A key focus of this MCS SIG AI working group is on testing and comparing generative AI methods and novel ML techniques (e.g., different neural network applications) to better assess how tools can be applied in existing and novel workflows, sharing the best MCS AI/ML practices to the wider community.\"","location":"Opening paragraph","evidence_type":"opinion"},{"text":"\"[The WG] will also seek out external perspectives from AI-experts from the Biopharma and broader AI community, and engage on this topic with the other SIGs and broader PMx community through collaborative authoring of white papers and tutorials, and through pedagogical endeavors.\"","location":"Opening paragraph","evidence_type":"opinion"}],"numerical_findings":[{"metric_type":"count","description":"Number of specific goals enumerated in the WG planning document v0.3","value":"6","value_numeric":6,"unit":"N (goals)","comparison_baseline":null,"location":"Specific Goals section","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability","optimal_control_rl","generative_ai"],"gaps_addressed":["Defines the WG's mandate, scope, and differentiation from other ISoP SIGs — the authoritative source for WG positioning in the literature review and white paper","Goal 3 (assess relevant software tools and scientific articles) directly motivates the source library this project builds","Goal 4 (author tutorials and white papers) and Goal 6 (collaborate with other SIGs) are the primary deliverables the source library is designed to support"],"topics":["MCS_SIG","working_group_planning","AI_ML","pharmacometrics","MIDD","generative_AI","neural_networks","cross_SIG_collaboration"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"provided_by_user","date_read":"2026-08-26","read_by":"claude","read_depth":"full_text","notes":"Original file: aiml_wg/MCS SIG AI working group 2026v0.3.docx (binary Word document; not readable by Claude Code tools). User exported to aiml_wg/MCS SIG AI working group 2026v0.3.txt, which was read directly. Document is short (15 lines): mission statement + 6 specific goals. Contains a Word smart-quote encoding artifact in the source text (SIG's rendered as SIG? in plain text). Full text captured; record upgraded from placeholder to full_text."},"title_short":"MCS SIG AI working group 2026 v0.3 (primary planning doc)"},{"id":"zhang_2022","source_type":"paper","title":"Two heads are better than one: current landscape of integrating QSP and machine learning — An ISoP QSP SIG white paper by the working group on the integration of quantitative systems pharmacology and machine learning","authors":["Zhang T","Androulakis IP","Bonate P","Cheng L","Helikar T","Parikh J","Rackauckas C","Subramanian K","Cho CR"],"year":2022,"doi":"10.1007/s10928-022-09805-z","pmid":35103884,"url":null,"journal_or_venue":"Journal of pharmacokinetics and pharmacodynamics","content":{"abstract_summary":"ISoP QSP SIG white paper from a 21-member, 18-organization working group (convened September 2019) on integrating QSP modeling and machine learning across drug development. Identifies four current integration categories (parameter estimation, model structure inference, dimension reduction, stochastic/virtual populations), presents four case studies, and concludes that QSP+ML is in early stages — moving from evaluating tools to building case studies — and serves as a foundation for future best-practices codification.","key_findings":["Four categories of integrated QSP+ML approaches: (1) parameter estimation and extraction from qualitative/quantitative data; (2) model structure inference including logic networks and sensitivity analysis; (3) dimension reduction to extract key variables from high-dimensional data; (4) stochasticity and virtual populations including generative models for population parameter inference","SciML ('scientific machine learning') uses mechanistic priors inside the learning architecture — represented in the paper as the universal differential equation framework and PINNs. Key hybrid form: [Depot]' = -KaNN([Depot],[Central]) where the unknown nonlinear feedback is replaced by a neural network while the mechanistic scaffold is retained","DeepXDE (biologically-informed neural networks) showed local optimization 100× to 10,000× more expensive than traditional approaches — a significant computational limitation for PINNs in QSP settings","Case study 1 (thrombosis): QSP model of coagulation pathway linked to ML event prediction; real-world event rate data at multiple doses used to train event prediction algorithm; supported clinical development of anti-coagulants","Case study 2 (drug-induced liver injury): QSP model with 112 coupled differential and algebraic equations; NLP used to identify gene-expression connections from literature; ML + QSP predicted relative impact of mechanistic hepatotoxic perturbations","Case study 3 (T cell differentiation): logic-based QSP model of T cell signaling; ML classification of dynamic response identified novel complex multi-fate T cell phenotypes and cytokine dosage-timing effects on T cell fate","Operational guidance: 'AI hierarchy of needs' (after Maslow) — must satisfy collect data → store → integrate → explore → model → report before ML is possible; most pharma companies are at the AI Outsourcing or ML-capable stage, not AI-driven","'The current state of the art does not include fully integrated hybrid QSP + ML models' — case studies are ML-assisted QSP modeling, not true hybrids; future goal is iteratively uncovering black box mechanisms through systematic analysis","Surrogate ML models trained on QSP simulation outputs are used to reduce computational burden for parameter space characterization and sensitivity analysis — an area where QSP and PMx practice already converge","Feature selection (FS) + QSP integration: two strategies: (a) FS first to identify minimal physiologically meaningful feature subset for QSP parameterization; (b) build full QSP model first, then apply dimension reduction — both aim for parsimonious models that balance interpretability and complexity"],"methods_discussed":["quantitative_systems_pharmacology","physics_informed_neural_networks","universal_differential_equations","scientific_machine_learning","biologically_informed_neural_networks","surrogate_ML_models","feature_selection","dimension_reduction","generative_adversarial_networks","normalizing_flows","Bayesian_neural_ODEs","virtual_population_generation","sensitivity_analysis","Boolean_network_modeling","logic_based_modeling","natural_language_processing","transfer_learning","multitask_deep_learning"],"datasets_referenced":["thrombosis_real_world_event_rate_data_multiple_doses","TransQST_hepatotoxicity_dataset","vaccine_hyporesponse_elderly_microbiome_data_NHP"],"tools_software":["DiffEqFlux (Julia)","DeepXDE","QSP toolbox (AAPS J, Cheng 2017)"],"limitations":["Scoped entirely within QSP (systems-scale mechanistic models, ODE/PDE/logic networks) rather than NLME-based pharmacometrics (compartmental PK/PD) — MCS WG operates in PMx space, so direct methodological overlap is partial","No fully integrated hybrid QSP+ML models existed at time of writing (2022) — all case studies are 'ML-assisted QSP', not true hybrids; the mechanistic and ML components are largely trained/estimated separately","DeepXDE/PINNs are 100-10,000× more computationally expensive than traditional ODE solvers for biologically-informed neural networks — practical scalability to clinical development timelines is unresolved","High-quality, high-volume clinical data remains the primary bottleneck for QSP+ML; decentralized trial data, wearables, and collaborative warehouses are emerging but data harmonization is unsolved","QSP models are 'chronically under-determined due to limited clinical and preclinical pharmacology data' — ML does not resolve this fundamental identifiability challenge; the paper does not address structural or practical identifiability of hybrid components","Published 2022 based on 2019–2021 scoping — landscape has shifted substantially with foundation models, SciML advances (Julia ecosystem), and regulatory developments since then"],"extracted_claims":[{"text":"\"The current state of the art does not include fully integrated hybrid QSP + ML models. The case studies presented are ML-assisted QSP modeling, using ML to address weaknesses of QSP models.\"","location":"Conclusions: Challenges and future perspectives","evidence_type":"opinion"},{"text":"\"The integration of QSP and ML is still in its early stages of moving from evaluating available technical tools to building case studies. Such integration offers multiple advantages from providing data-driven QSP model parameterization, to imposing a QSP model framework to increase interpretability of high dimensional data and fully data-driven QSP model structure discovery.\"","location":"Conclusions: Challenges and future perspectives","evidence_type":"review"},{"text":"\"ML can be oversold as a magic solution to every problem, but it is not... The right framework to think through is how to better understand an organization's decisions, how those decisions are currently made, when are they going to be made in the future, what information would be helpful to have at the time of the decision being made, and then, finally, how the data can be collected, processed, analyzed, and translated into an insight to inform that decision.\"","location":"Conclusions: Practical considerations","evidence_type":"opinion"},{"text":"A comparison of standard ODE solver based parameter estimation with the DeepXDE package used in Biologically-Informed Neural Networks showed local optimization of parameters was 100× to 10,000× more expensive than traditional approaches.","location":"Current approaches: Model structure (citing ref [35])","evidence_type":"empirical"},{"text":"\"[A] QSP model describing the mechanisms of necrosis, steatosis and cholestasis comprising 112 coupled differential and algebraic equations were constructed\" — then linked with gene-expression ML for hepatotoxicity prediction.","location":"Case studies: Prediction of drug induced liver injury","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"count","description":"QSP+ML working group membership and organizational representation","value":"21 members representing 18 academic and industry organizations","value_numeric":21,"unit":"N (members)","comparison_baseline":null,"location":"Abstract","is_primary_finding":false},{"metric_type":"computational_metric","description":"Computational cost of DeepXDE (biologically-informed neural networks) vs. traditional ODE parameter estimation","value":"100× to 10,000× more expensive","value_numeric":null,"unit":"fold increase in computational cost","comparison_baseline":"vs. standard ODE solver-based parameter estimation","location":"Current approaches: Model structure (citing ref [35])","is_primary_finding":true},{"metric_type":"count","description":"Number of coupled differential and algebraic equations in the QSP liver homeostasis model (hepatotoxicity case study)","value":"112","value_numeric":112,"unit":"N (equations)","comparison_baseline":null,"location":"Case studies: Drug-induced liver injury","is_primary_finding":false},{"metric_type":"count","description":"Total references cited — indicates comprehensive coverage of the 2019-2021 QSP+ML landscape","value":"94","value_numeric":94,"unit":"N (references)","comparison_baseline":null,"location":"Reference list","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Provides the sister SIG (QSP) taxonomy for hybrid mechanistic-ML integration — the four categories (parameter estimation, model structure, dimension reduction, stochastic/virtual) are directly mappable to WG Pillar 1 scope decisions; MCS WG should cite this taxonomy and clarify which categories apply at the PMx (NLME) scale vs. QSP (network) scale","The '100-10,000× more expensive' finding for PINNs/DeepXDE is a key quantitative limitation that motivates the iNODE approach (campo_manzanares_2026) — the two papers together frame the problem-and-solution arc for Pillar 1","The 'fully integrated hybrid QSP+ML models do not yet exist' conclusion (2022) establishes a clear benchmark: has this changed by 2026? The WG scoping paper should assess this explicitly","The AI hierarchy of needs framework is directly usable in the Pillar 4 position paper — it provides a principled framework for assessing organizational readiness for GenAI in drug development","Virtual population + ML (GAN/normalizing flow) methods discussed in Category 4 overlap with Pillar 4 (generative models) and inform the synthetic patient validation gap the WG has identified"],"topics":["quantitative_systems_pharmacology","machine_learning","hybrid_models","scientific_machine_learning","physics_informed_neural_networks","universal_differential_equations","virtual_populations","surrogate_models","feature_selection","drug_induced_liver_injury","thrombosis","T_cell_differentiation","ISoP","QSP_SIG","white_paper","cross_SIG","open_access"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"provided_by_user","date_read":"2026-08-26","read_by":"claude","read_depth":"full_text","notes":"PDF provided by user (14 pages, 582.9KB). Full text read: all sections — Rationale, Background (QSP modeling, ML for dimension reduction), Current Approaches (all 4 categories), Case Studies (thrombosis, liver injury, T cell differentiation, network inference), Conclusions (practical considerations, challenges, future perspectives), Glossary, References (94), Author Affiliations. Open Access CC BY 4.0. Corresponding authors: Tongli Zhang (tongli.zhang@uc.edu, U Cincinnati) and Carolyn R. Cho (carolyn.cho@merck.com, Merck). Rackauckas affiliation: Pumas-AI (Baltimore) AND MIT Department of Mathematics — the Julia/SciML connection. Peter Bonate: Astellas Pharma. Parikh: GSK. Subramanian: Applied BioMath. Upgraded from abstract_only."},"title_short":"Two heads are better than one: QSP+ML integration white paper (Zhang et al. 2022)"},{"id":"campo_manzanares_2026","source_type":"preprint","title":"Identifiability-aware neural ordinary differential equations for parsimonious and reliable dynamic modelling","authors":["Campo-Manzanares JL","Balsa-Canto E"],"year":2026,"doi":null,"pmid":null,"url":"https://arxiv.org/abs/2608.13044","journal_or_venue":"arXiv (q-bio.QM)","content":{"abstract_summary":"Proposes iNODE (identifiability-aware neural ODE), a framework that embeds structural and practical identifiability diagnostics directly into the neural ODE architecture selection and training process. Uses the Model Quality Ranking Index (MQRI) — a composite score combining Fisher Information Matrix-based identifiability, prediction confidence intervals, and validation error — to select parsimonious architectures. Demonstrates on four pharmacological benchmarks that iNODE produces models 20–50× smaller than conventional NODEs while achieving 3–6× lower validation errors and reducing maximum parameter confidence intervals from 881% to 84%.","key_findings":["iNODE integrates structural identifiability analysis (via symbolic tools) and practical identifiability (Fisher Information Matrix + profile likelihood) directly into architecture search, not as a post-hoc check","Model Quality Ranking Index (MQRI) is a composite metric weighting identifiability, parameter confidence intervals, and held-out validation error — enables systematic model selection across architectures without manual tuning","Benchmark 1 (PK/PD system): iNODE achieved 32 parameters vs. 1,362 in conventional NODE (42× smaller), with 3× lower validation error and dramatically tighter CIs","Benchmark results across 4 pharmacological case studies: maximum parameter CI reduced from 881% to 84% (representative benchmark) — non-identifiable conventional NODE parameters rendered practically useless for dose optimization or simulation","Architecture selection: iNODE prunes network width and depth based on identifiability metrics, converging on sparse architectures that are interpretable and reliably estimated from clinical trial-sized datasets","The iNODE framework is directly applicable to hybrid mechanistic-ML models (NLME context) where the mechanistic compartments are known but ML augmentation modules are unconstrained — a gap the MCS WG has identified for Pillar 1","Submitted August 13, 2026 — very recent preprint, not yet peer-reviewed; findings need independent replication across more complex model structures"],"methods_discussed":["neural_ODE","structural_identifiability","practical_identifiability","Fisher_Information_Matrix","profile_likelihood","architecture_search","model_selection","hybrid_mechanistic_ML","pharmacokinetics","pharmacodynamics"],"datasets_referenced":["pharmacological_benchmark_1_PK_PD_system","pharmacological_benchmark_2","pharmacological_benchmark_3","pharmacological_benchmark_4"],"tools_software":[],"limitations":["Preprint — not yet peer-reviewed; identifiability claims need independent replication","Benchmarks are pharmacological but may not capture the full complexity of NLME population models with inter-individual variability (IIV) — a critical dimension for PMx applications","MQRI weights (identifiability vs. validation error vs. CI width) are heuristically set — sensitivity of architecture selection to these weights is not fully characterized","Symbolic structural identifiability analysis does not scale well to very high-dimensional systems (e.g., QSP-scale models with 100+ ODEs); the practical scope is compartmental-to-moderate hybrid models","The 4 benchmarks are described as 'pharmacological' but case study specifics (drug, disease, data source) not fully detailed in the arXiv abstract — full-text read needed"],"extracted_claims":[{"text":"iNODE produces architectures 20–50× smaller than conventional NODE while achieving 3–6× lower validation errors","location":"Abstract / Results summary","evidence_type":"empirical"},{"text":"Maximum parameter confidence intervals reduced from 881% to 84% — non-identifiable conventional NODE parameters are practically useless for downstream inference and decision-making","location":"Results (representative benchmark)","evidence_type":"empirical"},{"text":"Identifiability analysis integrated as an architectural constraint, not a post-hoc diagnostic — this is the key methodological departure from prior neural ODE work","location":"Methods","evidence_type":"theoretical"}],"numerical_findings":[{"metric_type":"computational_metric","description":"Parameter count: iNODE vs. conventional NODE (Benchmark 1, PK/PD system)","value":"32 vs. 1,362","value_numeric":32,"unit":"N (parameters)","comparison_baseline":"vs. conventional NODE (1,362 parameters)","location":"Results, Benchmark 1","is_primary_finding":true},{"metric_type":"performance_metric","description":"Validation error reduction: iNODE vs. conventional NODE across benchmarks","value":"3–6× lower","value_numeric":null,"unit":"fold improvement","comparison_baseline":"vs. conventional NODE","location":"Results summary","is_primary_finding":true},{"metric_type":"effect_size","description":"Maximum parameter confidence interval width: conventional NODE vs. iNODE (representative benchmark)","value":"881% → 84%","value_numeric":84,"unit":"% CI width","comparison_baseline":"conventional NODE (881%)","location":"Results (representative benchmark)","is_primary_finding":true},{"metric_type":"computational_metric","description":"Architecture size reduction: iNODE vs. conventional NODE across benchmarks","value":"20–50×","value_numeric":null,"unit":"fold reduction in parameters","comparison_baseline":"vs. conventional NODE","location":"Abstract / Results summary","is_primary_finding":true},{"metric_type":"count","description":"Number of pharmacological benchmarks evaluated","value":"4","value_numeric":4,"unit":"N (benchmarks)","comparison_baseline":null,"location":"Methods / Results","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Directly fills the WG's Pillar 1 gap: the field lacks systematic methods to ensure neural ODE components in hybrid models are identifiable from clinical data — iNODE proposes the first architecture-level solution","MQRI provides a concrete model selection criterion for hybrid models that incorporates identifiability alongside predictive performance — exactly what M1.2 (structural identifiability of neural ODE components) and M1.4 (when do hybrids help?) need","Pillar 2 (UQ): the CI reduction results (881%→84%) quantify the practical cost of ignoring identifiability in UQ — a compelling motivating example for the WG's uncertainty quantification workstream","The 20–50× parameter reduction has regulatory implications — smaller, identifiable models are easier to inspect and validate under FDA's credibility assessment framework"],"topics":["neural_ODE","identifiability","structural_identifiability","practical_identifiability","Fisher_Information_Matrix","model_selection","hybrid_mechanistic_ML","pharmacokinetics","pharmacodynamics","arXiv_preprint","parsimonious_modeling"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"web_fetch","date_read":"2026-08-26","read_by":"claude","read_depth":"sections_key","notes":"Fetched from https://arxiv.org/html/2608.13044v1 (HTML version). arXiv submission date: August 13, 2026 (very recent). Authors: Campo-Manzanares JL and Balsa-Canto E — affiliation likely IIM-CSIC (Vigo, Spain, Balsa-Canto group). Preprint not yet peer-reviewed. Key sections read: abstract, methods (iNODE architecture, MQRI definition), results (4 benchmark tables), discussion/limitations. Full-text read is 'sections_key' — some benchmark details may be incomplete. Upgrade to full_text recommended once paper is published or if deeper analysis of MQRI weighting is needed."},"title_short":"iNODE: identifiability-aware neural ODEs for parsimonious modelling (Campo-Manzanares & Balsa-Canto 2026)"},{"id":"lu_2021","source_type":"paper","title":"Neural-ODE for pharmacokinetics modeling and its advantage to alternative machine learning models in predicting new dosing regimens","authors":["Lu J","Deng K","Zhang X","Liu G","Guan Y"],"year":2021,"doi":"10.1016/j.isci.2021.102804","pmid":34308294,"url":null,"journal_or_venue":"iScience","content":{"abstract_summary":"First application of neural-ODE to pharmacokinetics modeling, using clinical PK data from trastuzumab emtansine (T-DM1, HER2+ breast cancer mAb-drug conjugate). Compares neural-ODE, lightGBM, LSTM, and NLME (two-compartment nonlinear mixed-effects) on 675 patients from two dosing regimens (Q3W n=647, Q1W n=28). Cross-regimen validation — training on Q3W, predicting Q1W — is the key evaluation. Neural-ODE substantially outperforms all alternatives on cross-regimen generalization; all models perform similarly within-regimen. Genentech (Lu J), published in iScience 2021.","key_findings":["First study to apply neural-ODE to PK modeling — establishes neural-ODE as the foundational architecture for all subsequent neural ODE pharmacometrics work","Cross-regimen validation: neural-ODE RMSE 10.61 / R² 0.76 / Pearson 0.89 vs lightGBM RMSE 18.50 / R² 0.27, LSTM RMSE 19.56 / R² 0.15, NLME RMSE 15.21 / R² 0.68 — all bootstrap p < 0.05","Within-regimen validation: all models similar — neural-ODE RMSE 13.50 / R² 0.88; NLME 18.64 / 0.79 (only significant difference). Key message: neural-ODE advantage is extrapolation not interpolation","Neural-ODE correctly predicts PK falling to zero when dosing stops; LSTM and lightGBM predict nonzero values — LSTM learns from TIME not explicit dosing; neural-ODE directly incorporates dosing into state via ODE integration","Data augmentation (time-series truncation at 1008/1512/2016 hr) was required to prevent overfitting — real-world datasets are too small without augmentation; Q1W has only 28 patients","Architecture: GRU encoder → 12-element latent (6 mean + 6 std, variational) → ODE solver (4-layer FC, 16 hidden) → decoder. ODE directly incorporates dose events; code at zenodo + GitHub"],"methods_discussed":["neural_ODE","LSTM","lightGBM","NLME","pharmacokinetics","two_compartment_model","deep_learning","dosing_regimen_extrapolation","cross_regimen_validation","data_augmentation"],"datasets_referenced":["trastuzumab_emtansine_PK_n675_patients_5_trials"],"tools_software":["torchdiffeq","nlmixr","LightGBM","PyTorch"],"limitations":["Single drug (T-DM1, conjugated mAb) — generalizability to small molecules, different PK structures (e.g., flip-flop, enterohepatic recirculation) not demonstrated","Q1W cohort very small (n=28) — cross-regimen test set is underpowered for robust performance comparison","No mechanistic hybrid: the neural ODE replaces the entire ODE RHS rather than augmenting a known compartmental structure — identifiability and parameter interpretability not addressed","Individual-level only (not population NLME): IIV and between-subject variability not modeled by neural-ODE in this paper","Data augmentation required — implies NODEs cannot be trained on sparse clinical data without model-based simulation pre-training"],"extracted_claims":[{"text":"To date, neural-ODE is the most accurate PK model in predicting untested treatment regimens.","location":"Abstract","evidence_type":"empirical"},{"text":"The advantage of the neural-ODE model may come from its ability to deal with unevenly sampled data points. The alternative deep learning models such as LSTM tend to assume even sampling. Neural-ODE directly incorporates dosing and timing data into the model at the decoder stage.","location":"Discussion","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Total T-DM1 patients (Q3W: 647, Q1W: 28, total: 675); records: 16,472","value":"675","value_numeric":675,"unit":"N (patients)","comparison_baseline":null,"location":"Methods / Data","is_primary_finding":false},{"metric_type":"performance_metric","description":"Cross-regimen RMSE: neural-ODE vs lightGBM vs LSTM vs NLME","value":"10.61 vs 18.50 vs 19.56 vs 15.21","value_numeric":10.61,"unit":"RMSE (ng/mL)","comparison_baseline":"lightGBM 18.50, LSTM 19.56, NLME 15.21","location":"Results","is_primary_finding":true},{"metric_type":"performance_metric","description":"Cross-regimen R²: neural-ODE vs lightGBM vs LSTM vs NLME","value":"0.76 vs 0.27 vs 0.15 vs 0.68","value_numeric":0.76,"unit":"R²","comparison_baseline":"lightGBM 0.27, LSTM 0.15, NLME 0.68","location":"Results","is_primary_finding":true}]},"relevance":{"pillars":["hybrid_foundations"],"gaps_addressed":["The foundational benchmark for M1.1 — any WG review of neural ODE PK must cite this as the origin. Establishes the key evaluation criterion: cross-regimen generalization (not held-out patients from same protocol)","The LSTM/lightGBM dosing-stop failure is a concrete pedagogical example of why the ODE structure matters — directly usable in the WG scoping paper's argument for mechanistic-constrained architectures over pure deep learning"],"topics":["neural_ODE","pharmacokinetics","trastuzumab_emtansine","dosing_regimen_extrapolation","deep_learning","oncology","Genentech","cross_regimen_validation"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["janssen_2024","giacometti_2025","baaz_2026","aslanimoghankou_2026"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"full_text","notes":"Found via PubMed search 'neural ODE pharmacokinetics pharmacodynamics' (PMID 34308294). Full text retrieved from PMC8283337 (DOI: 10.1016/j.isci.2021.102804). iScience 2021, 24(9):102804. Genentech (Lu J = lead contact), Ann Arbor Algorithms (Deng K, Zhang X), U Michigan (Guan Y). T-DM1 data from 5 clinical trials (TDM3569g, TDM4258g, TDM4370g, TDM4374g, TDM4450g) — not public but available from Genentech on request. Code at zenodo + GitHub. Upgraded from abstract_only → full_text."},"title_short":"First neural ODE for PK: trastuzumab emtansine (Lu et al. 2021)"},{"id":"raue_2009","source_type":"paper","title":"Structural and practical identifiability analysis of partially observed dynamical models by exploiting the profile likelihood","authors":["Raue A","Kreutz C","Maiwald T","Bachmann J","Schilling M","Klingmüller U","Timmer J"],"year":2009,"doi":"10.1093/bioinformatics/btp358","pmid":19505944,"url":null,"journal_or_venue":"Bioinformatics","content":{"abstract_summary":"Introduces the profile likelihood approach to simultaneously detect structural non-identifiabilities (functionally related parameter combinations that produce identical model outputs regardless of data quality) and practical non-identifiabilities (arising from finite, noisy data) in partially observed dynamical models described by ODEs. Derives confidence intervals from the profile. Foundational methods paper for identifiability analysis in biological dynamical systems — widely cited as the standard methodology for practical identifiability in systems biology and pharmacometrics.","key_findings":["Profile likelihood approach distinguishes two distinct causes of non-identifiability: (1) structural — parameters are functionally related and cannot be separated even with infinite perfect data; (2) practical — parameters are theoretically identifiable but not from the available finite noisy data","Confidence intervals for parameters can be derived directly from the profile likelihood — superior to asymptotic (Fisher information matrix-based) intervals which assume local quadratic approximation","Structural non-identifiabilities manifest as flat profile likelihood ridges in the parameter space — detectable even without knowing the analytical parameter relationships","Method applies to partially observed systems (not all states measured) — the typical situation in clinical pharmacology and pharmacokinetics","Implementation: PottersWheel modeling toolbox for MATLAB; open source. The method has since been implemented in many pharmacometrics tools"],"methods_discussed":["profile_likelihood","structural_identifiability","practical_identifiability","confidence_interval_estimation","ODE_dynamical_systems","nonlinear_model_calibration"],"datasets_referenced":[],"tools_software":["PottersWheel (MATLAB)"],"limitations":["Profile likelihood is computationally expensive for high-dimensional parameter spaces — scales poorly beyond ~20 parameters without approximation","Requires optimization from multiple starting points to avoid local minima being misidentified as global profiles","Does not address identifiability of neural network components or ML-augmented ODE systems — extending profile likelihood to neural ODE hybrid models is an open problem (directly addressed by campo_manzanares_2026)"],"extracted_claims":[{"text":"\"We suggest an approach that exploits the profile likelihood. It enables to detect structural non-identifiabilities, which manifest in functionally related model parameters. Furthermore, practical non-identifiabilities are detected, that might arise due to limited amount and quality of experimental data.\"","location":"Abstract","evidence_type":"theoretical"}],"numerical_findings":[]},"relevance":{"pillars":["uq_identifiability","hybrid_foundations"],"gaps_addressed":["Provides the methodological foundation for M1.2 and M1.3 — any WG analysis of identifiability of neural ODE components must establish what profile likelihood says about the mechanistic parameters first, before extending to the ML components","The structural/practical identifiability distinction is the key conceptual frame for M1.2 — neural ODE components are generally structurally non-identifiable (redundant weight configurations), which is a different type of non-identifiability than the parameter correlations Raue addresses","Defines confidence intervals from profile likelihood — the gold standard that campo_manzanares_2026's MQRI is trying to match with FIM-based approximations for neural architectures"],"topics":["profile_likelihood","structural_identifiability","practical_identifiability","ODE_models","systems_biology","confidence_intervals","nonlinear_dynamics","parameter_estimation"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":["janzen_2017"],"extends":[],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via targeted PMID lookup (PMID 19505944). Bioinformatics 2009, 25(15):1923-1929. University of Freiburg Physics Institute group (Timmer lab). This is the most-cited identifiability methods paper in systems biology and is the standard reference for practical identifiability in pharmacometrics contexts. Abstract only but content is well-known; detailed methods are described in the abstract and widely reproduced. Upgrade to full_text not required for WG purposes — use as foundational reference in M1.2 literature review."},"title_short":"Profile likelihood identifiability: structural vs. practical (Raue et al. 2009)"},{"id":"janssen_2024","source_type":"paper","title":"On inductive biases for the robust and interpretable prediction of drug concentrations using deep compartment models","authors":["Janssen A","Bennis FC","Cnossen MH","Mathôt RAA"],"year":2024,"doi":"10.1007/s10928-024-09906-x","pmid":38532084,"url":null,"journal_or_venue":"Journal of Pharmacokinetics and Pharmacodynamics","content":{"abstract_summary":"Extends the deep compartment model (DCM) architecture — a hybrid mechanistic-ML PK model — by introducing physiological inductive biases (boundary constraints, global parameter estimation, multi-branch networks) to improve robustness in sparse data settings. Validates on simulated haemophilia A data (756 patients from NHANES covariates) and real clinical data (69 patients, standard half-life FVIII). The multi-branch network architecture enables model interpretability through visualization of learned covariate functions, eliminating the need for post-hoc SHAP. Key finding: naive neural-ODE achieves the WORST performance on sparse real data; physiological constraints are necessary. Amsterdam UMC, published in JPKPD 2024.","key_findings":["Naive DCM without constraints: 18% of models diverge on small data (N=20) producing physiologically implausible curves (peak FVIII up to 1340 IU/dL); global parameter constraints reduce divergence to 0.33% — constraints are not optional in sparse clinical settings","Neural-ODE (Lu et al. architecture) achieves the HIGHEST RMSE (worst performance) on real 69-patient sparse data (RMSE 19.5 IU/dL) vs multi-branch DCM 13.0 IU/dL and best NLME 13.7 IU/dL — contradict the narrative that neural-ODEs always outperform traditional methods; they fail with sparse data","Multi-branch network (separate sub-models per covariate) achieves lowest RMSE overall (13.0 IU/dL), outperforming the best previously published NLME model (13.7 IU/dL) — the only architecture that outperforms traditional pharmacometrics on this dataset","False covariates degrade performance: fully-connected DCM RMSE increases from 13.3 to 18.1 IU/dL when unimportant covariates added; multi-branch network less affected (15.6 IU/dL) — covariate selection is essential before fitting any DCM","Multi-branch architecture makes post-hoc explainability methods (SHAP) unnecessary: covariate effects are isolated by design and can be visualized directly — a cleaner approach to interpretability for regulatory purposes","Simulation study: 756 male NHANES individuals; 20-fold Monte Carlo CV × 5 model replicates = 100 replicates per condition; boundary constraints reduce divergence more than initialization but less than global parameter estimation"],"methods_discussed":["deep_compartment_model","inductive_biases","boundary_constraints","global_parameter_estimation","multi_branch_network","neural_ODE","NLME","haemophilia_A","SHAP","pharmacokinetics","covariate_modeling","population_PK","NONMEM"],"datasets_referenced":["NHANES_756_male_simulated_haemophilia_A","haemophilia_A_real_world_n69_FVIII"],"tools_software":["NONMEM"],"limitations":["Haemophilia A with only 3 measurements per patient (4h, 24h, 48h) — extremely sparse; results may not generalize to drugs with richer PK sampling","Neural-ODE failure may be specific to the very sparse data setting (N=69, 3 obs/patient) — does not mean neural-ODE underperforms in general","Multi-branch architecture requires a priori specification of which covariates connect to which PK parameters — shifts complexity from model fitting to study design; in practice still requires pharmacometric expertise","Identifiability of neural components not formally analyzed; practical robustness is addressed via constraints but theoretical identifiability is not"],"extracted_claims":[{"text":"We conclude that physiological-based constraints can improve model robustness. We describe an interpretable architecture which aids model trust, which will be key for the adoption of machine learning-based models in clinical practice.","location":"Abstract / Conclusion","evidence_type":"empirical"},{"text":"We show that all models were sensitive to learning false effects when trained in the presence of unimportant covariates, indicating the importance of selecting an appropriate set of covariates to link to the PK parameters.","location":"Abstract","evidence_type":"empirical"},{"text":"Fully ML-based architectures, such as the Neural-ODE, greatly simplify model development but suffer when data is sparse.","location":"Discussion","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Real-world clinical validation dataset size (haemophilia A, 3 obs/patient)","value":"69","value_numeric":69,"unit":"N (patients)","comparison_baseline":null,"location":"Methods","is_primary_finding":false},{"metric_type":"performance_metric","description":"RMSE on real data: multi-branch DCM vs best NLME vs naive DCM vs neural-ODE","value":"13.0 vs 13.7 vs >14 vs 19.5 IU/dL","value_numeric":13.0,"unit":"RMSE (IU/dL)","comparison_baseline":"best NLME 13.7, naive DCM >14, neural-ODE 19.5","location":"Results / Table","is_primary_finding":true},{"metric_type":"performance_metric","description":"Naive DCM divergence rate on small data (N=20)","value":"18%","value_numeric":18,"unit":"% divergent models","comparison_baseline":"global parameter constraint: 0.33%","location":"Results","is_primary_finding":true}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Critical counter-evidence for M1.4 (when do hybrids NOT help?): neural-ODE underperforms traditional pharmacometrics on sparse real data — this nuanced finding is essential for a balanced WG scoping paper","Provides the architectural solution to practical identifiability in M1.3: physiological constraints reduce the solution space to realistic regions, directly analogous to prior distributions in Bayesian estimation","Multi-branch interpretability without SHAP is a concrete regulatory-readiness contribution — shows that hybrid models can be designed to be intrinsically interpretable rather than relying on post-hoc approximations"],"topics":["deep_compartment_model","inductive_biases","physiological_constraints","haemophilia_A","FVIII","pharmacokinetics","interpretability","neural_ODE_failure","sparse_data","population_PK","Amsterdam_UMC","JPKPD"],"relevance_score":"high"},"relationships":{"cites":["lu_2021"],"cited_by":["kekic_2026","dette_2025","elmokadem_2024"],"extends":["lu_2021"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"full_text","notes":"Found via PubMed search 'neural ODE pharmacokinetics pharmacodynamics' (PMID 38532084). Full text retrieved from PMC11255087 (DOI: 10.1007/s10928-024-09906-x). JPKPD 2024, 51(4):355-366. Amsterdam UMC (Janssen A = corresponding, a.janssen@amsterdamumc.nl). Open access. The neural-ODE underperformance finding (19.5 vs 13.0 RMSE) is the most important counter-example in the library — essential for balanced WG messaging that avoids overclaiming. Upgraded from abstract_only → full_text."},"title_short":"Deep compartment models with physiological inductive biases: haemophilia A (Janssen et al. 2024)"},{"id":"baaz_2026","source_type":"paper","title":"The Empirical Bayes Variational Autoencoder — A Neural ODE Approach for Population Modeling in Pharmacology","authors":["Baaz M","Sjöberg A","Jirstrand M"],"year":2026,"doi":"10.1002/psp4.70280","pmid":42310401,"url":null,"journal_or_venue":"CPT: Pharmacometrics & Systems Pharmacology","content":{"abstract_summary":"Proposes an empirical Bayes VAE (EB-VAE) framework combining variational autoencoder encoder-decoder architecture with neural ODE decoders for population pharmacokinetic modeling. Integrates covariate-dependent population priors and correlated latent representations to enable probabilistic inference of individual PK parameters. Validated on simulation studies and a small clinical benchmark. Shows that the EB-VAE captures population-level variability correctly where a fixed-prior VAE exhibits systematic bias, and demonstrates comparable predictive performance to prior neural ODE approaches in cross-validation. Fraunhofer-Chalmers Centre, Sweden, 2026.","key_findings":["Empirical Bayes VAE integrates encoder-decoder architecture with covariate-dependent population priors — enabling correlated latent representations and probabilistic inference of individual parameters; this places it squarely in the VAE-for-NLME category (M1.1)","In simulation with correlated individual parameters, EB-VAE correctly captured population-level variability, while fixed-prior VAE showed systematic biases — demonstrates that population prior structure matters for correctness of IIV estimation","Input-response normalization improved extrapolation beyond training dosing schedules compared to models without normalization — a practical finding for generalizability","Latent variables showed clear relationships with true underlying parameters in diagnostic analysis — interpretability of latent space achieved, relevant for regulatory trust","Cross-validation on small clinical benchmark: predictive performance comparable to previously reported neural ODE approaches","The paper explicitly frames this as a 'methodological proof-of-concept' highlighting 'both the potential and the current limitations of variational neural approaches in pharmacometric applications'"],"methods_discussed":["variational_autoencoder","neural_ODE","empirical_Bayes","population_PK","probabilistic_inference","latent_variable_model","covariate_modeling"],"datasets_referenced":["simulation_correlated_individual_parameters","small_clinical_benchmark_dataset"],"tools_software":[],"limitations":["Small clinical dataset used for validation — 'methodological proof-of-concept' by authors' own assessment; larger clinical validation is needed","Extrapolation beyond training dosing schedules showed 'stable predictive behavior' only within a 'limited range' with normalization — not demonstrated for large extrapolations","Identifiability of neural ODE decoder components is not formally assessed — the probabilistic inference handles parameter uncertainty but not structural identifiability of the architecture"],"extracted_claims":[{"text":"\"The proposed framework should be viewed as a methodological proof-of-concept, highlighting both the potential and the current limitations of variational neural approaches in pharmacometric applications.\"","location":"Abstract","evidence_type":"opinion"},{"text":"In simulation experiments with correlated individual parameters, the empirical Bayes VAE consistently captured population-level variability, whereas a fixed-prior VAE baseline exhibited systematic biases.","location":"Abstract / Results","evidence_type":"empirical"}],"numerical_findings":[]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Fills the VAE-for-NLME slot in M1.1 architecture taxonomy — the only published paper applying a Bayesian VAE + neural ODE framework specifically for population PK inference, making it the most direct reference for this hybrid category","Directly relevant to M2.1 (Bayesian UQ for hybrid models): the probabilistic inference via variational autoencoder is a concrete UQ implementation for neural ODE PK models","Published in CPT:PSP — the WG's target journal for the white paper; demonstrates this research direction is publishable there and provides a benchmark for the WG's own contributions"],"topics":["variational_autoencoder","neural_ODE","empirical_Bayes","population_pharmacokinetics","probabilistic_inference","NLME","Fraunhofer_Chalmers","CPT_PSP","VAE_for_NLME"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":["lu_2021"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'neural ODE pharmacokinetics pharmacodynamics' (PMID 42310401). CPT:PSP 2026, 15(7):e70280. Fraunhofer-Chalmers Centre Gothenburg, Sweden (Jirstrand M group). Very recent (2026). No PMC listed in metadata. Upgrade to full_text recommended — published in the WG's target journal and directly fills the VAE-for-NLME M1.1 slot."},"title_short":"Empirical Bayes VAE + neural ODE for population PK (Baaz et al. 2026)"},{"id":"aslanimoghankou_2026","source_type":"paper","title":"Generative modeling of clinical time series via latent stochastic differential equations","authors":["Aslanimoghanloo M","ElGazzar A","van Gerven M"],"year":2026,"doi":"10.1016/j.jbi.2026.105043","pmid":42000010,"url":null,"journal_or_venue":"Journal of Biomedical Informatics","content":{"abstract_summary":"Proposes a generative framework based on latent neural stochastic differential equations (neural SDEs) for modeling irregularly sampled clinical time series as discrete observations of an underlying controlled stochastic dynamical system. Combines neural SDE latent dynamics with modality-dependent emission models and variational inference. Validates on three tasks: individual treatment effect estimation (simulated PKPD of lung cancer), probabilistic glucose forecasting (Bergman Minimal Model synthetic data), and physiological signal forecasting (real-world ICU data, 12,000 patients). Outperforms latent ODE, controlled DE, and LSTM baselines, with consistent advantages in uncertainty calibration.","key_findings":["Latent neural SDEs model disease progression and measurement noise as a controlled stochastic dynamical system — the SDE formulation naturally captures stochasticity of disease progression, unlike deterministic neural ODEs","Validated on simulated PKPD of lung cancer: individual treatment effect estimation — demonstrates the framework's applicability to pharmacological decision-making scenarios","Bergman Minimal Model (glucose-insulin) used as a physics-grounded synthetic benchmark — the mechanistic model provides ground truth for evaluating generative model calibration","Real-world ICU data from 12,000 patients: probabilistic forecasting of physiological signals — the largest real-world validation in the paper","Consistent advantages in uncertainty calibration across all three datasets vs. latent ODE, CDE, and LSTM baselines — UQ improvement is the primary headline contribution","Framework handles irregularly sampled observations natively, learns complex nonlinear interactions, and captures stochasticity within a unified scalable probabilistic framework"],"methods_discussed":["neural_stochastic_differential_equations","latent_variable_model","variational_inference","generative_model","uncertainty_quantification","calibration","pharmacokinetics","pharmacodynamics","Bergman_minimal_model"],"datasets_referenced":["simulated_PKPD_lung_cancer_treatment_effect","Bergman_Minimal_Model_glucose_synthetic","ICU_real_world_12000_patients"],"tools_software":[],"limitations":["PKPD validation is on simulated data only — the lung cancer treatment effect task uses a simulator, not real clinical trial data","The SDE formulation adds stochastic complexity vs. neural ODE — whether the additional complexity is justified for standard PK/PD (where residual variability is already captured by NLME) is not addressed","Structural identifiability of the latent SDE components is not assessed","Scalability to NLME-style population modeling (multiple individuals, hierarchical parameters) is not demonstrated"],"extracted_claims":[{"text":"The framework achieves consistent advantages in uncertainty calibration across all datasets compared to latent ODE, controlled differential equation, and LSTM baselines.","location":"Abstract / Results","evidence_type":"empirical"},{"text":"The formulation naturally handles irregularly sampled observations, learns complex nonlinear interactions, and captures the stochasticity of disease progression and measurement noise within a unified scalable probabilistic framework.","location":"Abstract","evidence_type":"theoretical"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Real-world ICU dataset size for physiological signal forecasting validation","value":"12,000","value_numeric":12000,"unit":"N (patients)","comparison_baseline":null,"location":"Abstract / Methods","is_primary_finding":false}]},"relevance":{"pillars":["generative_ai","uq_identifiability"],"gaps_addressed":["Directly fills the M4.1 gap: a physics-grounded generative model (latent SDE with Bergman model as benchmark) for clinical time series — provides a concrete example of how ODE-prior knowledge can be embedded in generative model validation frameworks","The uncertainty calibration results (consistent advantages across all datasets) address M2.3 (ensemble/stochastic uncertainty) — latent SDEs are an alternative to ensemble methods for UQ","The Bergman Minimal Model benchmark is directly usable by the WG: it provides a controlled validation framework that any proposed generative PK/PD method could be tested against"],"topics":["neural_SDE","generative_model","uncertainty_calibration","clinical_time_series","PKPD","lung_cancer","Bergman_model","glucose_insulin","ICU","stochastic_differential_equations","Radboud_University"],"relevance_score":"high"},"relationships":{"cites":[],"cited_by":[],"extends":["lu_2021"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"abstract_only","notes":"Found via PubMed search 'neural ODE pharmacokinetics pharmacodynamics' (PMID 42000010). J Biomed Informatics 2026, 179:105043. Radboud University Nijmegen (Donders Institute, van Gerven M group). Published April 2026. No PMC entry in metadata. Upgrade to full_text recommended — fills both M4.1 and M2.3 gaps, and the Bergman benchmark is directly usable for WG validation framework design."},"title_short":"Latent neural SDEs for clinical time series with uncertainty calibration (Aslanimoghanloo et al. 2026)"},{"id":"giacometti_2025","source_type":"paper","title":"Leveraging Neural ODEs for Population Pharmacokinetics of Dalbavancin in Sparse Clinical Data","authors":["Giacometti T","Rocchi E","Cojutti PG","Magnani F","Remondini D","Pea F","Castellani G"],"year":2025,"doi":"10.3390/e27060602","pmid":40566189,"url":null,"journal_or_venue":"Entropy (Basel)","content":{"abstract_summary":"Applies neural ODEs to population pharmacokinetics of dalbavancin (a long-acting lipoglycopeptide antibiotic) in 218 real-world patients from IRCCS Azienda Ospedaliero Universitaria di Bologna (April 2021 - December 2024), comparing against a two-compartment model and NLME (Monolix) using 6-fold cross-validation. Data augmentation (pre-training on 2-compartment simulations) was essential — training without it led to gradient divergence in most folds. KS test confirms: NODE and NLME residuals are statistically indistinguishable without covariates; NODE significantly outperforms with covariates. SHAP analysis shows covariates act as 'correction factors' not primary drivers. University of Bologna Physics + IRCCS.","key_findings":["NODE with covariates significantly outperforms NLME and two-compartment model (KS test p significant); without covariates NODE and NLME are statistically indistinguishable — covariate complexity is the deciding factor for whether NODE adds value","Data augmentation (pre-training on 2-compartment simulations for 100 epochs before 200 epochs fine-tuning on real data) was required — without it, gradient divergence prevented convergence in most cross-validation folds","SHAP analysis: concentration and time are the primary drivers of NODE predictions; covariates are 'correction factors' with limited influence on the derivative of the concentration curve — NODEs leverage covariate information but ODE dynamics dominate","Two-compartment model systematically underestimates long-term dalbavancin concentrations (KS test p significant vs both NODE and NLME) — this is the primary clinical failure mode that motivated the study (TDM optimization)","Distribution volume Vd estimated by NODE: 14.18 ± 1.28 L (without covariates) and patient-specific (with covariates, mean consistent with literature) — NODE learns physiologically consistent parameters","NODEs represent 'a promising alternative for pharmacokinetic modeling, particularly in capturing complex covariate interactions, even when dealing with sparse and small datasets' (authors' conclusion)"],"methods_discussed":["neural_ODE","population_PK","NLME","SHAP","data_augmentation","6_fold_cross_validation","Kolmogorov_Smirnov_test","Monolix","dalbavancin","sparse_data","therapeutic_drug_monitoring","torchdiffeq","feedforward_neural_network"],"datasets_referenced":["dalbavancin_clinical_PK_n218_patients_IRCCS_Bologna_2021_2024"],"tools_software":["Monolix","torchdiffeq","PyTorch"],"limitations":["Data augmentation required (pre-training on 2-compartment simulations) — NODEs cannot be trained on sparse real-world data without model-based augmentation; introduces parametric assumptions from the augmentation model","Without covariates NODE provides no improvement over NLME — the advantage is conditional on complex covariate effects being present; for drugs with simple PK-covariate relationships, NLME suffices","SHAP interpreted on the neural network RHS (derivative of concentration) not the concentration itself — interpretation is one step removed from clinical endpoints and less intuitive for pharmacometricians","Authors' ODE structure is fully data-driven (not a constrained compartment form like DCM) — no physiological constraints, so the same instability as naive DCM could appear in other sparse datasets"],"extracted_claims":[{"text":"In the absence of covariates, NODEs performed comparably to state-of-the-art NLME models. However, when covariates were incorporated, NODEs demonstrated superior predictive accuracy.","location":"Abstract","evidence_type":"empirical"},{"text":"Training without synthetic data proved largely unstable in this study due to the discontinuous and sparse nature of the original dataset. In most cases, gradient divergence prevented full convergence of the models.","location":"Methods","evidence_type":"empirical"},{"text":"These results establish NODEs as a promising alternative for pharmacokinetic modeling, particularly in capturing complex covariate interactions, even when dealing with sparse and small datasets.","location":"Conclusions","evidence_type":"empirical"}],"numerical_findings":[{"metric_type":"study_statistic","description":"Clinical PK dataset size: dalbavancin, real-world patients (145 males, 73 females; 703 administrations; 669 concentration measurements)","value":"218","value_numeric":218,"unit":"N (patients)","comparison_baseline":null,"location":"Methods","is_primary_finding":false},{"metric_type":"model_parameter","description":"NODE distribution volume without covariates (comparable to 2-compartment central volume)","value":"14.18 ± 1.28","value_numeric":14.18,"unit":"L","comparison_baseline":"literature 2-compartment estimates","location":"Results","is_primary_finding":false}]},"relevance":{"pillars":["hybrid_foundations","uq_identifiability"],"gaps_addressed":["Provides the most complete real-world sparse-data test of the covariate decision criterion from M1.4: NODE outperforms only when covariate effects are complex enough that NLME's fixed functional form is limiting — a concrete clinical example to anchor WG recommendations","The data augmentation requirement is a direct practical constraint for M1.3: NODEs are less data-efficient than NLME; the hybrid strategy (pre-train on ODE simulation, fine-tune on real data) is itself a form of mechanistic prior injection"],"topics":["neural_ODE","population_PK","NLME","dalbavancin","antibiotic","sparse_data","covariate_modeling","SHAP","interpretability","data_augmentation","therapeutic_drug_monitoring","University_of_Bologna","IRCCS"],"relevance_score":"high"},"relationships":{"cites":["lu_2021"],"cited_by":[],"extends":["lu_2021"],"contradicts":[]},"provenance":{"how_obtained":"pubmed_search","date_read":"2026-08-27","read_by":"claude","read_depth":"full_text","notes":"Found via PubMed search 'neural ODE pharmacokinetics pharmacodynamics' (PMID 40566189). Full text retrieved from PMC12192077 (DOI: 10.3390/e27060602). Entropy (Basel) 2025, 27(6):602. University of Bologna (Physics dept: Giacometti T, Rocchi E, Magnani F, Remondini D, Castellani G; IRCCS clinical pharmacology: Cojutti PG, Pea F). Real-world TDM data. The data augmentation pre-training strategy is a concrete and reproducible technique any WG member could apply to a similar sparse-data problem. Upgraded from abstract_only → full_text."},"title_short":"Neural ODE vs. NLME for dalbavancin pop PK, 218 patients (Giacometti et al. 2025)"},{"id":"cminns_2024","source_type":"paper","title":"CMINNs: Compartment model informed neural networks — Unlocking drug dynamics","authors":["Ahmadi Daryakenari N","Wang S","Karniadakis G"],"year":2024,"doi":"10.1016/j.compbiomed.2024.109392","pmid":39608036,"url":null,"journal_or_venue":"Computers in Biology and Medicine","content":{"abstract_summary":"Proposes CMINNs (Compartment Model Informed Neural Networks), a physics-informed neural network framework that embeds fractional calculus and time-varying parameters into compartmental PK/PD models. Uses PINNs and fractional PINNs (fPINNs) to simultaneously model anomalous diffusion, drug resistance, tolerance, and time-varying PK parameters within systems of two (fractional) ODEs. Demonstrates on cancer pharmacodynamics with multi-dose regi
